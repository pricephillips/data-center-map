# Deliverable prose lint (spec 004, US4). Internal pipeline reports are out of
# scope; deliverables are headline_metrics.md, docs/*_report*.md, and anything
# under deliverables/ (spec 010). The fixtures prove the rules.
StylesPath = styles
MinAlertLevel = warning

[{headline_metrics.md,docs/*_report*.md,deliverables/**/*.md,models/cards/*.md,tests/fixtures/vale/*.md}]
BasedOnStyles = Hawthorn
