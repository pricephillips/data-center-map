/* A percentile drawn as a position on a track. The quartile ticks are there so
 * the marker is read against something; a bare marker on an empty bar invites
 * the reader to treat the position as a magnitude. */
function pct_cell(p) {
  var n = num(p);
  if (n === null) return '<span class="pct-num">—</span>';
  return '<div class="pct"><div class="pct-track">' +
    '<b style="left:25%"></b><b style="left:50%"></b><b style="left:75%"></b>' +
    '<i style="left:calc(' + n.toFixed(1) + '% - 1.5px)"></i></div>' +
    '<span class="pct-num">' + Math.round(n) + '</span></div>';
}

/* The delta against a reference, coloured only where the metric declares a
 * direction. "More restriction pressure" is the accent colour used everywhere
 * else on this page for a restriction signal; a neutral metric gets no colour
 * at all, because there is no such thing as a good or bad median income here. */
function vs_cell(metric, value, reference) {
  var v = num(value), r = num(reference);
  if (v === null || r === null) return '<span class="vs flat">—</span>';
  var d = v - r;
  var dir = METRIC_DIRECTION[metric] || 'neutral';
  var cls = 'flat';
  if (dir === 'up_is_more_restrictive') cls = d > 0 ? 'more' : (d < 0 ? 'less' : 'flat');
  else if (dir === 'up_is_less_restrictive') cls = d > 0 ? 'less' : (d < 0 ? 'more' : 'flat');
  var sign = d > 0 ? '+' : '';
  return '<span class="vs ' + cls + '">' + sign + fmt_delta(metric, d) + '</span>';
}

/* ------------------- evidence behind the label -------------------- *
 * This page makes a claim about every county it renders: an enacted
 * restriction is on record, or none is. For 2,893 of 3,222 counties the
 * claim is the negative one, and until this section existed the page
 * made it by saying nothing at all. An empty restriction section is not
 * a neutral absence to a reader deciding where to site a facility; it
 * reads as "checked, and clear". The ledger records which source
 * families were actually consulted for each county and grades the
 * result, so the honest answer is available and is usually "nobody has
 * checked this one yet". Saying that plainly is the point.
 *
 * The grade vocabulary is pre-registered in
 * configs/restriction_evidence_sources.json and is reproduced here as
 * prose rather than re-derived, so the page cannot drift into grading
 * counties by its own rule. */

/* Short titles for the badge. D is deliberately phrased for what it always
 * means -- nothing on record supports this label -- rather than for the more
 * common of the two routes to it, since the other route is a county that WAS
 * consulted. grade_reading() carries the distinction in prose. */
var GRADE_TITLE = {
  A: 'Corroborated', B: 'Single source', C: 'Partial',
  D: 'Nothing supports this', U: 'Unverified'
};
/* Plain-language readings of the pre-registered rubric. Each says what the
 * grade licenses a reader to do, which is the question a client actually
 * has, rather than restating the rule that produced it. */
var GRADE_CLEAR = {
  A: 'Two or more independent kinds of source were consulted and agree that ' +
     'nothing is on the books here, all within the freshness window. This is ' +
     'the strongest clear reading this repository issues.',
  B: 'One independent kind of source was consulted and found nothing on the ' +
     'books, within the freshness window. Reasonable to rely on, but it rests ' +
     'on a single line of evidence.',
  C: 'A check ran but did not complete: coverage was partial, or a source ' +
     'could not be reached. Treat the clear reading as provisional.',
  /* D is the grade for "nothing supports this label", and it is reached two
   * different ways. See grade_reading(): a D whose families were consulted is
   * NOT an unexamined county, and saying so would be false. */
  D: 'A registered source family covers this county, but the check has not ' +
     'run yet. Nothing here has been looked at; the label is the absence of a ' +
     'tracker row, not a finding.',
  D_consulted: 'A source that covers this county was consulted, and nothing ' +
     'it returned can support a clear reading. A restriction census records ' +
     'adopted instruments only: it can confirm that a restriction exists and ' +
     'can never establish that none does. So this county has been looked at, ' +
     'and the look could not have cleared it either way.',
  U: 'No registered source family covers this county at all. Nothing has been ' +
     'checked and nothing could have been. The label means only that no ' +
     'tracker row asserts a restriction — it is not evidence of absence.'
};
var GRADE_POSITIVE = {
  A: 'The restriction on record is corroborated by two or more independent ' +
     'kinds of source, within the freshness window.',
  B: 'The restriction on record is supported by one independent kind of ' +
     'source, within the freshness window.',
  C: 'A check ran but did not complete, so the restriction on record is only ' +
     'partially supported.',
  D: 'A registered source family covers this county but has not been checked ' +
     'yet, so the restriction on record rests on the tracker alone.',
  D_consulted: 'A source that covers this county was consulted, and nothing ' +
     'it returned corroborates the restriction on record, which therefore ' +
     'rests on the tracker alone.',
  U: 'No registered source family covers this county, so the restriction on ' +
     'record rests on the tracker alone and has no independent support here.'
};
/* Conflicts are the ledger's own cross-checks. Rendered in the reader's
 * terms: what disagrees with what, and what it would take to settle it. */
var CONFLICT_TEXT = {
  label_negative_source_hit:
    'A source in the reviewed census reports an adopted instrument here, ' +
    'while this county is recorded as having none. One of the two is wrong ' +
    'and this is the strongest form of that disagreement, because the census ' +
    'row has already been reviewed.',
  label_negative_upstream_hit:
    'An unreviewed upstream row reports an adopted instrument here, while ' +
    'this county is recorded as having none. The upstream row has not been ' +
    'reviewed, so this raises a question about the label rather than ' +
    'overturning it.',
  label_positive_no_support:
    'This county is recorded as restrictive on tracker evidence, and no ' +
    'registered source family has been checked to corroborate it. The label ' +
    'is not contradicted — it is simply unsupported by anything ' +
    'independent of the tracker.'
};
var CONFLICT_TITLE = {
  label_negative_source_hit: 'Reviewed source contradicts a clear label',
  label_negative_upstream_hit: 'Unreviewed source questions a clear label',
  label_positive_no_support: 'Restrictive label with no independent support'
};

/* Display names for the ledger's internal vocabulary. Mirrored from
 * configs/restriction_evidence_sources.json rather than invented here, so the
 * page and the registry name the same things the same way. An unmapped value
 * falls through to the raw token: better a reader sees "meeting_portal" and
 * asks than that the page silently drops a family it was told about. */
var FAMILY_TEXT = {
  municipal_code: 'Municipal code libraries',
  meeting_portal: 'County meeting agendas and minutes',
  restriction_census: 'Third-party restriction censuses',
  state_aggregator: 'State-level ordinance and planning repositories'
};
var CLASS_TEXT = {
  primary_law: 'primary law (the instrument as the jurisdiction published it)',
  proceeding: 'proceeding (the adopting body\u2019s own deliberative record)',
  secondary: 'secondary (a third-party compilation that read one of the above)'
};
var PROBE_TEXT = {
  never_probed: 'never checked',
  complete: 'checked',
  partial: 'partly checked',
  unreachable: 'source unreachable'
};

/* Renders a semicolon- or comma-separated token list in the reader's terms. */
function vocab_list(raw, map) {
  return String(raw || '').split(/[;,]/)
    .map(function (t) { return t.trim(); })
    .filter(function (t) { return t; })
    .map(function (t) { return map[t] || t; })
    .join(', ');
}

/* Picks the reading for a grade. Exists because grade D is reached two ways:
 * a county no source has been consulted for, and a county whose sources WERE
 * consulted but returned nothing that can support the label. The ledger
 * reaches the same letter for both (grade_county() falls through to D on a
 * non-empty `covered` set), and the difference is legible only in
 * families_checked. Telling a client "nothing here has been looked at" about a
 * county where a reviewed census actively reported a moratorium would be a
 * false statement on the section whose purpose is to prevent exactly that. */
function grade_reading(g, is_clear, e) {
  var map = is_clear ? GRADE_CLEAR : GRADE_POSITIVE;
  var consulted = String(e.families_checked || '').trim() !== '';
  if (g === 'D' && consulted && map.D_consulted) return map.D_consulted;
  return map[g] || 'No grade is on record for this county.';
}

function grade_flag(g) {
  /* A and B are the only grades that license reliance, so they are the only
   * ones that read as affirmative. D and U are the absence of a check and
   * carry the warning colour precisely because they are easy to misread as
   * reassurance. */
  var cls = (g === 'A' || g === 'B') ? 'on' : (g === 'C' ? 'off' : 'warn');
  return '<span class="flag ' + cls + '">' + esc(g || '—') + ' · ' +
    esc(GRADE_TITLE[g] || 'no grade on record') + '</span>';
}

/* National context for a grade, computed from the ledger actually loaded
 * rather than hardcoded, so it cannot go stale against the file. */
function grade_distribution() {
  var dist = {}, total = 0;
  (DATA.evidence || []).forEach(function (r) {
    var g = String(r.evidence_grade || '').trim() || '?';
    dist[g] = (dist[g] || 0) + 1;
    total += 1;
  });
  return { dist: dist, total: total };
}

function provenance_section(slice) {
  /* slice.county is the picker wrapper; the aggregate row is on .agg, the
   * same binding render() uses. Reading has_enacted_restrictive off the
   * wrapper yields undefined, which compares unequal to '1' and silently
   * reports every county as clear -- the exact failure this section exists
   * to prevent. */
  var a = slice.county.agg;
  var e = slice.evidence;
  var is_clear = a.has_enacted_restrictive !== '1';
  var claim = is_clear
    ? 'no enacted restriction on record'
    : 'an enacted restriction on record';

  var html = '<section><h3>Evidence behind this label</h3>';

  if (!e) {
    /* The ledger covers the full national frame, so a missing row means the
     * ledger and the county frame have diverged. Say so rather than falling
     * back to a reassuring default. */
    html += '<div class="empty">This county has <b>' + esc(claim) + '</b>, and ' +
      'there is no row for it in the evidence ledger. The ledger is built over ' +
      'the whole county frame, so a missing row is a build problem rather than ' +
      'a statement about this county — treat the label as unverified until ' +
      'it reappears.</div></section>';
    return html;
  }

  var g = String(e.evidence_grade || '').trim();
  var reading = grade_reading(g, is_clear, e);
  var gd = grade_distribution();
  var share = gd.total ? (gd.dist[g] || 0) : 0;

  html += '<div class="sub">This county is recorded as having <b>' + esc(claim) +
    '</b>. What follows is what was actually checked to support that, from the ' +
    'evidence ledger — not a restatement of the label itself. ' +
    '<details class="more"><summary aria-label="How grades are assigned" ' +
    'title="How grades are assigned">i</summary><div>Grades are assigned by a ' +
    'rubric registered in <code>configs/restriction_evidence_sources.json</code> ' +
    'before any county was graded, and count <i>independent kinds</i> of source ' +
    'rather than source counts: two compilations that both read the same press ' +
    'coverage can be wrong together. This page reproduces that rubric and does ' +
    'not grade anything itself.</div></details></div>';

  html += '<div class="kpis">' +
    '<div class="kpi"><b>' + grade_flag(g) + '</b><span>Evidence grade</span></div>' +
    '<div class="kpi"><b>' +
      esc(PROBE_TEXT[String(e.probe_status || '').trim()] ||
          e.probe_status || '—') + '</b>' +
      '<span>Source check</span></div>' +
    '<div class="kpi"><b>' + (e.last_checked ? fmt_date(e.last_checked) : 'never') +
      '</b><span>Last checked</span></div>' +
    '<div class="kpi"><b>' + (gd.total
      ? fmt_int(share) + ' of ' + fmt_int(gd.total)
      : '—') + '</b><span>Counties sharing this grade</span></div>' +
    '</div>';

  html += '<div class="sub trailing">' + esc(reading) + '</div>';

  /* Families are the part a reader can act on: it names the doors that were
   * opened and the ones that were not. */
  var covered = String(e.families_covered || '').trim();
  var checked = String(e.families_checked || '').trim();
  html += '<div class="sub trailing"><b>Source families.</b> ' +
    (covered
      ? 'Registered as covering this county: <b>' +
        esc(vocab_list(covered, FAMILY_TEXT)) + '</b>. '
      : 'No registered source family covers this county. ') +
    (checked
      ? 'Actually consulted: <b>' + esc(vocab_list(checked, FAMILY_TEXT)) + '</b>.'
      : 'None has been consulted yet.') +
    (e.independence_classes
      ? ' Independent kinds of source represented: <b>' +
        esc(vocab_list(e.independence_classes, CLASS_TEXT)) + '</b>.'
      : '') +
    '</div>';

  if (slice.evidence_conflicts.length) {
    /* table_now, not table: these rows ride the core wave, so the gated
     * renderer would park a "Loading..." over data already in hand. */
    html += table_now(['Disagreement', 'What it means', 'Detail', 'Source'],
      slice.evidence_conflicts, function (r) {
        var k = String(r.conflict || '').trim();
        return ['<span class="flag warn">' +
                  esc(CONFLICT_TITLE[k] || k || '—') + '</span>',
                esc(CONFLICT_TEXT[k] || ''),
                esc(r.detail || '—'),
                r.source_url ? link(r.source_url) : esc(r.source_id || '—')];
      }, '');
  }

  if (String(e.needs_recheck || '') === '1') {
    html += '<div class="sub trailing">This county is queued for a re-check: ' +
      'either it has never been probed, or the last check has aged past the ' +
      'freshness window.</div>';
  }
  return html + '</section>';
}

function comparison_section(slice) {
  var c = slice.county, bm = slice.benchmark;
  var st_group = 'state:' + String(c.state_abbr || '').toUpperCase();
  var bman = META.benchmark_manifest || {};

  var html = '<section><h3>How this county compares</h3>' +
    '<div class="sub">Compared against four groups: all counties, counties that have ' +
    'enacted a restriction, this state, and the ten most similar counties. ' +
    '<details class="more"><summary aria-label="More" title="More">i</summary><div>' +
    'Peers are matched on population, density, education and 2024 margin. Reference ' +
    'values are medians, published in <code>data/county_benchmark_reference.csv</code>. ' +
    'The percentile column is this county\'s position among all counties.' +
    '</div></details></div>';

  if (!DETAIL_READY && !REFERENCE.national) {
    return html + '<div class="empty">Loading comparison frame&hellip;</div></section>';
  }

  /* ---- headline: the three numbers a client asks for ---- */
  var self_score = c.score ? num(c.score.calibrated_score) : null;
  var restr_med = ref_stat('restrictive', 'calibrated_score', 'median');
  var nat_med = ref_stat('national', 'calibrated_score', 'median');
  var pct_restr = bm ? num(bm.calibrated_score_pct_restrictive) : null;
  var peer_rate = bm ? num(bm.peer_restriction_rate) : null;
  var peer_n = bm ? num(bm.peer_n) : null;

  html += '<div class="kpis">' +
    kpi('Score vs counties that acted',
        pct_restr === null ? '—' : ordinal(Math.round(pct_restr)),
        restr_med === null ? '' : 'their median is ' + fmt_prob(restr_med)) +
    kpi('Score vs all counties',
        c.national_pct === undefined ? '—' : ordinal(Math.round(c.national_pct)),
        nat_med === null ? '' : 'national median ' + fmt_prob(nat_med)) +
    kpi('Peer counties that have restricted',
        peer_rate === null ? '—' : fmt_prob(peer_rate, 0),
        (bm && bm.peer_restriction_count !== '' && peer_n)
          ? bm.peer_restriction_count + ' of ' + peer_n + ' look-alike counties' : '') +
    kpi('Gap to the restrictive median',
        (bm && bm.score_gap_to_restrictive_median !== '')
          ? (num(bm.score_gap_to_restrictive_median) >= 0 ? '+' : '') +
            fmt_prob(bm.score_gap_to_restrictive_median)
          : '—',
        'percentage points of score') +
    '</div>';

  /* The separation between the two groups is the honest caveat on the whole
   * section, so it is stated here rather than buried in the methodology. */
  if (bman.score_separation_restrictive_minus_non !== undefined &&
      bman.score_separation_restrictive_minus_non !== null) {
    html += '<div class="sub" style="margin-top:9px">The median county that has ' +
      'enacted a restriction scores ' +
      fmt_prob(bman.score_separation_restrictive_minus_non) + ' above the median ' +
      'county that has not \u2014 a narrow separation. The score ranks counties; it ' +
      'does not split them into two populations, so a high percentile means high in ' +
      'the ordering, not close to acting.</div>';
  }

  /* ---- the table ---- */
  var rows = COMPARE_METRICS.filter(function (m) { return REFERENCE.national && REFERENCE.national[m]; });
  html += '<div style="margin-top:12px">' +
    table_now(['Metric', 'This county', 'All counties', 'vs all',
           'Counties that restricted', 'vs those', c.state_abbr || 'State',
           'Peer counties', '%ile, all counties'],
      rows, function (m) {
        /* Three places a county's own value can come from, in order of
         * preference: the score file, the published benchmark row, and the
         * aggregate this page already holds. The last is what fills the table
         * on first paint, before the benchmark file lands. A derived rate
         * exists in none of the first two until then, and is left blank rather
         * than recomputed here under a definition that might drift from the
         * one county_benchmarks.py used. */
        var self = (m === 'calibrated_score')
          ? (c.score ? num(c.score.calibrated_score) : null)
          : (bm && bm[m] !== '' && bm[m] !== undefined ? num(bm[m]) : num(c.agg[m]));
        var nat = ref_stat('national', m, 'median');
        var res = ref_stat('restrictive', m, 'median');
        var sta = ref_stat(st_group, m, 'median');
        var peer = bm ? num(bm[m + '_peer_median']) : null;
        var p_nat = bm ? num(bm[m + '_pct_national']) : null;
        return ['<span>' + esc(METRIC_LABEL[m] || m) + '</span>',
                '<span class="self">' + fmt_metric(m, self) + '</span>',
                '<span class="ref">' + fmt_metric(m, nat) + '</span>',
                vs_cell(m, self, nat),
                '<span class="ref">' + fmt_metric(m, res) + '</span>',
                vs_cell(m, self, res),
                '<span class="ref">' + fmt_metric(m, sta) + '</span>',
                '<span class="ref">' + fmt_metric(m, peer) + '</span>',
                pct_cell(p_nat)];
      }, 'No comparison frame for this county.') + '</div>';

  if (bm && bm.peer_matched === '0') {
    html += '<div class="sub trailing">This county is missing at least one matching ' +
      'feature, so it has no peer group. Left empty rather than imputed.</div>';
  }

  /* ---- the peer table ---- */
  if (slice.peers.length) {
    html += '<h3 style="margin-top:18px">Peer counties' + count_label(slice.peers.length) +
      '</h3>' +
      '<div class="sub">The counties this one most resembles structurally, in any ' +
      'state. A similarity set, not a matched control, so it supports no claim about ' +
      'what would have happened here. Matched on standardised log population, log ' +
      'density, share with a ' +
      "bachelor's degree and 2024 margin" +
      (bm && bm.peer_mean_distance ? ', mean distance ' + esc(bm.peer_mean_distance) : '') +
      '.</div>' +
      table(['County', 'Score', 'Enacted', 'Opp. events', 'DC records', 'Population',
             'Density', 'Median income', "Bachelor's+", '2024 margin'],
        slice.peers, function (p) {
          return ['<span class="link-county" data-fips="' + esc(p.fips) + '">' +
                    esc(p.label) + '</span>',
                  p.score ? fmt_prob(p.score.calibrated_score) : '—',
                  '<span class="flag ' + (p.agg.has_enacted_restrictive === '1' ? 'on' : 'off') +
                    '">' + (p.agg.has_enacted_restrictive === '1' ? 'Yes' : 'No') + '</span>',
                  fmt_int(p.agg.n_opposition_events), fmt_int(p.agg.existing_dc_count),
                  fmt_int(p.agg.population), fmt_num(p.agg.pop_density_sqmi, 1),
                  fmt_money(p.agg.median_hh_income), fmt_pct(p.agg.pct_bachelors_plus),
                  fmt_margin(p.agg.margin_2024)];
        }, '');
  }

  return html + '</section>';
}

function render(slice) {
  var c = slice.county, a = c.agg, s = c.score, iv = c.interval;
  var html = '';

  /* ---- header ---- */
  html += '<div class="title-row"><h2>' + esc(c.county) + ', ' + esc(c.state_name || c.state_abbr) + '</h2>' +
    '<span class="flag ' + (a.has_enacted_restrictive === '1' ? 'on' : 'off') + '">' +
    (a.has_enacted_restrictive === '1' ? 'Enacted restrictive policy on record' : 'No enacted restriction on record') +
    '</span></div>';
  html += '<div class="sub">FIPS ' + esc(c.fips) + ' &middot; ' + fmt_num(a.land_sqmi, 0) +
    ' sq mi of land &middot; ' + fmt_int(a.existing_dc_count) + ' data center records in the atlas</div>';

  /* ---- what the restriction actually is ---- */
  if (slice.restrictions.length) {
    html += '<section><h3>Enacted restriction record' + count_label(slice.restrictions.length) + '</h3>' +
      '<div class="sub">The instrument on file for this county, from the external restriction ' +
      'census. "Status" is the census reading at the date shown, not necessarily today.</div>' +
      table(['Instrument', 'Status', 'Date enacted', 'Source'],
        slice.restrictions, function (r) {
          return [esc(r.instrument), '<span class="flag on">' + esc(r.census_status) + '</span>',
                  '<span class="nowrap">' + fmt_date(r.date_enacted) + '</span>',
                  link(r.source)];
        }, '') + '</section>';
  } else if (a.has_enacted_restrictive === '1') {
    html += '<section><h3>Enacted restriction record</h3><div class="empty">Flagged as enacted ' +
      'from tracker events, with no instrument filed in the external restriction census. The ' +
      'census is hand-verified and covers ' + fmt_int((DATA.restriction_census || []).length) +
      ' counties, so absence here is a coverage gap, not a contradiction.</div></section>';
  }

  /* Rendered immediately after the restriction record, and unconditionally.
   * The record above renders nothing at all for a county with no instrument
   * on file, so this is the section that keeps an empty space from reading as
   * a verified all-clear. It rides the core wave, so on a county with no
   * instrument it is the FIRST thing said about the label. */
  html += provenance_section(slice);

  /* ---- predictive ---- */
  html += '<section><h3>Model outlook</h3>';
  if (s) {
    var pct = c.national_pct;
    var lo = iv ? num(iv.va_p_lower) : null, hi = iv ? num(iv.va_p_upper) : null;
    var bar = '';
    if (lo !== null && hi !== null) {
      bar = '<div class="bar"><u style="left:' + (lo * 100).toFixed(1) + '%;width:' +
        ((hi - lo) * 100).toFixed(1) + '%"></u><i style="left:' +
        (num(s.calibrated_score) * 100).toFixed(1) + '%;width:2px"></i></div>';
    }
    html += '<div class="kpis">' +
      '<div class="kpi hero"><b>' + fmt_prob(s.calibrated_score) + '</b>' +
        (lo !== null ? '<em>interval ' + fmt_prob(lo, 0) + '\u2013' + fmt_prob(hi, 0) + '</em>' : '') +
        '<span>Calibrated restriction score</span>' + bar + '</div>' +
      kpi('National percentile', pct === undefined ? '\u2014' : Math.round(pct) + 'th',
          c.national_rank ? 'rank ' + c.national_rank.toLocaleString() + ' of ' + c.national_n.toLocaleString() : '') +
      kpi('Score decile', s.score_decile ? ordinal(Number(s.score_decile)) : '\u2014', '1 = lowest, 10 = highest') +
      kpi('Rank within ' + esc(c.state_abbr), c.state_rank ? c.state_rank.toLocaleString() : '\u2014',
          c.state_n ? 'of ' + c.state_n.toLocaleString() + ' counties' : '') +
      kpi('Raw out-of-fold score', fmt_prob(s.raw_oof_score), 'before recalibration') +
      kpi('Interval width', iv ? fmt_prob(iv.va_width) : '\u2014',
          iv ? '90% set: ' + esc(iv.set_90 || '\u2014') : '') +
      '</div>';
    html += '<div class="sub" style="margin-top:9px">A resemblance score, not a forecast: how much this ' +
      'county looks like counties that have enacted a restriction. Quote the interval rather than the ' +
      'point; a wide one means thin evidence for this profile.</div>';

    /* Neighbour contagion: only counties on the adjacency scan queue carry it. */
    var g = slice.contagion;
    if (g) {
      html += '<div class="kpis" style="margin-top:12px">' +
        kpi('Neighbours with an enacted restriction', fmt_int(g.enacted_neighbors),
            g.enacted_neighbor_fips ? 'FIPS ' + esc(g.enacted_neighbor_fips) : '') +
        kpi('Nearest enacted county', esc(g.nearest_seed_county || '\u2014'),
            g.nearest_seed_state ? esc(g.nearest_seed_state) +
              (yn(g.cross_state_seed) === 'Yes' ? ' \u00b7 across a state line' : '') : '') +
        kpi('Days since that action', fmt_int(g.days_since_nearest_seed),
            g.nearest_seed_date ? 'enacted ' + fmt_date(g.nearest_seed_date) : '') +
        kpi('Scan priority', esc(g.priority || '\u2014'), esc(g.priority_reason || '')) +
        kpi('Evidence status', esc(g.evidence_status || '\u2014'),
            g.meeting_source ? 'meeting source: ' + esc(g.meeting_source) : '') +
        '</div>' +
        '<div class="sub" style="margin-top:9px">On the adjacency scan queue because a neighbour ' +
        'has acted. Proximity is a monitoring trigger, not evidence this county will follow.</div>';
    }
  } else {
    html += '<div class="empty">This county is outside the model frame, so it carries no score. ' +
      'Puerto Rico and counties with incomplete census features are excluded.</div>';
  }
  html += '</section>';

  /* ---- external rows awaiting review ---- */
  /* These come from the refresh delta, not the census. An upstream compiler
   * asserts a restriction here and this repository has not adopted the row, so
   * it is shown as a question rather than as a finding: it never moves
   * has_enacted_restrictive, never joins the census table above, and is
   * labelled on screen as unadopted. Showing it beats the alternative, which
   * was telling a client "coverage gap" on a county an external source has
   * already documented.
   *
   * A row can sit in the delta for either of two reasons, and the prose below
   * covers both rather than asserting one: nobody has reviewed it, or
   * refresh_external_census.py --promote evaluated it and its gate held it
   * (an upstream VERIFY tag, an unpinned date, a pending instrument, or a
   * county that does not join the national frame). Before --promote existed
   * only the first reason was possible, and the copy here said so; once
   * promotion runs automatically, the rows that REMAIN in the delta are
   * mostly the held ones, and calling those unreviewed would be wrong. */
  if (slice.census_unreviewed.length) {
    /* An upstream status of "pending" describes an instrument that was SOUGHT
     * and not adopted. It is the one status that cannot disagree with a clear
     * label, because has_enacted_restrictive records ENACTMENT: a county whose
     * only upstream row is pending is correctly recorded as having none.
     *
     * Treating every unreviewed row as a disagreement told a reader there was
     * a contradiction to resolve on six counties (Warrick IN, Mercer KY,
     * Howard MD, Worcester MD, Sierra NM, Austin TX) where the label and the
     * upstream record in fact agree. The same rule is enforced upstream of
     * this page in restriction_evidence.py, which grades a pending row as
     * neither corroborating an enacted label nor contradicting a clear one;
     * this keeps the page consistent with the ledger rather than each
     * deciding separately what a pending row means. */
    var enacted_rows = slice.census_unreviewed.filter(function (r) {
      return String(r.census_status || '').trim().toLowerCase() !== 'pending';
    });
    var sought_rows = slice.census_unreviewed.filter(function (r) {
      return String(r.census_status || '').trim().toLowerCase() === 'pending';
    });
    var is_clear = a.has_enacted_restrictive !== '1';
    var contradicts = is_clear && enacted_rows.length > 0;

    var framing;
    if (contradicts) {
      framing = ' <b>This county is currently recorded as having no enacted ' +
        'restriction</b>, so the ' + (enacted_rows.length === 1 ? 'row' : 'rows') +
        ' below asserting an adopted instrument ' +
        (enacted_rows.length === 1 ? 'is a question' : 'are questions') +
        ' about that label rather than a confirmation of it, the kind of ' +
        'disagreement worth resolving before quoting this county as clear.';
    } else if (is_clear) {
      framing = ' Every row below carries an upstream status of <b>pending</b>, ' +
        'meaning an instrument was sought here and not adopted. That does not ' +
        'contradict this county\'s record of no enacted restriction: the flag ' +
        'tracks enactment, so a sought-and-unadopted instrument and a clear ' +
        'label agree. Nothing here needs resolving.';
    } else {
      framing = ' This county already carries an enacted restriction, so the ' +
        'rows below are corroboration from an independent compiler rather than ' +
        'anything new.';
    }

    html += '<section><h3>External rows awaiting review' +
      count_label(slice.census_unreviewed.length) + '</h3>' +
      '<div class="sub">Surfaced by the census refresh against the Moratorium ' +
      'Nation dataset (CC-BY-4.0) and <b>not part of the census</b> \u2014 either ' +
      'unreviewed or held by the promotion gate. None of these are treated as ' +
      'verified: they do not set the restriction flag, feed any model, or appear ' +
      'in the census table above.' + framing +
      (sought_rows.length && enacted_rows.length
        ? ' <b>' + fmt_int(sought_rows.length) + '</b> of these ' +
          (sought_rows.length === 1 ? 'is' : 'are') + ' pending rather than ' +
          'adopted, and so ' + (sought_rows.length === 1 ? 'does' : 'do') +
          ' not bear on the label either way.'
        : '') +
      '</div>' +
      table(['Instrument', 'Upstream status', 'Date enacted', 'Upstream record'],
        slice.census_unreviewed, function (r) {
          var st = String(r.census_status || '').trim().toLowerCase();
          var label = st === 'pending'
            ? 'pending (sought, not adopted)'
            : (r.census_status || '\u2014');
          return [esc(r.instrument),
                  '<span class="stance">' + esc(label) + '</span>',
                  '<span class="nowrap">' + fmt_date(r.date_enacted) + '</span>',
                  '<span class="clip">' + esc(r.source) + '</span>'];
        }, '') + '</section>';
  }

  /* ---- comparison ---- */
  html += comparison_section(slice);

  /* ---- project risk screen ---- */
  if (slice.site_screen.length || !DETAIL_READY) {
    html += '<section><h3>Project risk screen' + count_label(slice.site_screen.length) + '</h3>' +
      table(['Project', 'Tier', 'Composite', 'Local activity %ile', 'Local enacted %ile',
             'County model %ile', 'State activity %ile', 'Org capacity %ile', 'Events within 50 mi'],
        slice.site_screen, function (r) {
          return [esc(r.name), esc(r.tier), fmt_num(r.composite, 1), fmt_num(r.pct_local_activity, 1),
                  fmt_num(r.pct_local_enacted, 1), fmt_num(r.pct_county_model, 1),
                  fmt_num(r.pct_state_activity, 1), fmt_num(r.pct_org_capacity, 1),
                  fmt_int(r.events_within_50mi)];
        }, 'No screened projects in this county.') + '</section>';
  }

  /* ---- demographics ---- */
  html += '<section><h3>Demographics and politics</h3><div class="kpis">' +
    kpi('Population', fmt_int(a.population), 'ACS') +
    kpi('Population density', fmt_num(a.pop_density_sqmi, 1), 'per sq mi') +
    kpi('Median household income', fmt_money(a.median_hh_income)) +
    kpi("Bachelor's degree or higher", fmt_pct(a.pct_bachelors_plus)) +
    kpi('2024 presidential margin', fmt_margin(a.margin_2024)) +
    kpi('2016 presidential margin', fmt_margin(a.margin_2016)) +
    kpi('Land area', fmt_num(a.land_sqmi, 1), 'sq mi') +
    '</div></section>';

  /* ---- opposition and policy activity ---- */
  html += '<section><h3>Opposition and policy activity</h3><div class="kpis">' +
    kpi('Opposition events', fmt_int(a.n_opposition_events)) +
    kpi('Moratorium events', fmt_int(a.n_moratorium_events)) +
    kpi('Zoning events', fmt_int(a.n_zoning_events)) +
    kpi('Ban events', fmt_int(a.n_ban_events)) +
    kpi('Legislation events', fmt_int(a.n_legislation_events)) +
    kpi('Lawsuit events', fmt_int(a.n_lawsuit_events)) +
    kpi('Enacted restrictive actions', fmt_int(a.n_enacted_restrictive)) +
    kpi('Statewide legislation events', fmt_int(a.state_legislation_events), 'all of ' + esc(c.state_abbr)) +
    '</div></section>';

  /* ---- project outcomes ---- */
  html += '<section><h3>Project outcomes</h3><div class="kpis">' +
    kpi('Projects tracked', fmt_int(a.n_projects_tracked)) +
    kpi('Projects opposed', fmt_int(a.n_projects_opposed)) +
    kpi('Decided', fmt_int(a.n_decided)) +
    kpi('Blocked (confirmed)', fmt_int(a.n_blocked_confirmed)) +
    kpi('Advanced (confirmed)', fmt_int(a.n_advanced_confirmed)) +
    kpi('Restricted or conditional', fmt_int(a.n_restricted_conditional)) +
    kpi('Median days to decision', fmt_int(a.median_days_to_decision)) +
    '</div></section>';

  /* ---- tracked project lifecycles ---- */
  html += '<section><h3>Tracked project lifecycles' + count_label(slice.lifecycles.length) + '</h3>' +
    '<div class="sub">"Modeled block" is the out-of-fold probability from the opposed-project ' +
    'outcome model, available only for projects in its training frame. It is a predictive ' +
    'association, not a causal statement about opposition.</div>' +
    table(['Project', 'Phase', 'Outcome', 'Modeled block', 'Announced', 'Decision', 'Days', 'MW',
           'Acres', 'Opp. events', 'Lawsuit', 'Decision evidence', 'Source'],
      slice.lifecycles, function (r) {
        var p = slice.pred_by_pid[r.project_id];
        var d = slice.decision_by_pid[r.project_id];
        return ['<span class="clip">' + esc(r.project_name) + '</span>', esc(r.phase),
                esc(r.lifecycle_outcome),
                p ? fmt_prob(p.oof_pred_blocked) : '\u2014',
                '<span class="nowrap">' + fmt_date(r.announced_date) + '</span>',
                '<span class="nowrap">' + fmt_date(r.decision_date) + '</span>',
                fmt_int(r.days_announced_to_decision), fmt_num(r.capacity_mw, 0),
                fmt_int(r.size_acres), fmt_int(r.n_opposition_events), yn(r.has_lawsuit),
                d ? '<span class="clip" title="' + esc(d.decision_date_source) + '">' +
                    esc(d.decision_date_source) + '</span> ' + link(d.source_url, 'cite') : '\u2014',
                link(r.source_url)];
      }, 'No tracked lifecycles in this county.') + '</section>';

  /* ---- risk trend over reruns ---- */
  html += '<section><h3>Risk-screen trend' + count_label(slice.trend.length) + '</h3>' +
      '<div class="sub">Composite score at the first and most recent screen run, per project. ' +
      'Movement reflects both new evidence and model reruns.</div>' +
      table(['Project', 'Current tier', 'First run', 'First composite', 'Latest run',
             'Latest composite', 'Change', 'Runs'],
        slice.trend, function (r) {
          var cls = r.delta === null ? '' : (r.delta > 0 ? 'up' : (r.delta < 0 ? 'down' : ''));
          var arrow = r.delta === null ? '\u2014'
            : (r.delta > 0 ? '\u25b2 +' : (r.delta < 0 ? '\u25bc ' : '')) + r.delta.toFixed(1);
          return ['<span class="clip">' + esc(r.name) + '</span>', esc(r.tier),
                  '<span class="nowrap">' + fmt_date(r.first_run) + '</span>',
                  fmt_num(r.first_composite, 1),
                  '<span class="nowrap">' + fmt_date(r.last_run) + '</span>',
                  fmt_num(r.last_composite, 1),
                  '<span class="delta ' + cls + '">' + arrow + '</span>', fmt_int(r.runs)];
        }, 'No screen history for this county.') + '</section>';

  /* ---- full project universe ---- */
  html += '<section><h3>Full project universe' + count_label(slice.universe.length) + '</h3>' +
    '<div class="sub">Every project and facility in the baseline universe for this county, ' +
    'including those with no tracked opposition. The opposition tables above are a ' +
    'selection-biased subset of this frame by construction.</div>' +
    table(['Name', 'Operator', 'Source', 'MW', 'Sq ft', 'Opposed', 'Outcome', 'Decided',
           'Opp. events', 'Announced', 'Decision', 'Last update', 'Excluded because'],
      slice.universe, function (r) {
        return ['<span class="clip">' + esc(r.name) + '</span>',
                '<span class="clip">' + esc(r.operator) + '</span>', esc(r.source),
                fmt_num(r.capacity_mw, 0), fmt_int(r.sqft), yn(r.opposed_flag),
                esc(r.lifecycle_outcome), yn(r.decided), fmt_int(r.n_opposition_events),
                '<span class="nowrap">' + fmt_date(r.announced_date) + '</span>',
                '<span class="nowrap">' + fmt_date(r.decision_date) + '</span>',
                '<span class="nowrap">' + fmt_date(r.last_status_update) + '</span>',
                '<span class="clip">' + esc(r.exclusion_reason) + '</span>'];
      }, 'No baseline universe records for this county.') + '</section>';

  /* ---- opposition groups ---- */
  html += '<section><h3>Opposition groups active here' + count_label(slice.groups.length) + '</h3>' +
    '<div class="sub">Groups named on this county\'s own events, joined to the national registry. ' +
    '"Blocked share" is that group\'s confirmed blocks over its decided incidents nationally, so ' +
    'it describes a track record, not an effect.</div>' +
    table(['Group', 'Events here', 'National incidents', 'States active', 'First seen',
           'Last seen', 'Decided', 'Confirmed blocks', 'Blocked share'],
      slice.groups, function (r) {
        var g = r.row;
        return ['<span class="clip">' + esc(g.canonical_name) + '</span>' +
                  (r.client_safe ? '' : ' <span class="flag warn" title="Registry audit flagged ' +
                    'this entry; verify before naming it in a client deliverable">verify</span>'),
                fmt_int(r.local_events), fmt_int(g.n_incidents),
                '<span class="clip">' + esc(g.states) + '</span>',
                '<span class="nowrap">' + fmt_date(g.first_seen) + '</span>',
                '<span class="nowrap">' + fmt_date(g.last_seen) + '</span>',
                fmt_int(g.decided), fmt_int(g.confirmed_blocks),
                g.blocked_share === '' ? '\u2014' : fmt_prob(g.blocked_share)];
      }, 'No registry-matched opposition groups named in this county.') + '</section>';

  /* ---- proposals ---- */
  html += '<section><h3>Proposals and developments' + count_label(slice.proposals.length) + '</h3>' +
    table(['Name', 'Type', 'Phase', 'Status', 'Towns', 'MW', 'Acres', 'Companies', 'Jobs',
           'Date', 'Info'],
      slice.proposals, function (r) {
        return ['<span class="clip">' + esc(r.name) + '</span>', esc(r.type), esc(r.phase),
                esc(r.status), '<span class="clip">' + esc(r.towns) + '</span>',
                fmt_num(r.capacity_mw, 0), fmt_int(r.size_acres),
                '<span class="clip">' + esc(r.companies) + '</span>', fmt_int(r.jobsTotal),
                '<span class="nowrap">' + fmt_date(r.date) + '</span>', link(r.info)];
      }, 'No proposals recorded in this county.') + '</section>';

  /* ---- facilities ---- */
  html += '<section><h3>Facility registry' + count_label(slice.facilities.length) + '</h3>' +
    table(['Facility', 'Operator', 'Status', 'MW', 'Sq ft', 'First seen', 'Last seen', 'Evidence'],
      slice.facilities, function (r) {
        return ['<span class="clip">' + esc(r.name) + '</span>', esc(r.operator), esc(r.status),
                fmt_num(r.capacity_mw, 0), fmt_int(r.sqft),
                '<span class="nowrap">' + fmt_date(r.first_seen) + '</span>',
                '<span class="nowrap">' + fmt_date(r.last_seen) + '</span>', link(r.evidence_url)];
      }, 'No registry facilities in this county.') + '</section>';

  /* ---- opposition events ---- */
  html += '<section><h3>Opposition events' + count_label(slice.opposition.length) +
    '</h3><div class="sub">Display is a curated subset of columns. The CSV export carries every ' +
    'column in master_opposition_clean.csv for these rows.</div>' +
    table(['Date', 'City', 'Entity', 'Type', 'Severity', 'Status', 'Outcome', 'Company',
           'Project', 'MW', 'Summary', 'Source'],
      slice.opposition, function (r) {
        return ['<span class="nowrap">' + fmt_date(r.Date) + '</span>', esc(r.City),
                '<span class="clip">' + esc(r.Entity) + '</span>', esc(r['Opposition Type']),
                esc(r.Severity), esc(r.status_clean || r.Status),
                esc(r['Community Outcome']), '<span class="clip">' + esc(r.Company) + '</span>',
                '<span class="clip">' + esc(r['Project Name']) + '</span>', fmt_num(r.mw_numeric, 0),
                '<span class="clip">' + esc(r.Summary) + '</span>', link(r['Source URL'])];
      }, 'No opposition events recorded in this county.') + '</section>';

  /* ---- meetings ---- */
  html += '<section><h3>Local meeting feed' + count_label(slice.meetings.length) + '</h3>' +
    table(['Jurisdiction', 'Body', 'When', 'Item', 'Status', 'Platform', 'Document'],
      slice.meetings, function (r) {
        return [esc(r.jurisdiction), esc(r.body),
                '<span class="nowrap">' + esc(String(r.meeting_datetime || '').slice(0, 16)) + '</span>',
                '<span class="clip">' + esc(r.item_title) + '</span>', esc(r.item_status),
                esc(r.platform), link(r.document_url)];
      }, 'No monitored meetings for this county.') + '</section>';

  /* ---- neighbors ---- */
  html += '<section><h3>Neighboring counties' + count_label(slice.neighbors.length) + '</h3>' +
    table(['County', 'Score', 'Decile', 'Enacted', 'Opp. events', 'DC records', 'Population'],
      slice.neighbors, function (r) {
        return ['<span class="link-county" data-fips="' + esc(r.fips) + '">' + esc(r.label) + '</span>',
                r.score ? fmt_prob(r.score.calibrated_score) : '\u2014',
                r.score && r.score.score_decile ? esc(r.score.score_decile) : '\u2014',
                yn(r.agg.has_enacted_restrictive), fmt_int(r.agg.n_opposition_events),
                fmt_int(r.agg.existing_dc_count), fmt_int(r.agg.population)];
      }, 'No adjacency records for this county.') + '</section>';

  /* ---- state legislation ---- */
  html += '<section><h3>State legislation in ' + esc(c.state_abbr) +
    count_label(slice.bills.length) + '</h3>' +
    '<div class="sub">Statewide, not county-specific: these bills set the ceiling a local ' +
    'decision operates under. "Stage" is the furthest point reached; follow the OpenStates ' +
    'link for roll calls and full text.</div>' +
    table(['Bill', 'Session', 'Title', 'Stage', 'Stage date', 'Latest action', 'Evidence',
           'Linked incident', 'OpenStates'],
      slice.bills, function (r) {
        return ['<span class="nowrap">' + esc(r.identifier) + '</span>', esc(r.session),
                '<span class="clip">' + esc(r.title) + '</span>',
                r.stage ? '<span class="flag on">' + esc(r.stage) + '</span>' : '\u2014',
                '<span class="nowrap">' + fmt_date(r.stage_date) + '</span>',
                '<span class="nowrap">' + fmt_date(r.latest_action_date) + '</span>',
                '<span class="clip">' + esc(r.stage_evidence) + '</span>',
                '<span class="clip">' + esc(r.incident) + '</span>',
                link(r.openstates_url, 'bill')];
      }, 'No matched state bills for this state.') + '</section>';

  /* ---- stakeholders ---- */
  var sh_all = slice.stakeholders_county.concat(slice.stakeholders_state);
  var sh_man = (META.stakeholder_manifest || {});
  html += '<section><h3>Stakeholders' + count_label(sh_all.length) + '</h3>' +
    '<div class="sub">The offices that decide siting, zoning, permitting and utility ' +
    'questions here, plus the state offices above them, each with the official page it ' +
    'was read from. An office with no confirmed current holder, or one whose term has ' +
    'ended, is withheld rather than guessed.</div>';
  if (!slice.stakeholders_county.length && DETAIL_READY) {
    html += '<div class="empty">No county-level stakeholder record yet. No national ' +
      'register of county board chairs, administrators and mayors exists, so this tier ' +
      'is seeded jurisdiction by jurisdiction from official pages. It currently covers ' +
      (sh_man.counties_covered !== undefined
        ? fmt_int(sh_man.counties_covered) + ' of the 789 counties with tracked activity'
        : 'a subset of counties') +
      '. The state offices below apply regardless.</div>';
  }
  html += stakeholder_rows(sh_all);
  if (sh_all.length) {
    html += '<div class="sub trailing">Contacts are official office listings, not personal ' +
      'details. "Role in siting" appears only where a cited source states that formal role. ' +
      'Full addresses are in the CSV export.</div>';
  }
  html += '</section>';

  /* ---- public positions ---- */
  html += positions_section(slice);

  /* ---- coverage and known gaps ---- */
  html += '<section><h3>Coverage and known gaps</h3>';
  if (slice.coverage.length) {
    html += table(['Gap class', 'Join status', 'Label check', 'Census status', 'Tracker mechanism',
                   'Tracker outcome', 'Model label', 'Census source'],
      slice.coverage, function (r) {
        return [esc(r.gap_class), esc(r.join_status),
                r.label_check && r.label_check !== 'ok'
                  ? '<span class="flag warn">' + esc(r.label_check) + '</span>'
                  : esc(r.label_check || '\u2014'),
                esc(r.census_status), esc(r.tracker_mechanism), esc(r.tracker_outcome),
                esc(r.model_label), link(r.census_source)];
      }, '');
  } else {
    html += '<div class="empty">No reconciliation record for this county, which means it is ' +
      'outside the 92-county sample where the hand census and the tracker were compared ' +
      'head to head.</div>';
  }
  html += '<div class="sub" style="margin-top:11px"><b>Standing limits.</b> ' +
    '<details class="more"><summary aria-label="Standing limits" title="Standing limits">i</summary><div>' +
    'There is no litigation layer here, so "Lawsuit" reflects tracker-coded events only. ' +
    'Severity is recorded at two levels \u2014 read it as present/elevated, not graded. ' +
    'Opposition-event counts are media-detected and under-count quiet counties, so use the ' +
    'full project universe above as the denominator.</div></details></div></section>';

  /* ---- internal-only cost layer ---- */
  if (SHOW_INTERNAL) {
    html += '<section class="internal"><h3>Observed cost accounting' +
      count_label(slice.cost.length) + ' &mdash; internal only</h3>' +
      '<div class="internal-note"><b>Not for client delivery.</b> These are observed-history ' +
      'arithmetic against documented anchors, not estimates of what opposition caused. No ' +
      'matched-control delay estimate exists for this population, and the identifiability ' +
      'review concluded none is recoverable from the available data, so nothing here ' +
      'supports a counterfactual claim. Rows without capacity are withheld rather than ' +
      'imputed, and deferred revenue is exposure, not loss.</div>' +
      table(['Project', 'Outcome', 'Delay days', 'Date precision', 'MW',
             'Escalation low', 'Escalation high', 'Deferred exposure low',
             'Deferred exposure high', 'Sunk cost low', 'Sunk cost high', 'Note'],
        slice.cost, function (r) {
          return ['<span class="clip">' + esc(r.project_name) + '</span>', esc(r.lifecycle_outcome),
                  fmt_int(r.delay_days), esc(r.announced_precision), fmt_num(r.capacity_mw, 0),
                  fmt_money(r.escalation_cost_low), fmt_money(r.escalation_cost_high),
                  fmt_money(r.deferred_revenue_exposure_low), fmt_money(r.deferred_revenue_exposure_high),
                  fmt_money(r.block_sunk_cost_low), fmt_money(r.block_sunk_cost_high),
                  '<span class="clip">' + esc(r.note) + '</span>'];
        }, 'No cost translation rows for this county.');
    if ((DATA.cost_anchors || []).length) {
      html += '<div style="margin-top:11px">' +
        table(['Anchor', 'Description', 'Low', 'High', 'Unit', 'Confidence', 'Source date', 'Source'],
          DATA.cost_anchors, function (r) {
            return [esc(r.anchor_id), '<span class="clip">' + esc(r.description) + '</span>',
                    fmt_num(r.value_low, 2), fmt_num(r.value_high, 2), esc(r.unit),
                    esc(r.confidence), '<span class="nowrap">' + fmt_date(r.source_date) + '</span>',
                    link(r.source)];
          }, '') + '</div>';
    }
    html += '</section>';
  }

  html += methodology_panel();
  html += glossary_panel();

  html += '<footer>Hawthorn Intelligence &middot; data-center-map. Sources: ' +
    Object.keys(CORE_FILES).concat(Object.keys(DETAIL_FILES)).map(function (k) {
      return (CORE_FILES[k] || DETAIL_FILES[k]).split('/').pop();
    }).join(', ') + '. ' +
    'Files regenerate with the CI pipeline; if a section is empty and you expect rows, ' +
    'the last run may have failed its QC gate.<br>Rendered ' +
    new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC.</footer>';

  document.getElementById('body').innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll('.link-county'), function (el) {
    el.addEventListener('click', function () { select_county(el.getAttribute('data-fips')); });
  });
}

/* --------------------- methodology and glossary -------------------- */

function methodology_panel() {
  var pm = META.policy_metrics, om = META.outcome_metrics, sm = META.survival_metrics,
      mf = META.aggregate_manifest;
  var h = '<details><summary>Methodology, model cards and data freshness</summary>';

  if (mf) {
    h += '<dl class="dl">' +
      '<dt>County frame built</dt><dd>' + fmt_date(mf.generated) + '</dd>' +
      '<dt>Counties in frame</dt><dd>' + fmt_int(mf.counties) + '</dd>' +
      '<dt>Events matched to a county</dt><dd>' + fmt_int(mf.event_rows_with_county) +
        ' (' + fmt_prob(mf.event_match_rate) + ' of event rows)</dd>' +
      '<dt>Counties with an enacted restriction</dt><dd>' + fmt_int(mf.enacted_restriction_counties) + '</dd>' +
      '<dt>Counties with a data center on record</dt><dd>' + fmt_int(mf.dc_presence_counties) + '</dd>' +
      '</dl>';
  }

  if (pm) {
    var sel = (pm.specification_selection || {}).selected || {};
    h += '<h4>Restriction resemblance score</h4>' +
      '<dl class="dl">' +
      '<dt>Training counties</dt><dd>' + fmt_int(pm.n) + ' (' + fmt_int(pm.n_positive) +
        ' with an enacted restriction, base rate ' + fmt_prob(pm.base_rate) + ')</dd>' +
      '<dt>Cross-validation</dt><dd>' + fmt_int((pm.cv || {}).folds) + '-fold \u00d7 ' +
        fmt_int((pm.cv || {}).repeats) + ' repeats</dd>' +
      '<dt>Selected specification</dt><dd>' + esc(sel.spec) + ', L2 C = ' + esc(sel.C) + '</dd>' +
      '<dt>Variables</dt><dd>' + esc((sel.variables || []).join(', ')) + '</dd>' +
      '<dt>Specification registered</dt><dd>' + fmt_date((pm.specification_selection || {}).registered) +
        ((pm.specification_selection || {}).changed_this_run ? ' &middot; changed on the last run' :
         ' &middot; unchanged on the last run') + '</dd>' +
      '<dt>Sign-stability cost</dt><dd>' + fmt_num((pm.specification_selection || {}).stability_cost, 4) +
        ' median AUC given up to hold every coefficient\'s sign across folds</dd>' +
      '</dl>' +
      '<div class="sub">Fitted on the cross-section of counties that have and have not acted. ' +
      'It measures resemblance to counties that already restricted, not this county\'s next ' +
      'vote, and no variable in it is a cause.</div>';
  }

  if (om) {
    h += '<h4>Opposed-project outcome model</h4>' +
      '<dl class="dl">' +
      '<dt>Training projects</dt><dd>' + fmt_int(om.n) + ' (' + fmt_int(om.n_blocked) +
        ' blocked, base rate ' + fmt_prob(om.base_rate) + ')</dd>' +
      '<dt>ROC AUC</dt><dd>' + fmt_num(om.roc_auc.p50, 3) + ' median (' +
        fmt_num(om.roc_auc.p10, 3) + '\u2013' + fmt_num(om.roc_auc.p90, 3) + ' across repeats)</dd>' +
      '<dt>Brier score</dt><dd>' + fmt_num(om.brier.p50, 3) + ' median, against ' +
        fmt_num(om.brier.base_rate_brier, 3) + ' for predicting the base rate</dd>' +
      '<dt>Most informative features</dt><dd>' +
        esc((om.top_features || []).slice(0, 5).map(function (f) {
          return f.name + ' (AUC drop ' + f.auc_drop + ')';
        }).join('; ')) + '</dd>' +
      '</dl>' +
      '<div class="sub">Trained only on projects that already drew opposition, so its ' +
      'probabilities are conditional on that. The sample is small and the AUC spread wide, ' +
      'so read a single project\'s number as a rank rather than a rate. Feature importance ' +
      'is predictive signal, not causal effect.</div>';
  }

  if (sm) {
    h += '<h4>Time-to-decision benchmark</h4>' +
      '<dl class="dl">' +
      '<dt>Projects</dt><dd>' + fmt_int(sm.n) + ' (' + fmt_int(sm.n_events) +
        ' reached a decision, ' + fmt_int(sm.n_censored) + ' still open)</dd>' +
      '<dt>Median time to decision</dt><dd>' + fmt_int(sm.km_median_days_all) +
        ' days (Kaplan-Meier)</dd>' +
      '<dt>Log-rank p</dt><dd>' + fmt_num(sm.logrank_p, 4) + '</dd>' +
      '<dt>Excluded for year-only dates</dt><dd>' + fmt_int(sm.excluded_year_precision) + '</dd>' +
      '</dl>' +
      '<div class="sub">A descriptive benchmark of observed timelines. How much longer a ' +
      'project took than it otherwise would have is not identifiable from this data, and is ' +
      'published nowhere in this system.</div>';
  }

  if ((DATA.calibration || []).length) {
    var cal = DATA.calibration.slice(-8).reverse();
    h += '<h4>Calibration history</h4>' +
      table(['Run', 'Model', 'n', 'Base rate', 'Brier', 'Baseline Brier', 'Skill', 'ECE', 'Verdict'],
        cal, function (r) {
          return ['<span class="nowrap">' + fmt_date(r.timestamp) + '</span>', esc(r.model),
                  fmt_int(r.n), fmt_prob(r.base_rate), fmt_num(r.brier, 4),
                  fmt_num(r.brier_baseline, 4), fmt_num(r.brier_skill_score, 4),
                  fmt_num(r.ece, 4),
                  '<span class="flag ' + (r.verdict === 'PROMOTE' ? 'on' : 'warn') + '">' +
                    esc(r.verdict) + '</span>'];
        }, '') +
      '<div class="sub" style="margin-top:9px">Scores only reach this page on a PROMOTE ' +
      'verdict. A HOLD run keeps the previous published scores in place.</div>';
  }

  var shm = META.stakeholder_manifest;
  if (shm) {
    h += '<h4>Stakeholder layer</h4>' +
      '<dl class="dl">' +
      '<dt>published rows</dt><dd>' + fmt_int(shm.published_rows) + ' (' +
        fmt_int(shm.county_rows) + ' county, ' + fmt_int(shm.state_rows) + ' state)</dd>' +
      '<dt>counties covered</dt><dd>' + fmt_int(shm.counties_covered) + '</dd>' +
      '<dt>states covered</dt><dd>' +
        fmt_int((shm.states_covered || []).length) + '</dd>' +
      '<dt>withheld by the gate</dt><dd>' + fmt_int(shm.withheld_rows) + '</dd>' +
      '<dt>published with a warning</dt><dd>' + fmt_int(shm.warned_rows) + '</dd>' +
      '<dt>contact coverage</dt><dd>' + fmt_int(shm.with_email) + ' email, ' +
        fmt_int(shm.with_phone) + ' phone</dd>' +
      '<dt>sourced siting role</dt><dd>' + fmt_int(shm.with_relevance) + '</dd>' +
      '<dt>state tier refreshed</dt><dd>' + yn(shm.state_tier_refreshed ? '1' : '0') + '</dd>' +
      '<dt>generated</dt><dd>' + esc(shm.generated || '\u2014') + '</dd>' +
      '</dl>' +
      '<div class="sub" style="margin-top:9px">Two tiers. The state tier is queried from ' +
      'OpenStates on a schedule: each state\u2019s governor, plus the sponsors of the ' +
      'furthest-advanced data center bill this project has matched in that state, so a ' +
      'legislator appears here because of a bill they put their name on rather than a ' +
      'subject-matter title. The county tier is a seeded source of record assembled from ' +
      'official government pages, because no national register of county board chairs, ' +
      'administrators and mayors exists; the pipeline validates and republishes it but never ' +
      'invents or edits a county row. A withheld row failed identity validation \u2014 most ' +
      'often a term that has already ended, which is the way this layer goes stale. ' +
      'A warned row is published with one unusable contact field blanked.</div>';
  }

  var bmf = META.benchmark_manifest;
  if (bmf) {
    h += '<h4>Comparison layer</h4>' +
      '<dl class="dl">' +
      '<dt>counties in the frame</dt><dd>' + fmt_int(bmf.counties) + '</dd>' +
      '<dt>counties with a peer group</dt><dd>' + fmt_int(bmf.counties_matchable) +
        ' (the rest are missing a matching feature and are left unmatched ' +
        'rather than imputed)</dd>' +
      '<dt>peers per county</dt><dd>' + fmt_int(bmf.peers_per_county) + '</dd>' +
      '<dt>matching features</dt><dd>' + esc((bmf.match_features || []).join(', ')) + '</dd>' +
      '<dt>reference groups</dt><dd>' +
        esc(Object.keys(bmf.groups || {}).join(', ')) + ', plus ' +
        fmt_int(bmf.state_groups) + ' state groups</dd>' +
      '<dt>counties that have restricted</dt><dd>' +
        fmt_int((bmf.groups || {}).restrictive) + '</dd>' +
      '<dt>score separation</dt><dd>' +
        fmt_prob(bmf.score_separation_restrictive_minus_non) +
        ' between the two group medians</dd>' +
      '<dt>metrics profiled</dt><dd>' + fmt_int(bmf.metrics) + '</dd>' +
      '<dt>generated</dt><dd>' + esc(bmf.generated || '—') + '</dd>' +
      '</dl>' +
      '<div class="sub">Reference values are medians, not means: the county ' +
      'distributions are long-tailed, and a handful of Loudouns would drag a mean ' +
      'away from the typical county. Percentiles use the mid-rank convention, so ' +
      'the many counties tied at zero opposition events read at the middle of that ' +
      'tie rather than the bottom of the national distribution. A peer group is a ' +
      'similarity set, not a matched control, and supports no statement about what ' +
      'would have happened here. IDENTIFIABILITY.md records why.</div>';
  }

  var pmf = META.position_manifest;
  if (pmf) {
    h += '<h4>Public positions</h4>' +
      '<dl class="dl">' +
      '<dt>position rows</dt><dd>' + fmt_int(pmf.position_rows) + '</dd>' +
      '<dt>people with a record</dt><dd>' + fmt_int(pmf.people) + '</dd>' +
      '<dt>counties with a body action</dt><dd>' + fmt_int(pmf.counties_covered) + '</dd>' +
      '<dt>states covered</dt><dd>' + fmt_int((pmf.states_covered || []).length) + '</dd>' +
      '<dt>roll calls read</dt><dd>' + fmt_int(pmf.votes_read) + '</dd>' +
      '<dt>roll calls withheld</dt><dd>' + fmt_int(pmf.votes_withheld) +
        ' (subject gate)</dd>' +
      '<dt>bills admitted</dt><dd>' +
        fmt_int(pmf.bills_passing_subject_gate) + ' of ' + fmt_int(pmf.bills_in_frame) +
        ', ' + fmt_int(pmf.bills_with_direction) + ' of them carrying a direction</dd>' +
      '<dt>by reach</dt><dd>' +
        Object.keys(pmf.by_reach || {}).sort().map(function (k) {
          return esc(REACH_TEXT[k] || k) + ' ' + fmt_int(pmf.by_reach[k]);
        }).join(' &middot; ') + '</dd>' +
      '<dt>human subject overrides</dt><dd>' + fmt_int(pmf.override_rows) +
        ' (an escape hatch, not the mechanism: reach is derived)</dd>' +
      '<dt>generated</dt><dd>' + esc(pmf.generated || '—') + '</dd>' +
      '</dl>' +
      '<div class="sub">Every matched bill is classified on two axes by ' +
      'bill_taxonomy.py, and the classification carries the evidence that ' +
      'produced it. <b>Reach</b> is how the law gets to data centers: the title ' +
      'names them, the title binds a load or size class they dominate, or the ' +
      'provisions ride inside a wider bill whose data center content is ' +
      'established by the record that put it here. Only the first two let a vote ' +
      'count as a position. <b>Instrument</b> is what the law does \u2014 ' +
      'moratorium, siting, ratepayer cost allocation, incentive grant or repeal, ' +
      'disclosure, water, supply enablement, local control \u2014 and direction ' +
      'follows from the instrument, so the two can never disagree.<br><br>' +
      'Evidence from the matched record is admitted only when it names this exact ' +
      'bill, because one record routinely names several bill numbers and the match ' +
      'fans out to all of them. A record about data centers that returns a bill on ' +
      'immigration, child restraints or abortion is a wrong bill, not a coverage ' +
      'gap: its votes are withheld and it is queued for repair.<br><br>' +
      'Stances sit on three separate axes \u2014 restriction, industry incentive, ' +
      'disclosure \u2014 and are never netted into one pro-or-anti score. A ' +
      'legislator with acts on both sides is labelled mixed, not averaged. The withheld ' +
      'bills are ranked in data/stakeholder_positions_qc.md by how many votes a ' +
      'human confirmation would unlock; confirmations go in ' +
      'data/bill_subject_overrides.csv, which the pipeline reads and never ' +
      'writes to.</div>';
  }

  h += '<h4>Standing interpretation rules</h4><div class="sub">Nothing here is a causal ' +
    'estimate; figures describe associations and observed histories. No dollar amount or ' +
    'delay in this system is attributable to opposition. Confirmed outcomes require finality ' +
    'evidence \u2014 a bill stage or terminal status \u2014 never an outcome label alone.</div>';

  return h + '</details>';
}

function glossary_panel() {
  if (!META.codebook) return '';
  return '<details><summary>Field glossary (CODEBOOK.md)</summary>' +
    '<pre>' + esc(META.codebook) + '</pre></details>';
}

/* ------------------------------ export ---------------------------- */

/* One tidy long-format file: section, record_id, field, value. Every scalar
 * and every row of every table for this county lands in it, including the
 * opposition columns that the tables do not show. Long format is the only
 * shape that survives the schema differences between these files. */
function csv_cell(v) {
  var s = String(v === null || v === undefined ? '' : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function export_csv() {
  if (!CURRENT) return;
  var slice = county_slice(CURRENT), c = slice.county;
  var lines = [['section', 'record_id', 'field', 'value'].join(',')];

  function push(section, id, field, value) {
    lines.push([csv_cell(section), csv_cell(id), csv_cell(field), csv_cell(value)].join(','));
  }
  function push_row(section, id, obj) {
    Object.keys(obj).forEach(function (k) { push(section, id, k, obj[k]); });
  }

  push('identity', c.fips, 'fips', c.fips);
  push('identity', c.fips, 'county_name', c.county);
  push('identity', c.fips, 'state_abbr', c.state_abbr);
  push('identity', c.fips, 'state_name', c.state_name);
  push('identity', c.fips, 'exported_utc', new Date().toISOString());
  /* The Export button is live as soon as a county is picked, which is before
     the detail wave lands. An export taken in that window is real but partial:
     the label, its evidence and the comparison are present, the project and
     event tables are not. Saying so in the file is the difference between a
     short export and a misleading one. */
  push('identity', c.fips, 'detail_tables_complete', DETAIL_READY ? '1' : '0');

  push_row('county_aggregate', c.fips, c.agg);
  if (c.score) push_row('policy_score', c.fips, c.score);
  if (c.interval) push_row('policy_interval', c.fips, c.interval);
  if (c.national_pct !== undefined) {
    push('derived_rank', c.fips, 'national_percentile', c.national_pct.toFixed(2));
    push('derived_rank', c.fips, 'national_rank', c.national_rank);
    push('derived_rank', c.fips, 'national_counties_scored', c.national_n);
  }
  if (c.state_rank) {
    push('derived_rank', c.fips, 'state_rank', c.state_rank);
    push('derived_rank', c.fips, 'state_counties_scored', c.state_n);
  }

  slice.site_screen.forEach(function (r) { push_row('site_screen', r.project_id, r); });
  slice.lifecycles.forEach(function (r) { push_row('project_lifecycle', r.project_id, r); });
  slice.proposals.forEach(function (r) { push_row('proposal', r.id, r); });
  slice.facilities.forEach(function (r) { push_row('facility', r.facility_id, r); });
  slice.opposition.forEach(function (r, i) {
    push_row('opposition_event', r.Incident || (r.project_id || 'row') + '_' + (i + 1), r);
  });
  slice.meetings.forEach(function (r, i) {
    push_row('local_meeting', (r.jurisdiction || 'meeting') + '_' + (i + 1), r);
  });
  slice.neighbors.forEach(function (n) {
    push_row('neighbor_county', n.fips, n.agg);
    if (n.score) push_row('neighbor_policy_score', n.fips, n.score);
  });

  slice.restrictions.forEach(function (r, i) {
    push_row('enacted_restriction', (r.instrument || 'instrument') + '_' + (i + 1), r);
  });
  /* Exported under its own section name so a reader of the CSV cannot mistake
     an unreviewed upstream row for a census finding. */
  slice.census_unreviewed.forEach(function (r, i) {
    push_row('external_row_awaiting_review', (r.instrument || 'row') + '_' + (i + 1), r);
  });
  /* The grade travels with the data. A downloaded row that carries a
     restriction label and not the evidence behind it is the same silence this
     page exists to break, one format further from anyone who could catch it. */
  if (slice.evidence) push_row('label_evidence', c.fips, slice.evidence);
  slice.evidence_conflicts.forEach(function (r, i) {
    push_row('label_evidence_conflict', (r.conflict || 'conflict') + '_' + (i + 1), r);
  });
  slice.coverage.forEach(function (r, i) { push_row('coverage_gap', c.fips + '_' + (i + 1), r); });
  slice.universe.forEach(function (r) { push_row('baseline_universe', r.universe_id, r); });
  slice.bills.forEach(function (r, i) {
    push_row('state_bill', (r.identifier || 'bill') + '_' + (i + 1), r);
  });
  slice.groups.forEach(function (r) {
    push_row('opposition_group', r.row.canonical_id, r.row);
    push('opposition_group', r.row.canonical_id, 'events_in_this_county', r.local_events);
    push('opposition_group', r.row.canonical_id, 'client_safe', r.client_safe ? '1' : '0');
  });
  Object.keys(slice.pred_by_pid).forEach(function (pid) {
    push_row('outcome_prediction', pid, slice.pred_by_pid[pid]);
  });
  Object.keys(slice.decision_by_pid).forEach(function (pid) {
    push_row('decision_date_provenance', pid, slice.decision_by_pid[pid]);
  });
  slice.trend.forEach(function (r) { push_row('risk_screen_trend', r.project_id, r); });
  if (slice.contagion) push_row('adjacency_scan', c.fips, slice.contagion);

  slice.stakeholders_county.concat(slice.stakeholders_state).forEach(function (r) {
    push_row('stakeholder', r.stakeholder_id || (r.level + '_' + r.office_class), r);
  });

  /* ---- comparison layer ---- */
  if (slice.benchmark) push_row('benchmark', c.fips, slice.benchmark);
  /* Every reference group this county is actually read against, so the export
   * reproduces the comparison table without needing the reference file. */
  ['national', 'restrictive', 'non_restrictive', 'dc_present', 'dc_absent',
   'tracked_activity', 'state:' + String(c.state_abbr || '').toUpperCase()
  ].forEach(function (g) {
    Object.keys(REFERENCE[g] || {}).forEach(function (m) {
      push_row('benchmark_reference', g + '|' + m, REFERENCE[g][m]);
    });
  });
  slice.peers.forEach(function (p) {
    push_row('peer_county', p.fips, p.agg);
    if (p.score) push_row('peer_policy_score', p.fips, p.score);
  });

  /* ---- positions ----
   * Uncapped, unlike the screen: the legislator table shows the longest
   * records and the export is the audit trail, so it carries every individual
   * vote behind every summary row. */
  slice.body_actions.forEach(function (r) { push_row('governing_body_action', r.position_id, r); });
  slice.priorities.forEach(function (r) { push_row('stated_priority', r.position_id, r); });
  slice.positions_state.forEach(function (r) { push_row('position', r.position_id, r); });
  slice.legislators.forEach(function (r) { push_row('position_summary', r.person_key, r); });
  slice.position_bills.forEach(function (r) {
    push_row('position_bill', r.bill.bill_key, r.bill);
    push('position_bill', r.bill.bill_key, 'votes_yes', r.yes);
    push('position_bill', r.bill.bill_key, 'votes_no', r.no);
    push('position_bill', r.bill.bill_key, 'votes_other', r.other);
    push('position_bill', r.bill.bill_key, 'first_vote_date', r.first);
    push('position_bill', r.bill.bill_key, 'last_vote_date', r.last);
  });

  /* Cost stays internal: it is only written when the operator has explicitly
   * turned the internal layers on, and the export says so on its own row. */
  push('export_scope', c.fips, 'internal_layers_included', SHOW_INTERNAL ? '1' : '0');
  if (SHOW_INTERNAL) {
    slice.cost.forEach(function (r) { push_row('cost_translation_internal', r.project_id, r); });
    (DATA.cost_anchors || []).forEach(function (r) {
      push_row('cost_anchor_internal', r.anchor_id, r);
    });
  }

  var blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'county-profile_' + slug(c.county) + '-' + (c.state_abbr || '').toLowerCase() +
    '_' + c.fips + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);

  var btn = document.getElementById('export');
  btn.textContent = 'Saved';
  setTimeout(function () { btn.textContent = 'Export CSV'; }, 1800);
}

/* ------------------------------ picker ---------------------------- */

function wire_picker() {
  var input = document.getElementById('search');
  var hits = document.getElementById('hits');
  var shown = [], cursor = -1;

  function close() { hits.classList.remove('open'); shown = []; cursor = -1; }

  function draw(q) {
    q = q.trim().toLowerCase();
    if (!q) { close(); return; }
    shown = COUNTIES.filter(function (c) { return c.label.toLowerCase().indexOf(q) !== -1; }).slice(0, 40);
    if (!shown.length) { close(); return; }
    cursor = 0;
    hits.innerHTML = shown.map(function (c, i) {
      return '<div data-i="' + i + '"' + (i === 0 ? ' class="sel"' : '') + '>' + esc(c.label) + '</div>';
    }).join('');
    hits.classList.add('open');
  }

  input.addEventListener('input', function () { draw(input.value); });
  input.addEventListener('focus', function () { input.select(); draw(input.value); });
  input.addEventListener('keydown', function (e) {
    if (!shown.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      cursor = (cursor + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % shown.length;
      Array.prototype.forEach.call(hits.children, function (el, i) {
        el.className = i === cursor ? 'sel' : '';
      });
      hits.children[cursor].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && cursor >= 0) {
      e.preventDefault();
      var pick = shown[cursor]; close(); select_county(pick.fips);
    } else if (e.key === 'Escape') { close(); }
  });
  hits.addEventListener('mousedown', function (e) {
    var t = e.target.closest('[data-i]');
    if (!t) return;
    e.preventDefault();
    var pick = shown[Number(t.getAttribute('data-i'))];
    close(); select_county(pick.fips);
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.picker')) close();
  });

  input.disabled = false;
  input.placeholder = 'Search ' + COUNTIES.length.toLocaleString() + ' counties\u2026';
}

function initial_fips() {
  var h = location.hash || '';
  var m = h.match(/fips=(\d{4,5})/);
  if (m) {
    var f = m[1].padStart(5, '0');
    if (BY_FIPS[f]) return f;
  }
  var q = new URLSearchParams(location.search).get('fips');
  if (q && BY_FIPS[q.padStart(5, '0')]) return q.padStart(5, '0');
  var slugged = h.match(/county=([a-z0-9-]+)-([a-z]{2})\b/);
  if (slugged) {
    var want = slugged[1], st = slugged[2].toUpperCase();
    var hit = COUNTIES.filter(function (c) {
      return c.state_abbr === st && slug(c.county) === want;
    })[0];
    if (hit) return hit.fips;
  }
  return null;
}

document.getElementById('export').addEventListener('click', export_csv);
document.getElementById('print').addEventListener('click', function () { window.print(); });
document.getElementById('internal').addEventListener('change', function () {
  SHOW_INTERNAL = this.checked;
  if (CURRENT) render(county_slice(CURRENT));
});
document.getElementById('permalink').addEventListener('click', function () {
  var btn = this;
  navigator.clipboard.writeText(location.href).then(function () {
    btn.textContent = 'Copied';
    setTimeout(function () { btn.textContent = 'Copy link'; }, 1600);
  }).catch(function () { btn.textContent = 'Copy blocked'; });
});
window.addEventListener('hashchange', function () {
  var f = initial_fips();
  if (f && f !== CURRENT) select_county(f, false);
});

load_core().then(function (missing) {
  if (missing.length) {
    banner('<b>Core data unavailable.</b> Could not reach ' + esc(missing.join(', ')) +
      ' from raw.githubusercontent.com. The files regenerate with the CI pipeline; if this ' +
      'persists, the last run may have failed its QC gate.');
    document.getElementById('body').innerHTML = '';
    return;
  }
  build_frame();
  wire_picker();
  document.getElementById('print').disabled = false;
  load_meta().then(function () { if (CURRENT) render(county_slice(CURRENT)); });
  var start = initial_fips();
  if (start) {
    select_county(start, false);
  } else {
    document.getElementById('body').innerHTML =
      '<div class="loading">Search for a county above to load its profile. ' +
      'Every descriptive field, model score, project, facility, opposition event, ' +
      'opposition group, state bill, neighboring county and model card comes down in one ' +
      'CSV from the Export button.</div>';
  }
  return load_detail().then(function (missing2) {
    if (missing2.length) {
      banner('<b>Some detail files were unreachable:</b> ' + esc(missing2.join(', ')) +
        '. The scorecards above are unaffected; the matching tables below will read as empty.');
    }
    if (CURRENT) render(county_slice(CURRENT));
  });
});
</script>
