<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>County Profile</title>
<style>
:root {
  --bg:#0f1218; --panel:#161c25; --panel2:#1c242f; --text:#eef2f7;
  --muted:#8a96a4; --border:#2c3544;
  --atlas:#4f98a3; --accent:#ea580c; --accent2:#fbbf24; --bad:#c0566b; --good:#4f98a3;
}
* { box-sizing:border-box; margin:0; padding:0 }
body { font-family:Inter,system-ui,sans-serif; background:var(--bg); color:var(--text);
  padding:18px; min-height:100vh; font-size:13px }
h2 { font-weight:700; font-size:20px }
h3 { font-weight:700; font-size:14px; margin-bottom:10px }
a { color:var(--atlas) }

.nav { gap:6px; flex-wrap:wrap; margin-bottom:14px }
.nav-pill { padding:6px 12px; border-radius:999px; border:1px solid var(--border);
  background:var(--panel); color:var(--muted); font-size:12px; text-decoration:none }
.nav-pill:hover { color:var(--text); border-color:var(--atlas) }
.nav-pill.active { color:var(--atlas); border-color:var(--atlas); background:var(--panel2) }
.nav-pill:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible {
  outline:2px solid var(--atlas); outline-offset:2px }

.toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px }
.picker { flex:1; min-width:260px; max-width:460px; position:relative }
input[type=text] { width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--panel); color:var(--text); font:inherit }
.hits { position:absolute; z-index:50; top:calc(100% + 4px); left:0; right:0; max-height:300px;
  overflow-y:auto; background:var(--panel2); border:1px solid var(--border); border-radius:8px;
  display:none }
.hits.open { display:block }
.hits div { padding:7px 12px; cursor:pointer; border-bottom:1px solid var(--border) }
.hits div:last-child { border-bottom:none }
.hits div:hover, .hits div.sel { background:var(--panel); color:var(--atlas) }
button { padding:9px 14px; border-radius:8px; border:1px solid var(--border);
  background:var(--panel); color:var(--text); font:inherit; cursor:pointer }
button:hover { border-color:var(--atlas) }
button.primary { background:var(--atlas); border-color:var(--atlas); color:#08131a; font-weight:600 }
button.primary:hover { filter:brightness(1.1) }

#error-banner { display:none; background:#3a1520; border:1px solid #7a2535; color:#ffb4c0;
  padding:11px 13px; border-radius:10px; margin-bottom:14px; font-size:12px }
.loading { color:var(--muted); padding:26px 2px; font-size:13px }

.title-row { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:3px }
.sub { color:var(--muted); font-size:12px; margin-bottom:16px }
.sub.trailing { margin:12px 0 0 }
.flag { display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600 }
.flag.on { background:#3a2116; border:1px solid var(--accent); color:var(--accent2) }
.flag.off { background:var(--panel2); border:1px solid var(--border); color:var(--muted) }
.flag.warn { background:#3a1520; border:1px solid #7a2535; color:#ffb4c0 }
.delta { font-variant-numeric:tabular-nums; white-space:nowrap }
.delta.up { color:var(--accent2) }
.delta.down { color:#5fae7e }

details { background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:0 13px; margin-bottom:14px }
details h4 { margin:17px 0 7px; font-size:12.5px; color:var(--text) }
details .sub { margin-bottom:0 }
details[open] { padding-bottom:13px }
summary { cursor:pointer; padding:11px 0; font-weight:600; font-size:13px; list-style:none }
summary::-webkit-details-marker { display:none }
summary::before { content:'\25b8  '; color:var(--muted) }
details[open] summary::before { content:'\25be  ' }
details pre { white-space:pre-wrap; font-size:11.5px; line-height:1.6; color:var(--muted);
  margin:0; max-height:460px; overflow:auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
.dl { display:grid; grid-template-columns:max-content 1fr; gap:5px 16px; font-size:12px }
.dl dt { color:var(--muted) }
.dl dd { margin:0 }

.internal { border-left:3px solid var(--accent); padding-left:12px }
.internal-note { background:#3a2116; border:1px solid var(--accent); color:var(--accent2);
  padding:9px 11px; border-radius:8px; font-size:11.5px; margin-bottom:11px; line-height:1.6 }
.switch { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted);
  white-space:nowrap; cursor:pointer }

@media print {
  :root { --bg:#fff; --panel:#fff; --panel2:#f4f6f8; --text:#111; --muted:#555; --border:#c8d0d8 }
  body { background:#fff; color:#111 }
  .nav, .toolbar, #error-banner { display:none !important }
  .tbl-wrap { max-height:none; overflow:visible; break-inside:auto }
  section { break-inside:avoid }
  details { break-inside:avoid }
  details pre { max-height:none }
  a { color:#111; text-decoration:underline }
  .clip { max-width:none; -webkit-line-clamp:unset; display:block }
}

section { margin-bottom:22px }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:9px }
.kpi { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:11px 13px }
.kpi b { display:block; font-size:19px; font-weight:700; line-height:1.25 }
.kpi span { font-size:11px; color:var(--muted); display:block; margin-top:2px }
.kpi em { font-style:normal; font-size:11px; color:var(--muted) }
.kpi.hero b { font-size:26px; color:var(--accent2) }

.bar { height:6px; border-radius:3px; background:var(--panel2); margin-top:8px; position:relative;
  overflow:hidden }
.bar i { position:absolute; top:0; bottom:0; background:var(--atlas); border-radius:3px }
.bar u { position:absolute; top:0; bottom:0; background:var(--accent2); opacity:.35 }

table { width:100%; border-collapse:collapse; font-size:12px }
th { text-align:left; padding:7px 9px; color:var(--muted); font-weight:600; font-size:11px;
  border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0;
  background:var(--panel2) }
td { padding:7px 9px; border-bottom:1px solid var(--border); vertical-align:top }
tr:last-child td { border-bottom:none }
.tbl-wrap { background:var(--panel); border:1px solid var(--border); border-radius:10px;
  overflow:auto; max-height:430px }
.empty { color:var(--muted); padding:13px; font-size:12px }
.clip { max-width:380px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box;
  -webkit-line-clamp:3; -webkit-box-orient:vertical }
.nowrap { white-space:nowrap }
.link-county { cursor:pointer; color:var(--atlas) }
.count { color:var(--muted); font-weight:400; font-size:12px; margin-left:6px }
footer { color:var(--muted); font-size:11px; border-top:1px solid var(--border); padding-top:12px;
  margin-top:26px; line-height:1.7 }
</style>
</head>
<body>

<!-- Site nav: visible on direct visits, auto-hidden inside iframe embeds
     (Notion/Simple.ink) so embedded views stay clean. Same pattern as
     restriction-model.html. -->
<nav class="nav" id="site-nav" style="display:none">
  <a href="index.html" class="nav-pill">Atlas Map</a>
  <a href="opposition-tracker.html" class="nav-pill">Opposition Tracker</a>
  <a href="opposition-dashboard.html" class="nav-pill">Opposition Dashboard</a>
  <a href="developments-dashboard.html" class="nav-pill">Developments</a>
  <a href="project-lifecycles.html" class="nav-pill">Projects</a>
  <a href="restriction-model.html" class="nav-pill">Restriction Model</a>
  <a href="county-profile.html" class="nav-pill active">County Profile</a>
</nav>
<script>
  try { if (window.self === window.top) document.getElementById('site-nav').style.display = 'flex'; }
  catch (e) { /* cross-origin frame access throws -> we are embedded; keep hidden */ }
</script>

<div id="error-banner"></div>

<div class="toolbar">
  <div class="picker">
    <input type="text" id="search" autocomplete="off" spellcheck="false"
           placeholder="Loading counties&hellip;" disabled
           aria-label="Search for a county">
    <div class="hits" id="hits"></div>
  </div>
  <button id="export" class="primary" disabled>Export CSV</button>
  <button id="permalink" disabled>Copy link</button>
  <button id="print" disabled>Print</button>
  <label class="switch" title="Cost translation is internal-only until a matched-control delay estimate exists; see the methodology panel.">
    <input type="checkbox" id="internal"> Internal layers
  </label>
</div>

<div id="body"><div class="loading">Loading county frame&hellip;</div></div>

<script>
/* ------------------------------------------------------------------ *
 * Single-county profile. Every value on this page comes from a file in
 * this repository, so the page stays correct as the CI pipeline
 * regenerates them. Nothing is computed here that is not either a
 * direct read or a rank/percentile over a file that was just read.
 *
 * Fetch order is raw.githubusercontent FIRST, per the standing rule in
 * this repo: it is the only origin that reliably sends CORS headers to
 * a Notion iframe. Pages and relative paths are fallbacks.
 * ------------------------------------------------------------------ */

var RAW = 'https://raw.githubusercontent.com/pricephillips/data-center-map/main/';
var PAGES = 'https://pricephillips.github.io/data-center-map/';
function urls(p) { return [RAW + p, PAGES + p, './' + p]; }

/* Loaded in two waves. The core wave is small and drives the picker and
 * the scorecards; the detail wave includes master_opposition_clean.csv
 * (~3.5 MB) and only fills the tables, so it must not block first paint. */
var CORE_FILES = {
  aggregate: 'data/county_aggregate.csv',
  scores: 'data/county_policy_scores.csv',
  intervals: 'data/county_policy_intervals.csv'
};
var DETAIL_FILES = {
  lifecycles: 'data/project_lifecycles.csv',
  proposals: 'data/proposals.csv',
  facilities: 'data/facility_registry.csv',
  site_screen: 'data/site_screen.csv',
  meetings: 'data/local_meeting_feed.csv',
  adjacency: 'data/county_adjacency.csv',
  opposition: 'master_opposition_clean.csv',
  /* second pass, added for the client view */
  restriction_census: 'data/external_restriction_census.csv',
  coverage_gap: 'data/coverage_gap_report.csv',
  universe: 'data/baseline_universe.csv',
  outcome_pred: 'data/outcome_model_predictions.csv',
  decision_dates: 'data/project_decision_dates.csv',
  bills: 'data/bill_sync_matches.csv',
  groups: 'group_registry.csv',
  groups_audit: 'data/group_registry_audit.csv',
  adjacency_scan: 'data/adjacency_scan_queue.csv',
  screen_history: 'data/site_screen_history.csv',
  cost: 'data/cost_translation_demo.csv',
  cost_anchors: 'data/cost_anchors.csv',
  calibration: 'data/calibration_history.csv',
  /* third pass: the people layer */
  stakeholders: 'data/stakeholder_registry.csv'
};

/* Model cards and freshness stamps. Read as JSON, never blocking. */
var JSON_FILES = {
  policy_metrics: 'data/county_policy_metrics.json',
  outcome_metrics: 'data/outcome_model_metrics.json',
  survival_metrics: 'data/survival_model_metrics.json',
  aggregate_manifest: 'data/county_aggregate_manifest.json',
  stakeholder_manifest: 'data/stakeholder_manifest.json'
};

var STATE_NAME = {
  AL:'alabama', AK:'alaska', AZ:'arizona', AR:'arkansas', CA:'california', CO:'colorado',
  CT:'connecticut', DE:'delaware', DC:'district of columbia', FL:'florida', GA:'georgia',
  HI:'hawaii', ID:'idaho', IL:'illinois', IN:'indiana', IA:'iowa', KS:'kansas', KY:'kentucky',
  LA:'louisiana', ME:'maine', MD:'maryland', MA:'massachusetts', MI:'michigan', MN:'minnesota',
  MS:'mississippi', MO:'missouri', MT:'montana', NE:'nebraska', NV:'nevada', NH:'new hampshire',
  NJ:'new jersey', NM:'new mexico', NY:'new york', NC:'north carolina', ND:'north dakota',
  OH:'ohio', OK:'oklahoma', OR:'oregon', PA:'pennsylvania', RI:'rhode island',
  SC:'south carolina', SD:'south dakota', TN:'tennessee', TX:'texas', UT:'utah', VT:'vermont',
  VA:'virginia', WA:'washington', WV:'west virginia', WI:'wisconsin', WY:'wyoming',
  PR:'puerto rico'
};

var DATA = {};          /* file key -> array of row objects */
var COUNTIES = [];      /* picker frame, one entry per county in county_aggregate */
var BY_FIPS = {};       /* fips -> picker entry */
var NAME_TO_FIPS = {};  /* "county|state name" -> fips, built from county_aggregate */
var DETAIL_READY = false;
var CURRENT = null;     /* fips of the county on screen */
var META = {};          /* json key -> parsed object */

/* cost_layer_notes.md marks the cost translation internal-only until a
 * matched-control delay estimate exists, and IDENTIFIABILITY.md records
 * that estimate as a settled negative result. So the layer ships behind
 * this switch, off by default, and never in a client export. */
var SHOW_INTERNAL = false;

/* ---------------------------- plumbing ---------------------------- */

function banner(msg) {
  var el = document.getElementById('error-banner');
  el.style.display = 'block';
  el.innerHTML = msg;
}

function fetch_first(list) {
  var i = 0;
  function attempt() {
    if (i >= list.length) return Promise.resolve(null);
    var u = list[i++];
    return fetch(u, { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .catch(attempt);
  }
  return attempt();
}

/* RFC 4180 parser. master_opposition_clean.csv carries quoted commas and
 * embedded newlines in its Summary column, so a split(',') will not do. */
function parse_csv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  var rows = [], row = [], field = '', quoted = false, i = 0;
  while (i < text.length) {
    var c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        quoted = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { quoted = true; i++; continue; }
    if (c === ',') { row.push(field); field = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); field = ''; rows.push(row); row = []; i++; continue; }
    field += c; i++;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  var head = rows.shift().map(function (h) { return h.trim(); });
  var out = [];
  for (var r = 0; r < rows.length; r++) {
    if (rows[r].length < 2) continue;
    var o = {};
    for (var j = 0; j < head.length; j++) o[head[j]] = rows[r][j] === undefined ? '' : rows[r][j];
    out.push(o);
  }
  return out;
}

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* --------------------------- normalising -------------------------- */

var COUNTY_SUFFIX = /\s+(county|parish|borough|census area|city and borough|municipality|municipio)$/;

function state_key(s) {
  s = String(s || '').trim();
  if (!s) return '';
  if (s.length === 2) return STATE_NAME[s.toUpperCase()] || '';
  return s.toLowerCase();
}

/* Trailing annotations that appear in the hand-maintained census files:
 * "Clay County (permanent restriction after earlier crypto moratorium)",
 * "Meade County Fiscal Court". Neither is part of the county's name. */
var COUNTY_NOISE = /\s*\([^)]*\)\s*$|\s+fiscal court$/g;

/* Consolidated city-county governments filed under the joint name while
 * county_aggregate carries the census name. */
var COUNTY_ALIAS = {
  'athens-clarke|georgia': 'clarke',
  'augusta-richmond|georgia': 'richmond',
  'nashville-davidson|tennessee': 'davidson'
};

function resolve_fips(county, state) {
  var st = state_key(state);
  var c = String(county || '').trim().toLowerCase().replace(COUNTY_NOISE, '').trim();
  if (!st || !c) return '';
  var bare = c.replace(COUNTY_SUFFIX, '');
  return NAME_TO_FIPS[c + '|' + st]
      || NAME_TO_FIPS[bare + '|' + st]
      || NAME_TO_FIPS[(COUNTY_ALIAS[bare + '|' + st] || '\u0000') + '|' + st]
      || '';
}

/* Several files pack co-located counties into one cell, using either
 * separator: "A County; B County" and "St. Charles County/Warren County". */
function row_fips_list(county, state) {
  var out = [];
  String(county || '').split(/[;\/]/).forEach(function (part) {
    var f = resolve_fips(part, state);
    if (f && out.indexOf(f) === -1) out.push(f);
  });
  return out;
}

function slug(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

/* --------------------------- formatting --------------------------- */

function num(v) {
  if (v === '' || v === null || v === undefined) return null;
  var n = Number(v);
  return isNaN(n) ? null : n;
}
function fmt_int(v) {
  var n = num(v);
  return n === null ? '\u2014' : Math.round(n).toLocaleString();
}
function fmt_num(v, dp) {
  var n = num(v);
  return n === null ? '\u2014' : n.toLocaleString(undefined,
    { minimumFractionDigits: dp, maximumFractionDigits: dp });
}
function fmt_money(v) {
  var n = num(v);
  return n === null ? '\u2014' : '$' + Math.round(n).toLocaleString();
}
function fmt_pct(v, dp) {
  var n = num(v);
  return n === null ? '\u2014' : n.toFixed(dp === undefined ? 1 : dp) + '%';
}
function fmt_prob(v, dp) {
  var n = num(v);
  return n === null ? '\u2014' : (n * 100).toFixed(dp === undefined ? 1 : dp) + '%';
}
/* margin_2024 / margin_2016 are signed share margins in [-1, 1], positive =
 * Democratic. Sign convention is declared in county_policy_model.py. */
function fmt_margin(v) {
  var n = num(v);
  if (n === null) return '\u2014';
  return (n >= 0 ? 'D+' : 'R+') + (Math.abs(n) * 100).toFixed(1);
}
function fmt_date(v) {
  var s = String(v || '').trim();
  return s ? s.slice(0, 10) : '\u2014';
}
function yn(v) {
  var s = String(v === null || v === undefined ? '' : v).trim().toLowerCase();
  if (s === '1' || s === 'true' || s === 'yes') return 'Yes';
  if (s === '0' || s === 'false' || s === 'no') return 'No';
  return s ? esc(v) : '\u2014';
}
function ordinal(n) {
  var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function link(url, label) {
  var u = String(url || '').trim();
  if (!/^https?:\/\//i.test(u)) return '\u2014';
  return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(label || 'Link') + '</a>';
}

/* ------------------------------ boot ------------------------------ */

function load_core() {
  var keys = Object.keys(CORE_FILES);
  return Promise.all(keys.map(function (k) { return fetch_first(urls(CORE_FILES[k])); }))
    .then(function (texts) {
      var missing = [];
      keys.forEach(function (k, i) {
        DATA[k] = parse_csv(texts[i]);
        if (!DATA[k].length) missing.push(CORE_FILES[k]);
      });
      return missing;
    });
}

function load_detail() {
  var keys = Object.keys(DETAIL_FILES);
  return Promise.all(keys.map(function (k) { return fetch_first(urls(DETAIL_FILES[k])); }))
    .then(function (texts) {
      var missing = [];
      keys.forEach(function (k, i) {
        DATA[k] = parse_csv(texts[i]);
        if (!DATA[k].length) missing.push(DETAIL_FILES[k]);
      });
      DETAIL_READY = true;
      return missing;
    });
}

function load_meta() {
  var keys = Object.keys(JSON_FILES);
  return Promise.all(keys.map(function (k) { return fetch_first(urls(JSON_FILES[k])); }))
    .then(function (texts) {
      keys.forEach(function (k, i) {
        try { META[k] = texts[i] ? JSON.parse(texts[i]) : null; } catch (e) { META[k] = null; }
      });
    })
    /* The codebook is the canonical field dictionary; render it rather than
     * restating definitions here, so the glossary cannot drift from it. */
    .then(function () { return fetch_first(urls('CODEBOOK.md')); })
    .then(function (t) { META.codebook = t || ''; });
}

function build_frame() {
  var score_by_fips = {}, interval_by_fips = {};
  DATA.scores.forEach(function (r) { score_by_fips[r.fips] = r; });
  DATA.intervals.forEach(function (r) { interval_by_fips[r.fips] = r; });

  COUNTIES = DATA.aggregate.map(function (r) {
    /* county_name is "Loudoun County, Virginia" */
    var parts = String(r.county_name || '').split(',');
    var cname = parts[0].trim();
    var sname = (parts[1] || '').trim();
    return {
      fips: r.fips,
      county: cname,
      state_abbr: r.state,
      state_name: sname,
      label: cname + ', ' + (sname || r.state),
      agg: r,
      score: score_by_fips[r.fips] || null,
      interval: interval_by_fips[r.fips] || null
    };
  });

  COUNTIES.forEach(function (c) {
    BY_FIPS[c.fips] = c;
    var st = state_key(c.state_name || c.state_abbr);
    if (!st) return;
    var lc = c.county.toLowerCase();
    NAME_TO_FIPS[lc + '|' + st] = c.fips;
    NAME_TO_FIPS[lc.replace(COUNTY_SUFFIX, '') + '|' + st] = c.fips;
  });

  /* National and within-state percentile of the calibrated score. Computed
   * once over the frame we just read rather than stored, so it can never
   * drift from the score file on screen. */
  var scored = COUNTIES.filter(function (c) { return c.score && num(c.score.calibrated_score) !== null; });
  scored.sort(function (a, b) { return num(a.score.calibrated_score) - num(b.score.calibrated_score); });
  scored.forEach(function (c, i) {
    c.national_pct = scored.length > 1 ? (i / (scored.length - 1)) * 100 : 100;
    c.national_rank = scored.length - i;
    c.national_n = scored.length;
  });
  var by_state = {};
  scored.forEach(function (c) { (by_state[c.state_abbr] = by_state[c.state_abbr] || []).push(c); });
  Object.keys(by_state).forEach(function (st) {
    var list = by_state[st];
    list.forEach(function (c, i) { c.state_rank = list.length - i; c.state_n = list.length; });
  });
}

/* ---------------------------- selection --------------------------- */

function county_slice(fips) {
  var c = BY_FIPS[fips];
  var out = {
    county: c,
    lifecycles: [], proposals: [], facilities: [], site_screen: [],
    meetings: [], opposition: [], neighbors: [],
    restrictions: [], coverage: [], universe: [], bills: [], groups: [],
    cost: [], trend: [], contagion: null,
    stakeholders_county: [], stakeholders_state: []
  };
  if (!DETAIL_READY) return out;

  (DATA.lifecycles || []).forEach(function (r) {
    if (row_fips_list(r.county, r.state).indexOf(fips) !== -1) out.lifecycles.push(r);
  });
  (DATA.proposals || []).forEach(function (r) {
    if (row_fips_list(r.counties, r.state).indexOf(fips) !== -1) out.proposals.push(r);
  });
  (DATA.facilities || []).forEach(function (r) {
    if (row_fips_list(r.county, r.state).indexOf(fips) !== -1) out.facilities.push(r);
  });
  (DATA.site_screen || []).forEach(function (r) {
    if (String(r.fips || '').padStart(5, '0') === fips) out.site_screen.push(r);
  });
  (DATA.meetings || []).forEach(function (r) {
    if (row_fips_list(r.county, r.state).indexOf(fips) !== -1) out.meetings.push(r);
  });
  (DATA.opposition || []).forEach(function (r) {
    if (row_fips_list(r.County, r.State).indexOf(fips) !== -1) out.opposition.push(r);
  });

  (DATA.adjacency || []).forEach(function (r) {
    if (String(r.fips || '').padStart(5, '0') !== fips) return;
    var nb = BY_FIPS[String(r.neighbor_fips || '').padStart(5, '0')];
    if (nb) out.neighbors.push(nb);
  });
  out.neighbors.sort(function (a, b) {
    var sa = a.score ? num(a.score.calibrated_score) : -1;
    var sb = b.score ? num(b.score.calibrated_score) : -1;
    return sb - sa;
  });

  out.opposition.sort(function (a, b) { return String(b.Date || '').localeCompare(String(a.Date || '')); });
  out.lifecycles.sort(function (a, b) {
    return String(b.announced_date || '').localeCompare(String(a.announced_date || ''));
  });

  /* ---- second-pass layers ---- */

  (DATA.restriction_census || []).forEach(function (r) {
    if (row_fips_list(r.county, r.state).indexOf(fips) !== -1) out.restrictions.push(r);
  });
  out.restrictions.sort(function (a, b) {
    return String(b.date_enacted || '').localeCompare(String(a.date_enacted || ''));
  });

  (DATA.coverage_gap || []).forEach(function (r) {
    if (row_fips_list(r.county, r.state).indexOf(fips) !== -1) out.coverage.push(r);
  });

  /* baseline_universe carries its own fips; fall back to names when blank. */
  (DATA.universe || []).forEach(function (r) {
    var f = String(r.fips || '').padStart(5, '0');
    if (f === fips || (!r.fips && row_fips_list(r.county, r.state).indexOf(fips) !== -1)) {
      out.universe.push(r);
    }
  });
  out.universe.sort(function (a, b) {
    return String(b.announced_date || '').localeCompare(String(a.announced_date || ''));
  });

  /* Bills are state-scoped, not county-scoped; labelled as such on screen. */
  var st_abbr = String(c.state_abbr || '').toUpperCase();
  (DATA.bills || []).forEach(function (r) {
    if (String(r.state || '').toUpperCase() === st_abbr) out.bills.push(r);
  });
  out.bills.sort(function (a, b) {
    return String(b.stage_date || b.latest_action_date || '')
      .localeCompare(String(a.stage_date || a.latest_action_date || ''));
  });

  /* Groups named on this county's own events, joined to the registry by
   * canonical name or any recorded variant, then counted locally. */
  var local_mentions = {};
  out.opposition.forEach(function (r) {
    String(r['Opposition Groups'] || '').split(';').forEach(function (g) {
      var k = g.trim().toLowerCase();
      if (k) local_mentions[k] = (local_mentions[k] || 0) + 1;
    });
  });
  var safe = {};
  (DATA.groups_audit || []).forEach(function (r) {
    safe[String(r.canonical_name || '').trim().toLowerCase()] = r.client_safe === '1';
  });
  var seen_groups = {};
  (DATA.groups || []).forEach(function (r) {
    var canon = String(r.canonical_name || '').trim().toLowerCase();
    var keys = [canon];
    String(r.variants || '').split(';').forEach(function (v) {
      var k = v.trim().toLowerCase();
      if (k) keys.push(k);
    });
    var local = 0;
    keys.forEach(function (k) { if (local_mentions[k]) local += local_mentions[k]; });
    if (local && !seen_groups[canon]) {
      seen_groups[canon] = true;
      out.groups.push({ row: r, local_events: local, client_safe: safe[canon] !== false });
    }
  });
  out.groups.sort(function (a, b) { return b.local_events - a.local_events; });

  /* Per-project model and cost layers key on project_id, so they attach to
   * the projects already resolved into this county. */
  var pids = {};
  out.lifecycles.forEach(function (r) { if (r.project_id) pids[r.project_id] = true; });
  out.site_screen.forEach(function (r) { if (r.project_id) pids[r.project_id] = true; });

  out.pred_by_pid = {};
  (DATA.outcome_pred || []).forEach(function (r) {
    if (pids[r.project_id]) out.pred_by_pid[r.project_id] = r;
  });
  out.decision_by_pid = {};
  (DATA.decision_dates || []).forEach(function (r) {
    if (pids[r.project_id]) out.decision_by_pid[r.project_id] = r;
  });
  (DATA.cost || []).forEach(function (r) {
    if (pids[r.project_id]) out.cost.push(r);
  });

  /* Composite trend: latest run versus the earliest run on record. */
  var hist = {};
  (DATA.screen_history || []).forEach(function (r) {
    if (!pids[r.project_id] && row_fips_list(r.county, r.state).indexOf(fips) === -1) return;
    (hist[r.project_id] = hist[r.project_id] || []).push(r);
  });
  Object.keys(hist).forEach(function (pid) {
    var rows = hist[pid].sort(function (a, b) {
      return String(a.run_date || '').localeCompare(String(b.run_date || ''));
    });
    var first = rows[0], last = rows[rows.length - 1];
    out.trend.push({
      project_id: pid, name: last.name, tier: last.tier,
      first_run: first.run_date, last_run: last.run_date,
      first_composite: first.composite, last_composite: last.composite,
      delta: (num(last.composite) === null || num(first.composite) === null)
        ? null : num(last.composite) - num(first.composite),
      runs: rows.length
    });
  });
  out.trend.sort(function (a, b) { return (b.delta === null ? -1e9 : b.delta) - (a.delta === null ? -1e9 : a.delta); });

  (DATA.adjacency_scan || []).forEach(function (r) {
    if (String(r.fips || '').padStart(5, '0') === fips) out.contagion = r;
  });

  /* Stakeholders arrive already QC-gated: stakeholder_registry.py publishes
     only rows that passed, so nothing is filtered here. County rows key on
     FIPS, state rows on the abbreviation, and the state tier is always shown
     because it is the one layer guaranteed to be present for every county. */
  (DATA.stakeholders || []).forEach(function (r) {
    if (r.level === 'county' && String(r.fips || '').padStart(5, '0') === fips) {
      out.stakeholders_county.push(r);
    } else if (r.level === 'state' && String(r.state || '') === c.state_abbr) {
      out.stakeholders_state.push(r);
    }
  });
  out.stakeholders_county.sort(function (a, b) {
    return STAKEHOLDER_ORDER.indexOf(a.office_class) - STAKEHOLDER_ORDER.indexOf(b.office_class);
  });
  out.stakeholders_state.sort(function (a, b) {
    return STAKEHOLDER_ORDER.indexOf(a.office_class) - STAKEHOLDER_ORDER.indexOf(b.office_class);
  });

  return out;
}

function select_county(fips, push_hash) {
  if (!BY_FIPS[fips]) return;
  CURRENT = fips;
  var c = BY_FIPS[fips];
  document.getElementById('search').value = c.label;
  document.getElementById('export').disabled = false;
  document.getElementById('permalink').disabled = false;
  document.title = c.label + ' \u2014 County Profile';
  if (push_hash !== false) {
    var h = '#county=' + slug(c.county) + '-' + (c.state_abbr || '').toLowerCase() + '&fips=' + fips;
    if (location.hash !== h) history.replaceState(null, '', h);
  }
  render(county_slice(fips));
}

/* ----------------------------- render ----------------------------- */

function kpi(label, value, note, cls) {
  return '<div class="kpi' + (cls ? ' ' + cls : '') + '"><b>' + value + '</b>' +
    (note ? '<em>' + note + '</em>' : '') +
    '<span>' + label + '</span></div>';
}

function table(cols, rows, render_row, empty_msg) {
  if (!DETAIL_READY) return '<div class="empty">Loading&hellip;</div>';
  if (!rows.length) return '<div class="empty">' + empty_msg + '</div>';
  return '<div class="tbl-wrap"><table><thead><tr>' +
    cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') +
    '</tr></thead><tbody>' +
    rows.map(function (r) {
      return '<tr>' + render_row(r).map(function (cell) { return '<td>' + cell + '</td>'; }).join('') + '</tr>';
    }).join('') +
    '</tbody></table></div>';
}

function count_label(n) {
  return DETAIL_READY ? '<span class="count">' + n + '</span>' : '';
}

/* Page order for the stakeholder tables: local decision-makers first, then
   the state offices that set the frame above them. */
var STAKEHOLDER_ORDER = ['county_board', 'county_admin', 'mayor',
                         'governor', 'state_committee_chair'];

var OFFICE_CLASS_LABEL = {
  county_board: 'County board',
  county_admin: 'County administration',
  mayor: 'City',
  governor: 'Governor',
  state_committee_chair: 'Legislature'
};

function stakeholder_rows(rows) {
  return table(['Tier', 'Office', 'Name', 'Party', 'Term ends', 'Email', 'Phone',
                'Office address', 'Role in siting', 'Source'],
    rows, function (r) {
      var flags = String(r.qc_flags || '').split(';').filter(Boolean);
      var name = esc(r.name) +
        (r.jurisdiction ? '<div class="sub">' + esc(r.jurisdiction) + '</div>' : '');
      if (flags.length) {
        name += '<div class="sub"><span class="flag warn">' + esc(flags.join(' ')) +
          '</span></div>';
      }
      return [esc(OFFICE_CLASS_LABEL[r.office_class] || r.office_class),
              '<span class="clip">' + esc(r.office) + '</span>',
              name,
              r.party ? esc(r.party) : '\u2014',
              r.term_end ? '<span class="nowrap">' + esc(r.term_end) + '</span>' : '\u2014',
              r.contact_email
                ? '<a href="mailto:' + esc(r.contact_email) + '">' + esc(r.contact_email) + '</a>'
                : '\u2014',
              r.contact_phone ? '<span class="nowrap">' + esc(r.contact_phone) + '</span>' : '\u2014',
              r.contact_address ? '<span class="clip">' + esc(r.contact_address) + '</span>' : '\u2014',
              r.relevance_note
                ? '<span class="clip">' + esc(r.relevance_note) + '</span>' +
                  (r.relevance_source_url ? ' ' + link(r.relevance_source_url, 'src') : '')
                : '\u2014',
              link(r.source_url, 'official')];
    }, '');
}

function render(slice) {
  var c = slice.county, a = c.agg, s = c.score, iv = c.interval;
  var html = '';

  /* ---- header ---- */
  html += '<div class="title-row"><h2>' + esc(c.county) + ', ' + esc(c.state_name || c.state_abbr) + '</h2>' +
    '<span class="flag ' + (a.has_enacted_restrictive === '1' ? 'on' : 'off') + '">' +
    (a.has_enacted_restrictive === '1' ? 'Enacted restrictive policy on record' : 'No enacted restriction on record') +
    '</span></div>';
  html += '<div class="sub">FIPS ' + esc(c.fips) + ' &middot; ' + fmt_num(a.land_sqmi, 0) +
    ' sq mi of land &middot; ' + fmt_int(a.existing_dc_count) + ' data center records in the atlas</div>';

  /* ---- what the restriction actually is ---- */
  if (slice.restrictions.length) {
    html += '<section><h3>Enacted restriction record' + count_label(slice.restrictions.length) + '</h3>' +
      '<div class="sub">The instrument on file for this county, from the external restriction ' +
      'census. "Status" is the census reading at the date shown, not necessarily today.</div>' +
      table(['Instrument', 'Status', 'Date enacted', 'Source'],
        slice.restrictions, function (r) {
          return [esc(r.instrument), '<span class="flag on">' + esc(r.census_status) + '</span>',
                  '<span class="nowrap">' + fmt_date(r.date_enacted) + '</span>',
                  link(r.source)];
        }, '') + '</section>';
  } else if (a.has_enacted_restrictive === '1') {
    html += '<section><h3>Enacted restriction record</h3><div class="empty">The county aggregate ' +
      'flags an enacted restrictive action, but no instrument is filed in the external restriction ' +
      'census. The flag is derived from tracker events; the census is the hand-verified layer and ' +
      'covers 94 counties, so absence here is a coverage gap and not a contradiction.</div></section>';
  }

  /* ---- predictive ---- */
  html += '<section><h3>Model outlook</h3>';
  if (s) {
    var pct = c.national_pct;
    var lo = iv ? num(iv.va_p_lower) : null, hi = iv ? num(iv.va_p_upper) : null;
    var bar = '';
    if (lo !== null && hi !== null) {
      bar = '<div class="bar"><u style="left:' + (lo * 100).toFixed(1) + '%;width:' +
        ((hi - lo) * 100).toFixed(1) + '%"></u><i style="left:' +
        (num(s.calibrated_score) * 100).toFixed(1) + '%;width:2px"></i></div>';
    }
    html += '<div class="kpis">' +
      '<div class="kpi hero"><b>' + fmt_prob(s.calibrated_score) + '</b>' +
        (lo !== null ? '<em>interval ' + fmt_prob(lo, 0) + '\u2013' + fmt_prob(hi, 0) + '</em>' : '') +
        '<span>Calibrated restriction score</span>' + bar + '</div>' +
      kpi('National percentile', pct === undefined ? '\u2014' : Math.round(pct) + 'th',
          c.national_rank ? 'rank ' + c.national_rank.toLocaleString() + ' of ' + c.national_n.toLocaleString() : '') +
      kpi('Score decile', s.score_decile ? ordinal(Number(s.score_decile)) : '\u2014', '1 = lowest, 10 = highest') +
      kpi('Rank within ' + esc(c.state_abbr), c.state_rank ? c.state_rank.toLocaleString() : '\u2014',
          c.state_n ? 'of ' + c.state_n.toLocaleString() + ' counties' : '') +
      kpi('Raw out-of-fold score', fmt_prob(s.raw_oof_score), 'before recalibration') +
      kpi('Interval width', iv ? fmt_prob(iv.va_width) : '\u2014',
          iv ? '90% set: ' + esc(iv.set_90 || '\u2014') : '') +
      '</div>';
    html += '<div class="sub" style="margin-top:9px">A resemblance score, not a forecast: how much this ' +
      'county looks like counties that have enacted a restriction. Quote the interval, never the point ' +
      'alone. A wide interval is the model saying the evidence is thin for this profile.</div>';

    /* Neighbour contagion: only counties on the adjacency scan queue carry it. */
    var g = slice.contagion;
    if (g) {
      html += '<div class="kpis" style="margin-top:12px">' +
        kpi('Neighbours with an enacted restriction', fmt_int(g.enacted_neighbors),
            g.enacted_neighbor_fips ? 'FIPS ' + esc(g.enacted_neighbor_fips) : '') +
        kpi('Nearest enacted county', esc(g.nearest_seed_county || '\u2014'),
            g.nearest_seed_state ? esc(g.nearest_seed_state) +
              (yn(g.cross_state_seed) === 'Yes' ? ' \u00b7 across a state line' : '') : '') +
        kpi('Days since that action', fmt_int(g.days_since_nearest_seed),
            g.nearest_seed_date ? 'enacted ' + fmt_date(g.nearest_seed_date) : '') +
        kpi('Scan priority', esc(g.priority || '\u2014'), esc(g.priority_reason || '')) +
        kpi('Evidence status', esc(g.evidence_status || '\u2014'),
            g.meeting_source ? 'meeting source: ' + esc(g.meeting_source) : '') +
        '</div>' +
        '<div class="sub" style="margin-top:9px">This county sits on the adjacency scan queue: a ' +
        'neighbour has already acted, which is why it is being watched. Proximity is a monitoring ' +
        'trigger, not evidence that this county will follow.</div>';
    }
  } else {
    html += '<div class="empty">This county is outside the model frame, so it carries no score. ' +
      'Puerto Rico and counties with incomplete census features are excluded.</div>';
  }
  html += '</section>';

  /* ---- project risk screen ---- */
  if (slice.site_screen.length || !DETAIL_READY) {
    html += '<section><h3>Project risk screen' + count_label(slice.site_screen.length) + '</h3>' +
      table(['Project', 'Tier', 'Composite', 'Local activity %ile', 'Local enacted %ile',
             'County model %ile', 'State activity %ile', 'Org capacity %ile', 'Events within 50 mi'],
        slice.site_screen, function (r) {
          return [esc(r.name), esc(r.tier), fmt_num(r.composite, 1), fmt_num(r.pct_local_activity, 1),
                  fmt_num(r.pct_local_enacted, 1), fmt_num(r.pct_county_model, 1),
                  fmt_num(r.pct_state_activity, 1), fmt_num(r.pct_org_capacity, 1),
                  fmt_int(r.events_within_50mi)];
        }, 'No screened projects in this county.') + '</section>';
  }

  /* ---- demographics ---- */
  html += '<section><h3>Demographics and politics</h3><div class="kpis">' +
    kpi('Population', fmt_int(a.population), 'ACS') +
    kpi('Population density', fmt_num(a.pop_density_sqmi, 1), 'per sq mi') +
    kpi('Median household income', fmt_money(a.median_hh_income)) +
    kpi("Bachelor's degree or higher", fmt_pct(a.pct_bachelors_plus)) +
    kpi('2024 presidential margin', fmt_margin(a.margin_2024)) +
    kpi('2016 presidential margin', fmt_margin(a.margin_2016)) +
    kpi('Land area', fmt_num(a.land_sqmi, 1), 'sq mi') +
    '</div></section>';

  /* ---- opposition and policy activity ---- */
  html += '<section><h3>Opposition and policy activity</h3><div class="kpis">' +
    kpi('Opposition events', fmt_int(a.n_opposition_events)) +
    kpi('Moratorium events', fmt_int(a.n_moratorium_events)) +
    kpi('Zoning events', fmt_int(a.n_zoning_events)) +
    kpi('Ban events', fmt_int(a.n_ban_events)) +
    kpi('Legislation events', fmt_int(a.n_legislation_events)) +
    kpi('Lawsuit events', fmt_int(a.n_lawsuit_events)) +
    kpi('Enacted restrictive actions', fmt_int(a.n_enacted_restrictive)) +
    kpi('Statewide legislation events', fmt_int(a.state_legislation_events), 'all of ' + esc(c.state_abbr)) +
    '</div></section>';

  /* ---- project outcomes ---- */
  html += '<section><h3>Project outcomes</h3><div class="kpis">' +
    kpi('Projects tracked', fmt_int(a.n_projects_tracked)) +
    kpi('Projects opposed', fmt_int(a.n_projects_opposed)) +
    kpi('Decided', fmt_int(a.n_decided)) +
    kpi('Blocked (confirmed)', fmt_int(a.n_blocked_confirmed)) +
    kpi('Advanced (confirmed)', fmt_int(a.n_advanced_confirmed)) +
    kpi('Restricted or conditional', fmt_int(a.n_restricted_conditional)) +
    kpi('Median days to decision', fmt_int(a.median_days_to_decision)) +
    '</div></section>';

  /* ---- tracked project lifecycles ---- */
  html += '<section><h3>Tracked project lifecycles' + count_label(slice.lifecycles.length) + '</h3>' +
    '<div class="sub">"Modeled block" is the out-of-fold probability from the opposed-project ' +
    'outcome model, available only for projects in its training frame. It is a predictive ' +
    'association, not a causal statement about opposition.</div>' +
    table(['Project', 'Phase', 'Outcome', 'Modeled block', 'Announced', 'Decision', 'Days', 'MW',
           'Acres', 'Opp. events', 'Lawsuit', 'Decision evidence', 'Source'],
      slice.lifecycles, function (r) {
        var p = slice.pred_by_pid[r.project_id];
        var d = slice.decision_by_pid[r.project_id];
        return ['<span class="clip">' + esc(r.project_name) + '</span>', esc(r.phase),
                esc(r.lifecycle_outcome),
                p ? fmt_prob(p.oof_pred_blocked) : '\u2014',
                '<span class="nowrap">' + fmt_date(r.announced_date) + '</span>',
                '<span class="nowrap">' + fmt_date(r.decision_date) + '</span>',
                fmt_int(r.days_announced_to_decision), fmt_num(r.capacity_mw, 0),
                fmt_int(r.size_acres), fmt_int(r.n_opposition_events), yn(r.has_lawsuit),
                d ? '<span class="clip" title="' + esc(d.decision_date_source) + '">' +
                    esc(d.decision_date_source) + '</span> ' + link(d.source_url, 'cite') : '\u2014',
                link(r.source_url)];
      }, 'No tracked lifecycles in this county.') + '</section>';

  /* ---- risk trend over reruns ---- */
  html += '<section><h3>Risk-screen trend' + count_label(slice.trend.length) + '</h3>' +
      '<div class="sub">Composite score at the first and most recent screen run, per project. ' +
      'Movement reflects both new evidence and model reruns.</div>' +
      table(['Project', 'Current tier', 'First run', 'First composite', 'Latest run',
             'Latest composite', 'Change', 'Runs'],
        slice.trend, function (r) {
          var cls = r.delta === null ? '' : (r.delta > 0 ? 'up' : (r.delta < 0 ? 'down' : ''));
          var arrow = r.delta === null ? '\u2014'
            : (r.delta > 0 ? '\u25b2 +' : (r.delta < 0 ? '\u25bc ' : '')) + r.delta.toFixed(1);
          return ['<span class="clip">' + esc(r.name) + '</span>', esc(r.tier),
                  '<span class="nowrap">' + fmt_date(r.first_run) + '</span>',
                  fmt_num(r.first_composite, 1),
                  '<span class="nowrap">' + fmt_date(r.last_run) + '</span>',
                  fmt_num(r.last_composite, 1),
                  '<span class="delta ' + cls + '">' + arrow + '</span>', fmt_int(r.runs)];
        }, 'No screen history for this county.') + '</section>';

  /* ---- full project universe ---- */
  html += '<section><h3>Full project universe' + count_label(slice.universe.length) + '</h3>' +
    '<div class="sub">Every project and facility in the baseline universe for this county, ' +
    'including those with no tracked opposition. The opposition tables above are a ' +
    'selection-biased subset of this frame by construction.</div>' +
    table(['Name', 'Operator', 'Source', 'MW', 'Sq ft', 'Opposed', 'Outcome', 'Decided',
           'Opp. events', 'Announced', 'Decision', 'Last update', 'Excluded because'],
      slice.universe, function (r) {
        return ['<span class="clip">' + esc(r.name) + '</span>',
                '<span class="clip">' + esc(r.operator) + '</span>', esc(r.source),
                fmt_num(r.capacity_mw, 0), fmt_int(r.sqft), yn(r.opposed_flag),
                esc(r.lifecycle_outcome), yn(r.decided), fmt_int(r.n_opposition_events),
                '<span class="nowrap">' + fmt_date(r.announced_date) + '</span>',
                '<span class="nowrap">' + fmt_date(r.decision_date) + '</span>',
                '<span class="nowrap">' + fmt_date(r.last_status_update) + '</span>',
                '<span class="clip">' + esc(r.exclusion_reason) + '</span>'];
      }, 'No baseline universe records for this county.') + '</section>';

  /* ---- opposition groups ---- */
  html += '<section><h3>Opposition groups active here' + count_label(slice.groups.length) + '</h3>' +
    '<div class="sub">Groups named on this county\'s own events, joined to the national registry. ' +
    '"Blocked share" is that group\'s confirmed blocks over its decided incidents nationally, so ' +
    'it describes a track record, not an effect.</div>' +
    table(['Group', 'Events here', 'National incidents', 'States active', 'First seen',
           'Last seen', 'Decided', 'Confirmed blocks', 'Blocked share'],
      slice.groups, function (r) {
        var g = r.row;
        return ['<span class="clip">' + esc(g.canonical_name) + '</span>' +
                  (r.client_safe ? '' : ' <span class="flag warn" title="Registry audit flagged ' +
                    'this entry; verify before naming it in a client deliverable">verify</span>'),
                fmt_int(r.local_events), fmt_int(g.n_incidents),
                '<span class="clip">' + esc(g.states) + '</span>',
                '<span class="nowrap">' + fmt_date(g.first_seen) + '</span>',
                '<span class="nowrap">' + fmt_date(g.last_seen) + '</span>',
                fmt_int(g.decided), fmt_int(g.confirmed_blocks),
                g.blocked_share === '' ? '\u2014' : fmt_prob(g.blocked_share)];
      }, 'No registry-matched opposition groups named in this county.') + '</section>';

  /* ---- proposals ---- */
  html += '<section><h3>Proposals and developments' + count_label(slice.proposals.length) + '</h3>' +
    table(['Name', 'Type', 'Phase', 'Status', 'Towns', 'MW', 'Acres', 'Companies', 'Jobs',
           'Date', 'Info'],
      slice.proposals, function (r) {
        return ['<span class="clip">' + esc(r.name) + '</span>', esc(r.type), esc(r.phase),
                esc(r.status), '<span class="clip">' + esc(r.towns) + '</span>',
                fmt_num(r.capacity_mw, 0), fmt_int(r.size_acres),
                '<span class="clip">' + esc(r.companies) + '</span>', fmt_int(r.jobsTotal),
                '<span class="nowrap">' + fmt_date(r.date) + '</span>', link(r.info)];
      }, 'No proposals recorded in this county.') + '</section>';

  /* ---- facilities ---- */
  html += '<section><h3>Facility registry' + count_label(slice.facilities.length) + '</h3>' +
    table(['Facility', 'Operator', 'Status', 'MW', 'Sq ft', 'First seen', 'Last seen', 'Evidence'],
      slice.facilities, function (r) {
        return ['<span class="clip">' + esc(r.name) + '</span>', esc(r.operator), esc(r.status),
                fmt_num(r.capacity_mw, 0), fmt_int(r.sqft),
                '<span class="nowrap">' + fmt_date(r.first_seen) + '</span>',
                '<span class="nowrap">' + fmt_date(r.last_seen) + '</span>', link(r.evidence_url)];
      }, 'No registry facilities in this county.') + '</section>';

  /* ---- opposition events ---- */
  html += '<section><h3>Opposition events' + count_label(slice.opposition.length) +
    '</h3><div class="sub">Display is a curated subset of columns. The CSV export carries every ' +
    'column in master_opposition_clean.csv for these rows.</div>' +
    table(['Date', 'City', 'Entity', 'Type', 'Severity', 'Status', 'Outcome', 'Company',
           'Project', 'MW', 'Summary', 'Source'],
      slice.opposition, function (r) {
        return ['<span class="nowrap">' + fmt_date(r.Date) + '</span>', esc(r.City),
                '<span class="clip">' + esc(r.Entity) + '</span>', esc(r['Opposition Type']),
                esc(r.Severity), esc(r.status_clean || r.Status),
                esc(r['Community Outcome']), '<span class="clip">' + esc(r.Company) + '</span>',
                '<span class="clip">' + esc(r['Project Name']) + '</span>', fmt_num(r.mw_numeric, 0),
                '<span class="clip">' + esc(r.Summary) + '</span>', link(r['Source URL'])];
      }, 'No opposition events recorded in this county.') + '</section>';

  /* ---- meetings ---- */
  html += '<section><h3>Local meeting feed' + count_label(slice.meetings.length) + '</h3>' +
    table(['Jurisdiction', 'Body', 'When', 'Item', 'Status', 'Platform', 'Document'],
      slice.meetings, function (r) {
        return [esc(r.jurisdiction), esc(r.body),
                '<span class="nowrap">' + esc(String(r.meeting_datetime || '').slice(0, 16)) + '</span>',
                '<span class="clip">' + esc(r.item_title) + '</span>', esc(r.item_status),
                esc(r.platform), link(r.document_url)];
      }, 'No monitored meetings for this county.') + '</section>';

  /* ---- neighbors ---- */
  html += '<section><h3>Neighboring counties' + count_label(slice.neighbors.length) + '</h3>' +
    table(['County', 'Score', 'Decile', 'Enacted', 'Opp. events', 'DC records', 'Population'],
      slice.neighbors, function (r) {
        return ['<span class="link-county" data-fips="' + esc(r.fips) + '">' + esc(r.label) + '</span>',
                r.score ? fmt_prob(r.score.calibrated_score) : '\u2014',
                r.score && r.score.score_decile ? esc(r.score.score_decile) : '\u2014',
                yn(r.agg.has_enacted_restrictive), fmt_int(r.agg.n_opposition_events),
                fmt_int(r.agg.existing_dc_count), fmt_int(r.agg.population)];
      }, 'No adjacency records for this county.') + '</section>';

  /* ---- state legislation ---- */
  html += '<section><h3>State legislation in ' + esc(c.state_abbr) +
    count_label(slice.bills.length) + '</h3>' +
    '<div class="sub">Statewide, not county-specific: these bills set the ceiling a local ' +
    'decision operates under. "Stage" is the furthest point reached; follow the OpenStates ' +
    'link for roll calls and full text.</div>' +
    table(['Bill', 'Session', 'Title', 'Stage', 'Stage date', 'Latest action', 'Evidence',
           'Linked incident', 'OpenStates'],
      slice.bills, function (r) {
        return ['<span class="nowrap">' + esc(r.identifier) + '</span>', esc(r.session),
                '<span class="clip">' + esc(r.title) + '</span>',
                r.stage ? '<span class="flag on">' + esc(r.stage) + '</span>' : '\u2014',
                '<span class="nowrap">' + fmt_date(r.stage_date) + '</span>',
                '<span class="nowrap">' + fmt_date(r.latest_action_date) + '</span>',
                '<span class="clip">' + esc(r.stage_evidence) + '</span>',
                '<span class="clip">' + esc(r.incident) + '</span>',
                link(r.openstates_url, 'bill')];
      }, 'No matched state bills for this state.') + '</section>';

  /* ---- stakeholders ---- */
  var sh_all = slice.stakeholders_county.concat(slice.stakeholders_state);
  var sh_man = (META.stakeholder_manifest || {});
  html += '<section><h3>Stakeholders' + count_label(sh_all.length) + '</h3>' +
    '<div class="sub">The offices that decide siting, zoning, permitting and utility ' +
    'questions here, plus the state offices above them. Every row carries the official ' +
    'page it was read from. Names are published only after passing a validation gate, so ' +
    'an office with no confirmed current holder is left out rather than guessed \u2014 ' +
    'a term that has already ended withholds the row.</div>';
  if (!slice.stakeholders_county.length && DETAIL_READY) {
    html += '<div class="empty">No county-level stakeholder record for this county yet. ' +
      'The county tier is a seeded source of record built jurisdiction by jurisdiction ' +
      'from official government pages, because no national register of county board ' +
      'chairs, county administrators and mayors exists to pull from. It currently covers ' +
      (sh_man.counties_covered !== undefined
        ? fmt_int(sh_man.counties_covered) + ' of the 789 counties with tracked activity'
        : 'a subset of counties') +
      '. The state offices below apply regardless.</div>';
  }
  html += stakeholder_rows(sh_all);
  if (sh_all.length) {
    html += '<div class="sub trailing">Contact details are the official office listings published ' +
      'by the jurisdiction, not personal contact information. A "Role in siting" entry ' +
      'appears only where a cited source states that formal role; it is never inferred ' +
      'from the office title. Full office addresses are included in the CSV export.</div>';
  }
  html += '</section>';

  /* ---- coverage and known gaps ---- */
  html += '<section><h3>Coverage and known gaps</h3>';
  if (slice.coverage.length) {
    html += table(['Gap class', 'Join status', 'Label check', 'Census status', 'Tracker mechanism',
                   'Tracker outcome', 'Model label', 'Census source'],
      slice.coverage, function (r) {
        return [esc(r.gap_class), esc(r.join_status),
                r.label_check && r.label_check !== 'ok'
                  ? '<span class="flag warn">' + esc(r.label_check) + '</span>'
                  : esc(r.label_check || '\u2014'),
                esc(r.census_status), esc(r.tracker_mechanism), esc(r.tracker_outcome),
                esc(r.model_label), link(r.census_source)];
      }, '');
  } else {
    html += '<div class="empty">No reconciliation record for this county, which means it is ' +
      'outside the 92-county sample where the hand census and the tracker were compared ' +
      'head to head.</div>';
  }
  html += '<div class="sub" style="margin-top:11px">Standing limits on every county page: there ' +
    'is no usable litigation layer in this repository, so "Lawsuit" reflects tracker-coded ' +
    'events only. Event severity is recorded at two levels, so treat it as present/elevated ' +
    'rather than a graded intensity. Opposition-event counts are media-detected and ' +
    'under-count quiet counties; use the full project universe above as the denominator, ' +
    'never the opposition tables.</div></section>';

  /* ---- internal-only cost layer ---- */
  if (SHOW_INTERNAL) {
    html += '<section class="internal"><h3>Observed cost accounting' +
      count_label(slice.cost.length) + ' &mdash; internal only</h3>' +
      '<div class="internal-note"><b>Not for client delivery.</b> These are observed-history ' +
      'arithmetic against documented anchors, not estimates of what opposition caused. No ' +
      'matched-control delay estimate exists for this population, and the identifiability ' +
      'review concluded none is recoverable from the available data, so nothing here ' +
      'supports a counterfactual claim. Rows without capacity are withheld rather than ' +
      'imputed, and deferred revenue is exposure, not loss.</div>' +
      table(['Project', 'Outcome', 'Delay days', 'Date precision', 'MW',
             'Escalation low', 'Escalation high', 'Deferred exposure low',
             'Deferred exposure high', 'Sunk cost low', 'Sunk cost high', 'Note'],
        slice.cost, function (r) {
          return ['<span class="clip">' + esc(r.project_name) + '</span>', esc(r.lifecycle_outcome),
                  fmt_int(r.delay_days), esc(r.announced_precision), fmt_num(r.capacity_mw, 0),
                  fmt_money(r.escalation_cost_low), fmt_money(r.escalation_cost_high),
                  fmt_money(r.deferred_revenue_exposure_low), fmt_money(r.deferred_revenue_exposure_high),
                  fmt_money(r.block_sunk_cost_low), fmt_money(r.block_sunk_cost_high),
                  '<span class="clip">' + esc(r.note) + '</span>'];
        }, 'No cost translation rows for this county.');
    if ((DATA.cost_anchors || []).length) {
      html += '<div style="margin-top:11px">' +
        table(['Anchor', 'Description', 'Low', 'High', 'Unit', 'Confidence', 'Source date', 'Source'],
          DATA.cost_anchors, function (r) {
            return [esc(r.anchor_id), '<span class="clip">' + esc(r.description) + '</span>',
                    fmt_num(r.value_low, 2), fmt_num(r.value_high, 2), esc(r.unit),
                    esc(r.confidence), '<span class="nowrap">' + fmt_date(r.source_date) + '</span>',
                    link(r.source)];
          }, '') + '</div>';
    }
    html += '</section>';
  }

  html += methodology_panel();
  html += glossary_panel();

  html += '<footer>Hawthorn Intelligence &middot; data-center-map. Sources: ' +
    Object.keys(CORE_FILES).concat(Object.keys(DETAIL_FILES)).map(function (k) {
      return (CORE_FILES[k] || DETAIL_FILES[k]).split('/').pop();
    }).join(', ') + '. ' +
    'Files regenerate with the CI pipeline; if a section is empty and you expect rows, ' +
    'the last run may have failed its QC gate.<br>Rendered ' +
    new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC.</footer>';

  document.getElementById('body').innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll('.link-county'), function (el) {
    el.addEventListener('click', function () { select_county(el.getAttribute('data-fips')); });
  });
}

/* --------------------- methodology and glossary -------------------- */

function methodology_panel() {
  var pm = META.policy_metrics, om = META.outcome_metrics, sm = META.survival_metrics,
      mf = META.aggregate_manifest;
  var h = '<details><summary>Methodology, model cards and data freshness</summary>';

  if (mf) {
    h += '<dl class="dl">' +
      '<dt>County frame built</dt><dd>' + fmt_date(mf.generated) + '</dd>' +
      '<dt>Counties in frame</dt><dd>' + fmt_int(mf.counties) + '</dd>' +
      '<dt>Events matched to a county</dt><dd>' + fmt_int(mf.event_rows_with_county) +
        ' (' + fmt_prob(mf.event_match_rate) + ' of event rows)</dd>' +
      '<dt>Counties with an enacted restriction</dt><dd>' + fmt_int(mf.enacted_restriction_counties) + '</dd>' +
      '<dt>Counties with a data center on record</dt><dd>' + fmt_int(mf.dc_presence_counties) + '</dd>' +
      '</dl>';
  }

  if (pm) {
    var sel = (pm.specification_selection || {}).selected || {};
    h += '<h4>Restriction resemblance score</h4>' +
      '<dl class="dl">' +
      '<dt>Training counties</dt><dd>' + fmt_int(pm.n) + ' (' + fmt_int(pm.n_positive) +
        ' with an enacted restriction, base rate ' + fmt_prob(pm.base_rate) + ')</dd>' +
      '<dt>Cross-validation</dt><dd>' + fmt_int((pm.cv || {}).folds) + '-fold \u00d7 ' +
        fmt_int((pm.cv || {}).repeats) + ' repeats</dd>' +
      '<dt>Selected specification</dt><dd>' + esc(sel.spec) + ', L2 C = ' + esc(sel.C) + '</dd>' +
      '<dt>Variables</dt><dd>' + esc((sel.variables || []).join(', ')) + '</dd>' +
      '<dt>Specification registered</dt><dd>' + fmt_date((pm.specification_selection || {}).registered) +
        ((pm.specification_selection || {}).changed_this_run ? ' &middot; changed on the last run' :
         ' &middot; unchanged on the last run') + '</dd>' +
      '<dt>Sign-stability cost</dt><dd>' + fmt_num((pm.specification_selection || {}).stability_cost, 4) +
        ' median AUC given up to hold every coefficient\'s sign across folds</dd>' +
      '</dl>' +
      '<div class="sub">Fitted on the cross-section of counties that have and have not acted. ' +
      'It measures resemblance to counties that already restricted; it is not a forecast of ' +
      'this county\'s next vote, and no variable in it should be read as a cause.</div>';
  }

  if (om) {
    h += '<h4>Opposed-project outcome model</h4>' +
      '<dl class="dl">' +
      '<dt>Training projects</dt><dd>' + fmt_int(om.n) + ' (' + fmt_int(om.n_blocked) +
        ' blocked, base rate ' + fmt_prob(om.base_rate) + ')</dd>' +
      '<dt>ROC AUC</dt><dd>' + fmt_num(om.roc_auc.p50, 3) + ' median (' +
        fmt_num(om.roc_auc.p10, 3) + '\u2013' + fmt_num(om.roc_auc.p90, 3) + ' across repeats)</dd>' +
      '<dt>Brier score</dt><dd>' + fmt_num(om.brier.p50, 3) + ' median, against ' +
        fmt_num(om.brier.base_rate_brier, 3) + ' for predicting the base rate</dd>' +
      '<dt>Most informative features</dt><dd>' +
        esc((om.top_features || []).slice(0, 5).map(function (f) {
          return f.name + ' (AUC drop ' + f.auc_drop + ')';
        }).join('; ')) + '</dd>' +
      '</dl>' +
      '<div class="sub">Trained only on projects that already drew opposition, so its ' +
      'probabilities are conditional on that. Sample is small and the AUC spread is wide: ' +
      'read a single project\'s number as a rank, not a rate. Feature importance here is ' +
      'predictive signal, never a causal effect.</div>';
  }

  if (sm) {
    h += '<h4>Time-to-decision benchmark</h4>' +
      '<dl class="dl">' +
      '<dt>Projects</dt><dd>' + fmt_int(sm.n) + ' (' + fmt_int(sm.n_events) +
        ' reached a decision, ' + fmt_int(sm.n_censored) + ' still open)</dd>' +
      '<dt>Median time to decision</dt><dd>' + fmt_int(sm.km_median_days_all) +
        ' days (Kaplan-Meier)</dd>' +
      '<dt>Log-rank p</dt><dd>' + fmt_num(sm.logrank_p, 4) + '</dd>' +
      '<dt>Excluded for year-only dates</dt><dd>' + fmt_int(sm.excluded_year_precision) + '</dd>' +
      '</dl>' +
      '<div class="sub">A descriptive benchmark of observed timelines. It does not estimate ' +
      'how much longer a project took than it otherwise would have; that quantity is not ' +
      'identifiable from this data and is not published anywhere in this system.</div>';
  }

  if ((DATA.calibration || []).length) {
    var cal = DATA.calibration.slice(-8).reverse();
    h += '<h4>Calibration history</h4>' +
      table(['Run', 'Model', 'n', 'Base rate', 'Brier', 'Baseline Brier', 'Skill', 'ECE', 'Verdict'],
        cal, function (r) {
          return ['<span class="nowrap">' + fmt_date(r.timestamp) + '</span>', esc(r.model),
                  fmt_int(r.n), fmt_prob(r.base_rate), fmt_num(r.brier, 4),
                  fmt_num(r.brier_baseline, 4), fmt_num(r.brier_skill_score, 4),
                  fmt_num(r.ece, 4),
                  '<span class="flag ' + (r.verdict === 'PROMOTE' ? 'on' : 'warn') + '">' +
                    esc(r.verdict) + '</span>'];
        }, '') +
      '<div class="sub" style="margin-top:9px">Scores only reach this page on a PROMOTE ' +
      'verdict. A HOLD run keeps the previous published scores in place.</div>';
  }

  var shm = META.stakeholder_manifest;
  if (shm) {
    h += '<h4>Stakeholder layer</h4>' +
      '<dl class="dl">' +
      '<dt>published rows</dt><dd>' + fmt_int(shm.published_rows) + ' (' +
        fmt_int(shm.county_rows) + ' county, ' + fmt_int(shm.state_rows) + ' state)</dd>' +
      '<dt>counties covered</dt><dd>' + fmt_int(shm.counties_covered) + '</dd>' +
      '<dt>states covered</dt><dd>' +
        fmt_int((shm.states_covered || []).length) + '</dd>' +
      '<dt>withheld by the gate</dt><dd>' + fmt_int(shm.withheld_rows) + '</dd>' +
      '<dt>published with a warning</dt><dd>' + fmt_int(shm.warned_rows) + '</dd>' +
      '<dt>contact coverage</dt><dd>' + fmt_int(shm.with_email) + ' email, ' +
        fmt_int(shm.with_phone) + ' phone</dd>' +
      '<dt>sourced siting role</dt><dd>' + fmt_int(shm.with_relevance) + '</dd>' +
      '<dt>state tier refreshed</dt><dd>' + yn(shm.state_tier_refreshed ? '1' : '0') + '</dd>' +
      '<dt>generated</dt><dd>' + esc(shm.generated || '\u2014') + '</dd>' +
      '</dl>' +
      '<div class="sub" style="margin-top:9px">Two tiers. The state tier is queried from ' +
      'OpenStates on a schedule. The county tier is a seeded source of record assembled from ' +
      'official government pages, because no national register of county board chairs, ' +
      'administrators and mayors exists; the pipeline validates and republishes it but never ' +
      'invents or edits a county row. A withheld row failed identity validation \u2014 most ' +
      'often a term that has already ended, which is the way this layer goes stale. ' +
      'A warned row is published with one unusable contact field blanked.</div>';
  }

  h += '<h4>Standing interpretation rules</h4><div class="sub">Nothing on this page is a ' +
    'causal estimate. Figures describe associations and observed histories. No dollar amount ' +
    'or delay shown anywhere in this system is attributable to opposition, and none should be ' +
    'presented that way. Confirmed outcomes require finality evidence beyond a label: a bill ' +
    'stage or a terminal status, never an outcome label on its own.</div>';

  return h + '</details>';
}

function glossary_panel() {
  if (!META.codebook) return '';
  return '<details><summary>Field glossary (CODEBOOK.md)</summary>' +
    '<pre>' + esc(META.codebook) + '</pre></details>';
}

/* ------------------------------ export ---------------------------- */

/* One tidy long-format file: section, record_id, field, value. Every scalar
 * and every row of every table for this county lands in it, including the
 * opposition columns that the tables do not show. Long format is the only
 * shape that survives the schema differences between these files. */
function csv_cell(v) {
  var s = String(v === null || v === undefined ? '' : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function export_csv() {
  if (!CURRENT) return;
  var slice = county_slice(CURRENT), c = slice.county;
  var lines = [['section', 'record_id', 'field', 'value'].join(',')];

  function push(section, id, field, value) {
    lines.push([csv_cell(section), csv_cell(id), csv_cell(field), csv_cell(value)].join(','));
  }
  function push_row(section, id, obj) {
    Object.keys(obj).forEach(function (k) { push(section, id, k, obj[k]); });
  }

  push('identity', c.fips, 'fips', c.fips);
  push('identity', c.fips, 'county_name', c.county);
  push('identity', c.fips, 'state_abbr', c.state_abbr);
  push('identity', c.fips, 'state_name', c.state_name);
  push('identity', c.fips, 'exported_utc', new Date().toISOString());

  push_row('county_aggregate', c.fips, c.agg);
  if (c.score) push_row('policy_score', c.fips, c.score);
  if (c.interval) push_row('policy_interval', c.fips, c.interval);
  if (c.national_pct !== undefined) {
    push('derived_rank', c.fips, 'national_percentile', c.national_pct.toFixed(2));
    push('derived_rank', c.fips, 'national_rank', c.national_rank);
    push('derived_rank', c.fips, 'national_counties_scored', c.national_n);
  }
  if (c.state_rank) {
    push('derived_rank', c.fips, 'state_rank', c.state_rank);
    push('derived_rank', c.fips, 'state_counties_scored', c.state_n);
  }

  slice.site_screen.forEach(function (r) { push_row('site_screen', r.project_id, r); });
  slice.lifecycles.forEach(function (r) { push_row('project_lifecycle', r.project_id, r); });
  slice.proposals.forEach(function (r) { push_row('proposal', r.id, r); });
  slice.facilities.forEach(function (r) { push_row('facility', r.facility_id, r); });
  slice.opposition.forEach(function (r, i) {
    push_row('opposition_event', r.Incident || (r.project_id || 'row') + '_' + (i + 1), r);
  });
  slice.meetings.forEach(function (r, i) {
    push_row('local_meeting', (r.jurisdiction || 'meeting') + '_' + (i + 1), r);
  });
  slice.neighbors.forEach(function (n) {
    push_row('neighbor_county', n.fips, n.agg);
    if (n.score) push_row('neighbor_policy_score', n.fips, n.score);
  });

  slice.restrictions.forEach(function (r, i) {
    push_row('enacted_restriction', (r.instrument || 'instrument') + '_' + (i + 1), r);
  });
  slice.coverage.forEach(function (r, i) { push_row('coverage_gap', c.fips + '_' + (i + 1), r); });
  slice.universe.forEach(function (r) { push_row('baseline_universe', r.universe_id, r); });
  slice.bills.forEach(function (r, i) {
    push_row('state_bill', (r.identifier || 'bill') + '_' + (i + 1), r);
  });
  slice.groups.forEach(function (r) {
    push_row('opposition_group', r.row.canonical_id, r.row);
    push('opposition_group', r.row.canonical_id, 'events_in_this_county', r.local_events);
    push('opposition_group', r.row.canonical_id, 'client_safe', r.client_safe ? '1' : '0');
  });
  Object.keys(slice.pred_by_pid).forEach(function (pid) {
    push_row('outcome_prediction', pid, slice.pred_by_pid[pid]);
  });
  Object.keys(slice.decision_by_pid).forEach(function (pid) {
    push_row('decision_date_provenance', pid, slice.decision_by_pid[pid]);
  });
  slice.trend.forEach(function (r) { push_row('risk_screen_trend', r.project_id, r); });
  if (slice.contagion) push_row('adjacency_scan', c.fips, slice.contagion);

  slice.stakeholders_county.concat(slice.stakeholders_state).forEach(function (r) {
    push_row('stakeholder', r.stakeholder_id || (r.level + '_' + r.office_class), r);
  });

  /* Cost stays internal: it is only written when the operator has explicitly
   * turned the internal layers on, and the export says so on its own row. */
  push('export_scope', c.fips, 'internal_layers_included', SHOW_INTERNAL ? '1' : '0');
  if (SHOW_INTERNAL) {
    slice.cost.forEach(function (r) { push_row('cost_translation_internal', r.project_id, r); });
    (DATA.cost_anchors || []).forEach(function (r) {
      push_row('cost_anchor_internal', r.anchor_id, r);
    });
  }

  var blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'county-profile_' + slug(c.county) + '-' + (c.state_abbr || '').toLowerCase() +
    '_' + c.fips + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);

  var btn = document.getElementById('export');
  btn.textContent = 'Saved';
  setTimeout(function () { btn.textContent = 'Export CSV'; }, 1800);
}

/* ------------------------------ picker ---------------------------- */

function wire_picker() {
  var input = document.getElementById('search');
  var hits = document.getElementById('hits');
  var shown = [], cursor = -1;

  function close() { hits.classList.remove('open'); shown = []; cursor = -1; }

  function draw(q) {
    q = q.trim().toLowerCase();
    if (!q) { close(); return; }
    shown = COUNTIES.filter(function (c) { return c.label.toLowerCase().indexOf(q) !== -1; }).slice(0, 40);
    if (!shown.length) { close(); return; }
    cursor = 0;
    hits.innerHTML = shown.map(function (c, i) {
      return '<div data-i="' + i + '"' + (i === 0 ? ' class="sel"' : '') + '>' + esc(c.label) + '</div>';
    }).join('');
    hits.classList.add('open');
  }

  input.addEventListener('input', function () { draw(input.value); });
  input.addEventListener('focus', function () { input.select(); draw(input.value); });
  input.addEventListener('keydown', function (e) {
    if (!shown.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      cursor = (cursor + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % shown.length;
      Array.prototype.forEach.call(hits.children, function (el, i) {
        el.className = i === cursor ? 'sel' : '';
      });
      hits.children[cursor].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && cursor >= 0) {
      e.preventDefault();
      var pick = shown[cursor]; close(); select_county(pick.fips);
    } else if (e.key === 'Escape') { close(); }
  });
  hits.addEventListener('mousedown', function (e) {
    var t = e.target.closest('[data-i]');
    if (!t) return;
    e.preventDefault();
    var pick = shown[Number(t.getAttribute('data-i'))];
    close(); select_county(pick.fips);
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.picker')) close();
  });

  input.disabled = false;
  input.placeholder = 'Search ' + COUNTIES.length.toLocaleString() + ' counties\u2026';
}

function initial_fips() {
  var h = location.hash || '';
  var m = h.match(/fips=(\d{4,5})/);
  if (m) {
    var f = m[1].padStart(5, '0');
    if (BY_FIPS[f]) return f;
  }
  var q = new URLSearchParams(location.search).get('fips');
  if (q && BY_FIPS[q.padStart(5, '0')]) return q.padStart(5, '0');
  var slugged = h.match(/county=([a-z0-9-]+)-([a-z]{2})\b/);
  if (slugged) {
    var want = slugged[1], st = slugged[2].toUpperCase();
    var hit = COUNTIES.filter(function (c) {
      return c.state_abbr === st && slug(c.county) === want;
    })[0];
    if (hit) return hit.fips;
  }
  return null;
}

document.getElementById('export').addEventListener('click', export_csv);
document.getElementById('print').addEventListener('click', function () { window.print(); });
document.getElementById('internal').addEventListener('change', function () {
  SHOW_INTERNAL = this.checked;
  if (CURRENT) render(county_slice(CURRENT));
});
document.getElementById('permalink').addEventListener('click', function () {
  var btn = this;
  navigator.clipboard.writeText(location.href).then(function () {
    btn.textContent = 'Copied';
    setTimeout(function () { btn.textContent = 'Copy link'; }, 1600);
  }).catch(function () { btn.textContent = 'Copy blocked'; });
});
window.addEventListener('hashchange', function () {
  var f = initial_fips();
  if (f && f !== CURRENT) select_county(f, false);
});

load_core().then(function (missing) {
  if (missing.length) {
    banner('<b>Core data unavailable.</b> Could not reach ' + esc(missing.join(', ')) +
      ' from raw.githubusercontent.com. The files regenerate with the CI pipeline; if this ' +
      'persists, the last run may have failed its QC gate.');
    document.getElementById('body').innerHTML = '';
    return;
  }
  build_frame();
  wire_picker();
  document.getElementById('print').disabled = false;
  load_meta().then(function () { if (CURRENT) render(county_slice(CURRENT)); });
  var start = initial_fips();
  if (start) {
    select_county(start, false);
  } else {
    document.getElementById('body').innerHTML =
      '<div class="loading">Search for a county above to load its profile. ' +
      'Every descriptive field, model score, project, facility, opposition event, ' +
      'opposition group, state bill, neighboring county and model card comes down in one ' +
      'CSV from the Export button.</div>';
  }
  return load_detail().then(function (missing2) {
    if (missing2.length) {
      banner('<b>Some detail files were unreachable:</b> ' + esc(missing2.join(', ')) +
        '. The scorecards above are unaffected; the matching tables below will read as empty.');
    }
    if (CURRENT) render(county_slice(CURRENT));
  });
});
</script>
