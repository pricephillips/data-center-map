name: Local signals (alignment, meetings, disputes, execution risk)

# Writes proxy scores and evidence files for every state/county in
# master_opposition_clean.csv. No manual approval step: outputs are committed
# on each run and flow straight into the dashboard. Never touches
# master_opposition.csv. Safe to fail without holding up the map.

on:
  workflow_dispatch:
  schedule:
    # Mondays 07:40 UTC, after bill-sync (07:10) has refreshed the vote data
    # that political_alignment_proxy.py reads.
    - cron: "40 7 * * 1"

permissions:
  contents: write

concurrency:
  group: local-signals
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      # ref: the branch, not the triggering commit. A dispatch queued behind a
      # running job (concurrency group above) would otherwise check out the
      # commit it was dispatched at and rebase every generated file over the
      # earlier run's commit; on 2026-10-01 that conflict failed the commit
      # step and threw the run's output away.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Spec 007. civic-scraper feeds local_meeting_feed.py discovery (US1).
      # ocrmypdf and pdfminer.six feed agenda_text.py (US2), and
      # tesseract-ocr and ghostscript are OCRmyPDF's engines: FR-002 allows
      # OCR only in a workflow that installs both, and agenda_text.py's
      # selftest fails any workflow that runs it without them.
      - name: Install civic-scraper and the OCR stack (spec 007)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng ghostscript
          uv pip install --system -c requirements/ci.txt civic-scraper ocrmypdf pdfminer.six

      - name: Self-test every scoring module
        run: |
          python political_alignment_proxy.py --selftest
          python local_meeting_feed.py --selftest
          python agenda_text.py --selftest
          python dispute_watch.py --selftest
          python incentive_execution_risk_proxy.py --selftest
          python incentive_durability_proxy.py --selftest

      - name: Political alignment proxy (all states)
        run: python political_alignment_proxy.py --all --out data/political_alignment_proxy.md

      - name: Discover local meeting platforms
        # Incremental: configs/local_meeting_sources.json caches every county
        # already probed, so this only pays for counties added since last run.
        run: python local_meeting_feed.py --discover

      - name: Fetch local meeting items
        run: python local_meeting_feed.py --fetch

      # OCR text is cached by the PDF's SHA-256 in .cache/agenda_text, so a
      # document is read (and OCR'd) once. A fresh key per run saves the
      # grown cache; restore-keys picks up the newest earlier one. Restore and
      # save are separate steps so the cache is saved even when a later step
      # (the commit) fails: actions/cache saves only on job success, and a
      # failed commit on 2026-10-01 discarded that run's OCR work.
      - name: Restore agenda text cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/agenda_text
          key: agenda-text-${{ github.run_id }}
          restore-keys: agenda-text-

      - name: Agenda text and keyword pass (OCR for scanned PDFs)
        # Capped per run; later runs continue where this one stopped. A
        # per-document failure is recorded in the index, not raised.
        continue-on-error: true
        run: python agenda_text.py --run --max-docs 40 --max-mb 25

      - name: Save agenda text cache
        if: always() && hashFiles('.cache/agenda_text/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/agenda_text
          key: agenda-text-${{ github.run_id }}

      - name: Dispute watch (candidate dockets)
        # Unauthenticated CourtListener is capped at 125 requests/day, so a
        # dashboard-wide pass needs COURTLISTENER_API_TOKEN. The module stops
        # cleanly when throttled and never records a refused request as an
        # empty result, so a partial pass is safe. Non-blocking: these are
        # research leads and do not feed any score.
        continue-on-error: true
        env:
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
        run: python dispute_watch.py --all --out data/dispute_watch.csv

      - name: Incentive execution risk proxy (all counties)
        run: python incentive_execution_risk_proxy.py --all --out data/incentive_execution_risk_proxy.md

      - name: Incentive durability proxy (all states)
        # The interim score that stands in until
        # data/incentive_agreement_registry.csv can carry a real model. That
        # file has 0 rows, so the condition the module was written for is
        # fully in force; it had simply never been connected.
        run: python incentive_durability_proxy.py --all --out data/incentive_durability_proxy.md

      - name: Commit signal outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILES="data/political_alignment_proxy.md \
                  data/local_meeting_feed.csv \
                  data/agenda_text_index.csv \
                  data/dispute_watch.csv \
                  data/dispute_watch_cache.json \
                  data/incentive_execution_risk_proxy.md \
                  data/incentive_durability_proxy.md \
                  configs/local_meeting_sources.json"
          EXISTING=""
          for f in $FILES; do
            [ -f "$f" ] && EXISTING="$EXISTING $f"
          done
          if [ -z "$EXISTING" ]; then
            echo "No signal files were produced; nothing to commit."
            exit 0
          fi
          # shellcheck disable=SC2086 # EXISTING is a space-separated file list; splitting is intended
          git add $EXISTING
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Local signal proxies (alignment, meetings, incentive risk) [skip ci]"
          # Rebase, resolve generated-file conflicts, push. See the script header.
          bash scripts/git_push_retry.sh
