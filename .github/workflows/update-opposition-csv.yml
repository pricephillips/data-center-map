name: Update opposition CSV

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] same-repo workflow; the job checks out the default branch only and uses no artifacts from the triggering run
    workflows: ["Scrape TrackDataCenters proposals"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'

permissions:
  contents: write
  issues: write

jobs:
  build-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv pip install --system -c requirements/ci.txt requests

      - name: Run CSV build
        run: python scripts/build_master_csv.py

      - name: Self-test candidate promotion (BLOCKING)
        run: python promote_signal_candidates.py --selftest

      - name: Promote QC-passing candidates into master
        # 2026-08-12: the QC gate replaces manual review of the harvest
        # queue. Gate-passing candidates append to master_opposition.csv
        # (data_source=signal_harvest_auto, Status=pending, no outcome
        # asserted); blocked candidates stay in the queue as the exception
        # list. Every decision lands in data/signal_promotion_report.csv.
        run: python promote_signal_candidates.py

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master_opposition.csv
          # The harvest queue now holds only gate-blocked candidates (the
          # exception list); the promotion report is the append-only audit
          # trail of every promote/block/duplicate decision.
          # data/facility_candidates.csv is the Layer A intake: facility
          # openings, ground breakings and announcements the harvester already
          # saw and used to file into the opposition queue.
          git add data/signal_candidates.csv data/signal_harvest_log.csv \
                  data/signal_promotion_report.csv \
                  data/facility_candidates.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update master_opposition.csv + harvest queue"
          # Rebase-retry (2026-08-25): same race hardening as fetch-permits.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && break
            if [ "$i" = "3" ]; then echo "Push failed after 3 attempts"; exit 1; fi
            echo "Push attempt $i failed (another workflow moved main); retrying in 10s"
            # A failed rebase must be aborted before the retry: a worktree stuck
            # mid-rebase fails every subsequent pull with "already a rebase-merge
            # directory", so without this the second and third attempts cannot
            # even start. Same guard pipeline.yml and manual-records.yml carry.
            git rebase --abort 2>/dev/null || true
            sleep 10
          done

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline failure: ${context.workflow}`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
