name: Bill sync (Open States)

# Review-gated. Writes candidate worklists only; never touches
# master_opposition.csv. Safe to fail without holding up the map, the
# dashboard, or the Iowa sync.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max records to resolve this run (blank = all ready)"
        required: false
        default: ""
  schedule:
    # Mondays 07:10 UTC, after the 06:40 pipeline cron.
    - cron: "10 7 * * 1"

permissions:
  contents: write

concurrency:
  group: bill-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Self-test the stage ladder
        run: python bill_sync.py --selftest

      - name: Build offline worklist
        run: python bill_sync.py --extract

      - name: Resolve against Open States, then Congress.gov
        # The federal pass (spec 007) runs after the state pass and reads
        # CONGRESS_API_KEY. Without that key it is skipped and recorded in
        # data/bill_sync_federal.csv and the report; the step still passes.
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ -z "$OPENSTATES_API_KEY" ]; then
            echo "OPENSTATES_API_KEY not set; state lookup skipped, federal pass only."
            python bill_sync.py --federal
            exit 0
          fi
          if [ -n "$LIMIT" ]; then
            python bill_sync.py --resolve --limit "$LIMIT"
          else
            python bill_sync.py --resolve
          fi

      - name: Commit worklists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # --extract always writes bill_sync_worklist.csv and
          # bill_sync_federal.csv; the other four
          # files only exist after a successful --resolve run (i.e. when
          # OPENSTATES_API_KEY is set). Only add files that actually exist,
          # or `git add` fails on a missing pathspec before we ever reach
          # the "nothing to commit" check.
          FILES="data/bill_sync_worklist.csv data/bill_sync_matches.csv \
                  data/bill_status_review.csv data/bill_sync_report.md \
                  data/bill_sync_cache.json data/bill_sync_votes.csv \
                  data/bill_sync_federal.csv"
          EXISTING=""
          for f in $FILES; do
            [ -f "$f" ] && EXISTING="$EXISTING $f"
          done
          if [ -z "$EXISTING" ]; then
            echo "No worklist files were produced; nothing to commit."
            exit 0
          fi
          # shellcheck disable=SC2086 # EXISTING is a space-separated file list; splitting is intended
          git add $EXISTING
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bill sync worklists (Open States action histories) [skip ci]"
          # Rebase, resolve generated-file conflicts, push. See the script header.
          bash scripts/git_push_retry.sh
