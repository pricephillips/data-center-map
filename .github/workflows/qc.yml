name: Opposition QC Gate

# Runs the QC gate whenever the master CSV (or the gate code) changes, and on
# manual trigger. The CSV committed in the repo is the source of record, so the
# gate reads it directly. A red run means at least one record was blocked.
# Code lives in data-center-map/qc/; this file lives at .github/workflows/qc.yml.

# Data pushes are handled by pipeline.yml (which runs the same gate and
# commits the feed). Running both on master_opposition.csv duplicated the
# gate and raced two auto-commits on one push; this workflow now validates
# gate-code changes only.
on:
  workflow_dispatch:
  push:
    paths:
      - "qc/**"

permissions:
  contents: write          # lets the workflow push the refreshed clean feed back

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test the gate
        working-directory: qc
        run: python qc_pipeline.py --selftest

      - name: Self-test the verification filter (BLOCKING)
        run: python verification_status.py --selftest

      - name: Build the countable input (verification holdout)
        run: |
          # The gate reads the raw CSV directly, which still contains rows that
          # have no mechanism and only a Google News redirect for a citation.
          # pipeline.yml holds those out before cleaning; this workflow commits
          # qc/clean_export.json, so it must hold them out too or the two
          # committed artifacts disagree about what the database contains.
          python verification_status.py --write-countable qc/master_opposition_countable.csv

      - name: Run the QC gate
        working-directory: qc
        run: |
          python qc_pipeline.py --csv master_opposition_countable.csv --out qc_out || true
          test -f qc_out/clean_export.json

      - name: Enforce logical QC findings
        if: always()
        working-directory: qc
        run: |
          python - <<'PY'
          import json, sys
          from collections import Counter
          report = json.load(open('qc_out/qc_report.json', encoding='utf-8'))
          counts = Counter()
          for v in report.get('verdicts', []):
              for issue in v.get('issues', []):
                  counts[issue.get('code')] += 1
          gated = ['ACTION_COMPLETE_MISMATCH', 'STATUS_VOCAB']
          bad = {k: counts[k] for k in gated if counts[k] > 0}
          if bad:
              print('Failing due to QC logic findings:', bad)
              sys.exit(1)
          print('No gated logical QC findings.')
          PY

      - name: Post report to summary
        if: always()
        working-directory: qc
        run: cat qc_out/qc_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the clean feed back to the repo
        if: always()
        run: |
          rm -f qc/master_opposition_countable.csv
          cp qc/qc_out/clean_export.json qc/clean_export.json
          cp qc/qc_out/quarantine.json  qc/quarantine.json
          cp qc/qc_out/qc_report.md     qc/qc_report.md
          if [ -n "$(git status --porcelain qc/clean_export.json qc/quarantine.json qc/qc_report.md)" ]; then
            git config user.name  "qc-bot"
            git config user.email "qc-bot@users.noreply.github.com"
            git add qc/clean_export.json qc/quarantine.json qc/qc_report.md
            git commit -m "QC: refresh clean feed [skip ci]"
            # Rebase-retry (2026-08-25): this push raced pipeline/update
            # auto-commits and was rejected; same pattern as fetch-permits.
            for i in 1 2 3; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && break
              if [ "$i" = "3" ]; then echo "Push failed after 3 attempts"; exit 1; fi
              echo "Push attempt $i failed (another workflow moved main); retrying in 10s"
              sleep 10
            done
          else
            echo "No change to the clean feed."
          fi

      - name: Upload feed and quarantine as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc-output
          path: |
            qc/qc_out/clean_export.json
            qc/qc_out/quarantine.json
            qc/qc_out/qc_report.json
