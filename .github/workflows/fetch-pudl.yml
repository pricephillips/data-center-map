name: Fetch PUDL county generation features

# Reference-data acquisition. Writes data/county_pudl_features.csv only.
# Nothing downstream consumes it until county_aggregator.py explicitly joins
# it, so this workflow can fail without affecting the map, the dashboard, the
# clean feed, or the Iowa sync. No secret required; PUDL parquet outputs are
# public.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "PUDL release (a version tag; 'nightly' is not reproducible)"
        required: false
        default: "v2025.2.0"
      table:
        description: "PUDL table name"
        required: false
        default: "out_eia__yearly_generators"
      report_year:
        description: "Pin a single report year (blank sums across years)"
        required: false
        default: ""
  schedule:
    # Quarterly on the 3rd at 08:20 UTC, matching PUDL's versioned release
    # cadence rather than the nightly builds.
    - cron: "20 8 3 1,4,7,10 *"

permissions:
  contents: write

concurrency:
  group: fetch-pudl
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install parquet reader
        run: uv pip install --system -c requirements/ci.txt pyarrow

      - name: Self-test schema resolution and aggregation
        run: python fetch_pudl.py --selftest

      - name: Fetch and aggregate
        env:
          RELEASE: ${{ github.event.inputs.release || 'v2025.2.0' }}
          TABLE: ${{ github.event.inputs.table || 'out_eia__yearly_generators' }}
          REPORT_YEAR: ${{ github.event.inputs.report_year }}
        run: |
          ARGS="--fetch --release $RELEASE --table $TABLE"
          if [ -n "$REPORT_YEAR" ]; then
            ARGS="$ARGS --report-year $REPORT_YEAR"
          fi
          # shellcheck disable=SC2086 # ARGS holds several flags; splitting is intended
          python fetch_pudl.py $ARGS

      - name: Validate output against the county frame
        run: python fetch_pudl.py --validate

      - name: Commit reference file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/county_pudl_features.csv data/county_pudl_manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "PUDL county generation features (EIA 860/923 via Catalyst Cooperative, CC-BY-4.0) [reference data] [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "Push attempt $i failed, retrying in 10s"
            # A failed rebase must be aborted before the retry: a worktree stuck
            # mid-rebase fails every subsequent pull with "already a rebase-merge
            # directory", so without this the second and third attempts cannot
            # even start. Same guard pipeline.yml and manual-records.yml carry.
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Push failed after 3 attempts. If branch protection is enabled on main, allow github-actions[bot] to push or merge via PR."
          exit 1
