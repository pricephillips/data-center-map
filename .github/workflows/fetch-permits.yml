name: Fetch permit candidates

# Manual-dispatch acquisition of data-center permit records from public
# open-data portals, now also run on a passive weekly schedule against
# EVERY registered source: any configs/*.json carrying an "adapter" key
# (fetch_permits.py --list-sources is the discriminator). Registered
# 2026-08-21 so acquisition stays registry-driven; adding a jurisdiction
# is a config drop, never a workflow edit. workflow_dispatch still
# targets a single config for testing a new registration.
#
# Fully automated end to end: if a column-map exists for a source at
# configs/<source>_ingest.json, this workflow also runs permit_ingest.py
# right after the fetch and commits the result, so candidates flow into
# data/baseline_dated_external.csv the same run with no manual approval
# step. permit_ingest.py's own schema validation (required fields,
# terminal-status-only decision dates, dedup) is the safety net, not a
# human in the loop. A source with no ingest map yet just gets its
# candidates fetched and committed for someone to write the one-time
# column-map for; that is a one-time engineering task per new source, not
# a recurring approval step.

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Config file under configs/ (e.g. loudoun_lola.json)'
        required: true
        default: 'loudoun_lola.json'

  # Weekly on Tuesdays at 07:20 UTC, ahead of the Monday 07:10 UTC bill
  # sync so both acquisition jobs land candidates before the daily
  # 06:40 UTC pipeline run picks up anything already promoted.
  schedule:
    - cron: "20 7 * * 2"

permissions:
  contents: write

concurrency:
  group: fetch-permits
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve config list (scheduled runs cover every registered source)
        id: cfg
        run: |
          if [ -n "${{ github.event.inputs.config }}" ]; then
            echo "configs=${{ github.event.inputs.config }}" >> "$GITHUB_OUTPUT"
          else
            LIST=$(python fetch_permits.py --list-sources | tr '\n' ' ')
            echo "Registered sources: $LIST"
            echo "configs=$LIST" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover, fetch, and ingest each source
        run: |
          FAILED=""
          for NAME in ${{ steps.cfg.outputs.configs }}; do
            CFG="configs/$NAME"
            SOURCE="$(basename "$NAME" .json)"
            echo "=== $SOURCE ==="
            NEEDS=$(python -c "import json,sys; c=json.load(open(sys.argv[1])); print('yes' if (not c.get('url') and c.get('discovery')) else 'no')" "$CFG")
            if [ "$NEEDS" = "yes" ]; then
              python discover_arcgis_layer.py --config "$CFG" || true
            fi
            if ! python fetch_permits.py --config "$CFG"; then
              echo "FETCH FAILED for $SOURCE; continuing with remaining sources."
              FAILED="$FAILED $SOURCE"
              continue
            fi
            CANDIDATES="data/permit_candidates_${SOURCE}.csv"
            INGEST_CFG="configs/${SOURCE}_ingest.json"
            if [ ! -f "$INGEST_CFG" ]; then
              echo "No ingest column-map at $INGEST_CFG yet; candidates fetched only, not promoted."
              continue
            fi
            if [ ! -f "$CANDIDATES" ]; then
              echo "No candidate rows written for $SOURCE this run; nothing to ingest."
              continue
            fi
            if ! python permit_ingest.py --in "$CANDIDATES" --config "$INGEST_CFG" \
                --out data/baseline_dated_external.csv --append \
                --as-of "$(date -u +%Y-%m-%d)"; then
              echo "INGEST FAILED for $SOURCE; candidates kept, promotion skipped."
              FAILED="$FAILED $SOURCE"
            fi
          done
          # Failures do not stop other sources, but they must not pass
          # silently either: mark the job failed after everything ran, the
          # same visibility rule pipeline.yml uses for its gate steps.
          if [ -n "$FAILED" ]; then
            echo "Sources with failures:$FAILED"
            exit 1
          fi

      - name: Commit candidate and baseline files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/baseline_dated_external.csv and its rejects file only
          # exist once a source's ingest step has actually run at least
          # once (no ingest config yet -> neither file is written). Only
          # add literal paths that exist, or a single missing pathspec
          # aborts `git add` entirely and silently stages nothing at all,
          # including data/permit_candidates_*.csv which always exists.
          ls data/permit_candidates_*.csv >/dev/null 2>&1 && \
              git add data/permit_candidates_*.csv
          ls data/arcgis_discovery_*.json >/dev/null 2>&1 && \
              git add data/arcgis_discovery_*.json data/arcgis_discovery_*.md
          [ -f data/baseline_dated_external.csv ] && \
              git add data/baseline_dated_external.csv
          [ -f data/baseline_dated_external_rejects.csv ] && \
              git add data/baseline_dated_external_rejects.csv
          git diff --cached --quiet || git commit -m "Permit candidates fetched and ingested into dated baseline [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "Push attempt $i failed, retrying in 10s"
            sleep 10
          done
          echo "Push failed after 3 attempts. If branch protection is enabled on main, allow github-actions[bot] to push or merge via PR."
          exit 1
