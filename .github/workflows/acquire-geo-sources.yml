name: Acquire geo sources

# Acquisition jobs that need unrestricted egress and therefore cannot run
# from a sandbox. Both write CANDIDATE or reference files only; neither one
# touches master_opposition.csv, data/proposals.csv, or atlas.csv.
#
#   gazetteer   Census county-subdivision gazetteer -> data/place_gazetteer.csv.
#               This is the file that lets signal_harvest resolve a headline
#               that names a town rather than a county. Until it has run once
#               with network access the gazetteer is built from repo records
#               only, and gazetteer.py records that in its manifest as
#               national=false, which makes the resolver withhold its
#               uniqueness inference. So this job is not an optimization: it is
#               what turns the place pass on.
#
#   osm         OpenStreetMap data centers via Overpass ->
#               data/facility_candidates_osm.csv, gated into the registry by
#               facility_registry.py. Removes the dependency on the IM3 atlas
#               snapshot that configs/facility_sources.json records as
#               needs_manual_pin, since the atlas is OSM-derived and Overpass
#               is reachable where osti.gov is not.
#
#   boundaries  Census cartographic boundary counties (2024, 1:5m) ->
#               data/geo/counties_2024.topojson plus its manifest, the county
#               geometry every choropleth page draws on (spec 009). Simplified
#               with mapshaper to stay under 1 MB, then gated by
#               tests/ui/check_geometry.js: if any FIPS in
#               data/county_policy_scores.csv has no polygon the job fails
#               before committing. This job is the file's only writer.
#
# Weekly rather than nightly. Neither source moves fast, Overpass is a shared
# public endpoint that should not be hit harder than the data warrants, and the
# Census file changes once a year.

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Which acquisition to run: gazetteer, osm, both, boundaries, or all'
        required: false
        default: 'both'
  schedule:
    # Sundays 05:30 UTC, ahead of the Tuesday permit fetch and well clear of
    # the daily 06:40 UTC pipeline run.
    - cron: "30 5 * * 0"

# Each job commits its own outputs, so write access is granted per job.
permissions:
  contents: read

concurrency:
  group: acquire-geo-sources
  cancel-in-progress: false

jobs:
  acquire:
    if: ${{ github.event.inputs.job != 'boundaries' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Selftests first
        # A scheduled job that commits data should prove its own logic before
        # it writes any. These are offline and take seconds.
        run: |
          python gazetteer.py --selftest
          python fetch_osm_facilities.py --selftest
          python facility_registry.py --selftest

      - name: Build the place gazetteer
        if: ${{ github.event.inputs.job != 'osm' }}
        run: python gazetteer.py --build

      - name: Fetch OSM data center objects
        if: ${{ github.event.inputs.job != 'gazetteer' }}
        # Overpass throttles, and a throttled state is recorded and skipped
        # rather than fatal, so a partial run still commits what it got. The
        # non-zero exit on partial failure is deliberately not allowed to fail
        # the job for the same reason.
        run: python fetch_osm_facilities.py || true

      - name: Run the facility gate over the new candidates
        if: ${{ github.event.inputs.job != 'gazetteer' }}
        # Report only. Promotion into the registry stays an explicit
        # --promote run, exactly as it was before this workflow existed.
        run: python facility_registry.py

      - name: Commit what changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/place_gazetteer.csv data/place_gazetteer_manifest.json \
                   data/facility_candidates_osm.csv \
                   data/facility_candidates_osm_log.csv \
                   data/facility_promotion_report.csv \
                   data/facility_registry_summary.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Refresh place gazetteer and OSM facility candidates [skip ci]"
          # Rebase, resolve generated-file conflicts, push. See the script header.
          bash scripts/git_push_retry.sh

  boundaries:
    # Scheduled runs rebuild too: the Census file changes once a year, the
    # build is deterministic, and nothing is committed unless the geometry
    # itself changed.
    if: ${{ github.event_name == 'schedule' || github.event.inputs.job == 'boundaries' || github.event.inputs.job == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CB_URL: https://www2.census.gov/geo/tiger/GENZ2024/shp/cb_2024_us_county_5m.zip
      OUT: data/geo/counties_2024.topojson
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Selftest the coverage gate
        run: node tests/ui/check_geometry.js --selftest

      - name: Download the Census cartographic boundary file
        run: |
          mkdir -p "$RUNNER_TEMP/cb"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cb/cb.zip" "$CB_URL"
          unzip -o -q "$RUNNER_TEMP/cb/cb.zip" -d "$RUNNER_TEMP/cb"

      - name: Simplify and convert to TopoJSON
        # Territories other than Puerto Rico are dropped (outside every map's
        # frame). keep-shapes stops small county-equivalents such as Falls
        # Church, VA from simplifying away. The simplification is stepped down
        # until the file fits the 1 MB budget (SC-002); the coverage gate in the
        # next step is what decides whether the result is usable.
        run: |
          for pct in 12 9 7 5; do
            npx --yes mapshaper@0.7.69 -i "$RUNNER_TEMP/cb/cb_2024_us_county_5m.shp" \
              -filter '["60","66","69","78"].indexOf(STATEFP) < 0' \
              -simplify "${pct}%" keep-shapes \
              -each 'name = NAME' \
              -filter-fields GEOID,name \
              -rename-layers counties \
              -o "$OUT" format=topojson id-field=GEOID quantization=100000
            node -e '
              const fs = require("fs"); const f = process.argv[1];
              const t = JSON.parse(fs.readFileSync(f));
              t.objects.counties.geometries.forEach(g => { g.properties = { name: g.properties.name }; });
              fs.writeFileSync(f, JSON.stringify(t));' "$OUT"
            size=$(stat -c %s "$OUT")
            echo "simplify ${pct}%: ${size} bytes"
            [ "$size" -le 1000000 ] && break
          done

      - name: Coverage gate and manifest
        run: |
          node tests/ui/check_geometry.js --manifest \
            --source-url "$CB_URL" \
            --source-note "Census cartographic boundary counties 2024 1:5m; territories other than PR removed; mapshaper 0.7.69 -simplify keep-shapes, quantization=100000." \
            --vintage 2024 --scale 1:5m --state built

      - name: Commit what changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The manifest carries a build date, so it only moves with the
          # geometry; an unchanged rebuild commits nothing.
          if git diff --quiet -- "$OUT"; then
            git checkout -- data/geo/counties_2024_manifest.json
            echo "Geometry unchanged."
            exit 0
          fi
          git add "$OUT" data/geo/counties_2024_manifest.json
          git commit -m "Rebuild county geometry from Census cartographic boundaries [skip ci]"
          # Rebase, resolve generated-file conflicts, push. See the script header.
          bash scripts/git_push_retry.sh
