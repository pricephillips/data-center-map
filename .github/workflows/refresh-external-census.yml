name: Refresh external restriction census

on:
  workflow_dispatch:

  # Monthly, on the 3rd at 08:20 UTC.
  schedule:
    - cron: "20 8 3 * *"

permissions:
  contents: write

concurrency:
  group: external-census-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data-center-map
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test census refresh module
        run: python refresh_external_census.py --selftest

      # --merge was never a flag this module accepts. It has only ever
      # accepted --selftest and --refresh, so this workflow has failed on
      # every run since it was written and has never once been green. The
      # name was aspirational: the module refuses to merge by design, and
      # says so in its docstring -- the seeded census is the source of
      # record and only a person promotes into it.
      - name: Refresh external restriction census (writes a delta for review)
        run: python refresh_external_census.py --refresh

      - name: Commit the delta and report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage what the module actually writes. It previously staged
          # data/external_restriction_census.csv, which the module only ever
          # READS -- so even with a working invocation this step committed
          # nothing and discarded the delta, the one artifact the run exists
          # to produce. Each path is guarded separately because a single
          # missing pathspec aborts the whole `git add`, the same trap
          # documented in fetch-permits.yml.
          [ -f data/external_restriction_census_delta.csv ] && \
              git add data/external_restriction_census_delta.csv
          [ -f data/external_restriction_census_refresh_report.md ] && \
              git add data/external_restriction_census_refresh_report.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "External restriction census: monthly delta for review [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "Push attempt $i failed, retrying in 10s"
            sleep 10
          done
          echo "Push failed after 3 attempts. If branch protection is enabled on main, allow github-actions[bot] to push or merge via PR."
          exit 1
