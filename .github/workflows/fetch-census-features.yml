name: Fetch Census county features

on:
  workflow_dispatch:

  # Monthly, on the 5th at 08:05 UTC. ACS5/Gazetteer reference values move
  # slowly, so monthly keeps this current without churn; the spot-check
  # step still gates the commit so a bad pull cannot land silently.
  schedule:
    - cron: "5 8 5 * *"

permissions:
  contents: write

concurrency:
  group: fetch-census-features
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Fetch ACS + Gazetteer
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python fetch_census_features.py
      - name: Spot-check against pinned reference values
        run: python spot_check_census.py
      - name: Commit candidate reference file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/county_census_features.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Census county features (ACS5 2023 + Gazetteer) [reference data] [skip ci]"
          # Rebase, resolve generated-file conflicts, push. See the script header.
          bash scripts/git_push_retry.sh
