name: Harden Pipeline Publishing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make pipeline publishing resilient
        shell: python
        run: |
          from pathlib import Path
          import sys

          path = Path('.github/workflows/pipeline.yml')
          text = path.read_text(encoding='utf-8')

          old_title = 'name: Build Clean Feed\n'
          new_title = 'name: Build and Publish Clean Feed\n'
          concurrency = (
              '\n# This workflow writes generated artifacts to main. Serialize workflow writers\n'
              '# and preserve queued runs rather than cancelling completed data work.\n'
              'concurrency:\n'
              '  group: data-center-map-generated-artifacts-main\n'
              '  cancel-in-progress: false\n'
          )
          checkout = '          uses: actions/checkout@v4\n'
          checkout_with_history = (
              '          uses: actions/checkout@v4\n'
              '          with:\n'
              '            fetch-depth: 0\n'
          )
          old_push = '          git push\n'
          new_push = '\n'.join([
              '          # Preserve commits that land on main after checkout. Never force-push.',
              '          max_push_attempts=3',
              '          pushed=false',
              '          for attempt in $(seq 1 "$max_push_attempts"); do',
              '            if git push origin HEAD:main; then',
              '              echo "Generated artifacts pushed on attempt $attempt."',
              '              pushed=true',
              '              break',
              '            fi',
              '',
              '            if [ "$attempt" -eq "$max_push_attempts" ]; then',
              '              break',
              '            fi',
              '',
              '            echo "Push rejected; rebasing generated commit on origin/main (attempt $attempt)."',
              '            git fetch --no-tags origin main',
              '            if ! git rebase origin/main; then',
              '              git rebase --abort || true',
              '              echo "::error::Generated artifacts conflict with newer main. No force push was attempted."',
              '              exit 1',
              '            fi',
              '            sleep $((attempt * 2))',
              '          done',
              '',
              '          if [ "$pushed" != true ]; then',
              '            echo "::error::Push was rejected after $max_push_attempts attempts; main was not modified."',
              '            exit 1',
              '          fi',
              ''
          ])

          if 'group: data-center-map-generated-artifacts-main' not in text:
              if text.count(old_title) != 1:
                  sys.exit('Expected exactly one `name: Build Clean Feed` line; pipeline was not changed.')
              text = text.replace(old_title, new_title + concurrency, 1)
          elif text.count(old_title) == 1:
              text = text.replace(old_title, new_title, 1)

          if checkout_with_history not in text:
              if text.count(checkout) != 1:
                  sys.exit('Expected exactly one checkout step; pipeline was not changed.')
              text = text.replace(checkout, checkout_with_history, 1)

          if text.count(old_push) != 1:
              sys.exit('Expected exactly one plain `git push` line; pipeline was not changed.')
          text = text.replace(old_push, new_push, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit hardened pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pipeline.yml
          git diff --cached --quiet && { echo "No change needed."; exit 0; }
          git commit -m "Harden clean-feed publishing workflow [skip ci]"
          git push origin HEAD:main
