name: Build Clean Feed

# Runs the full data pipeline whenever the raw CSV changes:
#   raw master_opposition.csv  ->  verification holdout  ->  cleaner
#     ->  QC gate  ->  master_opposition_clean.csv
#   -> project resolution (event->project links + lifecycles)
#   -> county layer (county_aggregator -> county_policy_model -> county_policy_intervals)
#   -> FIPS resolution (census_geocode -> county_fips_overlay.csv)
#   -> coverage audit + restriction worklist (county recall vs external census)
#   -> detection layer (record staleness, adjacency re-scan, frame audits)
#   -> site screener (opposition environment tiers + movement report)
# then triggers the Iowa Notion sync.
#
# REPLACES notify-iowa-tracker.yml — this workflow now owns both the cleaning
# and the downstream dispatch, so cleaning always happens BEFORE the sync.
#
# Project resolution (Phase 1 of the modeling roadmap) is ADDITIVE and
# NON-BLOCKING for the map/dashboard: if it fails, the clean feed still
# commits and Iowa still syncs, but the job is marked failed so the
# regression is visible. It also runs when data/proposals.csv changes.
#
# Verification holdout (added 2026-07-24): verification_status.py holds rows
# with no mechanism and only a Google News redirect for a citation out of the
# feed build, so they cannot become project entities or block counts. The rows
# stay in master_opposition.csv; untagged_triage.py writes the review worklist
# for recovering them. Its self-tests are BLOCKING because a silent failure
# there would put unverified rows back into every count.
#
# Detection layer (added 2026-08-18): the three remaining root causes behind
# the TVA misses, all of which are detection rather than modeling problems.
# stale_pending_audit.py ages non-terminal records against per-mechanism
# thresholds and ranks by whether confirming one moves a county label (the
# Hamilton case). adjacency_scan.py turns each enacted county into a ranked
# check of its neighbours (the Walker and Grundy cases) and writes
# configs/local_meeting_watchlist.csv, which local_meeting_feed.py unions
# into its discovery and fetch frames so a county with zero tracker records
# can be polled at all. subframe_audit.py re-derives coverage inside a
# registered frame, because national recall averaged over 3,144 counties hid
# a 21 percent miss rate inside a 198-county deliverable. All three are
# reporting only and non-blocking: they queue work, they never move a label,
# a grade, or a status.
#
# County layer (added 2026-07-23): runs only if project resolution succeeded
# (county_aggregator reads data/project_lifecycles.csv; running it against a
# stale lifecycles file could pass QC while carrying wrong outcomes). Its
# hard QC gate exits nonzero on failure, and the commit step stages the five
# county artifacts ONLY when the county step succeeded, so a degraded layer
# is never auto-committed. Like project resolution, it is non-blocking for
# the clean feed and Iowa sync but surfaces as a job failure.

on:
  push:
    paths:
      # Data inputs.
      - 'master_opposition.csv'
      - 'data/proposals.csv'
      - 'data/project_links_manual.csv'
      - 'data/project_decision_dates.csv'
      - 'data/project_duplicates.csv'
      - 'atlas.csv'
      - 'data/county_census_features.csv'
      - 'data/county_votes.json'
      - 'data/county_fips_lookup.json'
      - 'configs/audit_frames.json'
      - 'configs/frames/*.csv'
      # Code that produces the artifacts. Without these, pushing a pipeline
      # change did not run the pipeline, so a module could ship and its
      # outputs would never be generated. That is why the screener, the
      # verification review files, and the FIPS overlay had never appeared in
      # the repo despite the code being present.
      - '*.py'
      - 'qc/*.py'
      - 'scripts/*.py'
      - '.github/workflows/pipeline.yml'
  # Safety net: a code path that somehow escapes the filter above, or an
  # upstream data file edited outside the repo, still gets a rebuild daily.
  # 06:40 UTC sits after the 11:15 UTC ingest of the prior day and before the
  # working day in the US.
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:

permissions:
  contents: write          # allows committing the generated clean feed back

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout data-center-map
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install pandas scikit-learn mapie

      - name: Gate — run self-tests (BLOCKING; a failure stops the build)
        run: |
          echo "Cleaner self-tests:"
          python clean_opposition_data.py --selftest
          echo "QC gate self-tests:"
          python qc/qc_pipeline.py --selftest || (cd qc && python qc_pipeline.py --selftest)
          echo "Verification status self-tests:"
          python verification_status.py --selftest
          echo "Untagged triage self-tests:"
          python untagged_triage.py --selftest
          echo "Entity splitter self-tests:"
          python entity_split.py --selftest
          echo "Leak audit self-tests:"
          python leak_audit.py --selftest
          echo "Group registry audit self-tests:"
          python group_registry_audit.py --selftest
          echo "Coverage audit self-tests:"
          python coverage_audit.py --selftest
          echo "Restriction worklist self-tests:"
          python restriction_worklist.py --selftest
          echo "Gap-to-candidate builder self-tests:"
          python census_gap_candidates.py --selftest
          echo "Staleness audit self-tests:"
          python stale_pending_audit.py --selftest
          echo "County adjacency self-tests:"
          python fetch_county_adjacency.py --selftest
          echo "Adjacency scan self-tests:"
          python adjacency_scan.py --selftest
          echo "Visibility audit self-tests:"
          python visibility_audit.py --selftest
          echo "Facility manifest self-tests:"
          python facility_manifest.py --selftest
          echo "Operations summary self-tests:"
          python operations_summary.py --selftest
          echo "Layer audit self-tests:"
          python layer_audit.py --selftest
          echo "Facility registry self-tests:"
          python facility_registry.py --selftest
          echo "Signal harvest self-tests:"
          python signal_harvest.py --selftest
          echo "Front-end syntax gate self-tests:"
          python scripts/check_inline_js.py --selftest
          # A syntax error in a page loader takes a client-visible surface
          # down silently, and nothing checked for one: the .js self-tests
          # existed but were in no workflow, so a broken chain could ship.
          echo "Front-end syntax (node --check over every module and inline block):"
          python scripts/check_inline_js.py
          echo "Front-end module self-tests:"
          node permalink_selftest.js
          node legend_filter_selftest.js
          node zoom_tier_selftest.js
          node facility_freshness_selftest.js
          echo "Frame audit self-tests:"
          python subframe_audit.py --selftest
          echo "Local meeting feed self-tests (watchlist union):"
          python local_meeting_feed.py --selftest

      - name: Run pipeline (clean -> gate -> clean feed)
        run: python build_clean_feed.py --in master_opposition.csv --out master_opposition_clean.csv

      - name: Entity and vocabulary audits (leak audit is a GATE)
        id: audits
        run: |
          # Repo-wide leak audit. Blocking tier must be zero; the three
          # internal triage columns are exempted inside the module per the
          # 2026-07-30 ruling (internal artifacts may quote raw vocabulary).
          python leak_audit.py
          # Registry defect audit: reporting only, never blocks. Rebuild of
          # the registry itself stays inside project_resolution's chain.
          python group_registry_audit.py || true

      - name: Verification status + untagged review worklist
        id: verification
        continue-on-error: true
        run: |
          python verification_status.py --report
          python untagged_triage.py

      - name: Auto-apply triage link suggestions (previous run's draft)
        id: link_autoapply
        continue-on-error: true
        # 2026-08-12: suggest_confirm / suggest_reject rows (high AND medium
        # confidence) apply directly to data/project_links_manual.csv;
        # needs_review stays manual. Runs BEFORE project_resolution so the
        # resolver consumes the applied links in this same run. Reviewer
        # decisions already in the manual file are never overwritten.
        run: python apply_link_suggestions.py --selftest && python apply_link_suggestions.py

      - name: Project resolution (links + lifecycles; includes leak audit)
        id: project_resolution
        continue-on-error: true
        run: python project_resolution.py && python control_group.py && python control_comparison.py && python triage_accelerator.py

      - name: County layer (aggregate QC gate -> enacted-restriction model)
        id: county_layer
        if: steps.project_resolution.outcome == 'success'
        continue-on-error: true
        run: |
          python county_aggregator.py && python county_policy_model.py
          # Conformal + Venn-Abers intervals on the county model. Additive:
          # rebuilds the selected spec from the metrics JSON and never selects
          # its own. A failure here must not take down the county scores, so
          # it is fenced with its own error surface below.
          python county_policy_intervals.py --selftest
          python county_policy_intervals.py

      - name: Coverage audit + restriction worklist (county recall)
        id: coverage
        if: steps.county_layer.outcome == 'success'
        continue-on-error: true
        run: |
          # Runs AFTER the county layer, not before it. The audit compares
          # the external census against has_enacted_restrictive, so running
          # it in the earlier audit block measured the PREVIOUS run's labels
          # and would have reported a repaired label as still broken.
          # Reporting only: the census is a manually curated lower bound and
          # its absence or staleness must never fail the build.
          python coverage_audit.py
          # Worklist regeneration is merge-preserving: reviewer-entered
          # sources and resolutions already committed to the worklist are
          # carried forward, so an auto-commit cannot discard research.
          python restriction_worklist.py
          # Gap-to-candidate builder (2026-08-21) + gated auto-promotion
          # (2026-08-25, replacing manual review at Price's direction): any
          # census-enacted county with no tracker record gets a fully
          # populated ingest candidate; rows passing the promotion gate
          # (complete, dated, sourced, dedup-guarded, census-corroborated)
          # append to master_opposition.csv, and failing rows stay in
          # data/restriction_ingest_candidates.csv as the exception queue.
          # Every decision lands in data/gap_promotion_report.csv. Promoted
          # rows enter the feed and the county label on the NEXT nightly
          # run; a builder failure must not fail the audit.
          python census_gap_candidates.py --promote || true

      - name: Detection layer (staleness, adjacency re-scan, frame audits)
        id: detection
        if: steps.coverage.outcome == 'success'
        continue-on-error: true
        run: |
          # Runs AFTER the coverage audit: adjacency_scan.py seeds off
          # data/coverage_gap_report.csv as well as the county label, so a
          # census-enacted county with no tracker record still radiates
          # diffusion pressure onto its neighbours.
          python stale_pending_audit.py
          # County borders do not move. The adjacency table is built once and
          # committed; a rebuild only happens if the file is missing, so the
          # daily run never re-fetches the 3 MB county geojson.
          if [ ! -f data/county_adjacency.csv ]; then
            python fetch_county_adjacency.py
          fi
          python adjacency_scan.py
          # Frame audits for the two live bounded deliverables. Reporting
          # only here: --gate is for the pre-delivery check, not for CI,
          # because a provisional frame must not fail the nightly build.
          # Registry-driven (2026-08-21): every frame in
          # configs/audit_frames.json is audited; adding an engagement
          # frame is a JSON entry, never an edit here.
          python subframe_audit.py --all

      - name: FIPS resolution (Census geocoder; overlay for the screener)
        id: fips_resolution
        if: steps.county_layer.outcome == 'success'
        continue-on-error: true
        run: |
          # Runs after the county layer because it validates every resolved
          # FIPS against data/county_aggregate.csv, which is the current
          # county universe. Results are cached in data/geocode_cache.csv, so
          # a steady-state run makes no API calls at all. --limit caps a cold
          # start so one run cannot sit on the Census endpoint.
          python census_geocode.py --selftest
          python census_geocode.py --limit 40

      - name: Site screener (client-facing opposition environment tiers + movement)
        id: site_screener
        if: steps.county_layer.outcome == 'success'
        continue-on-error: true
        run: python site_screener.py --selftest && python site_screener.py --batch

      - name: Facility layer (registry + freshness manifest)
        id: facility_manifest
        continue-on-error: true
        run: |
          # Layer A registry: derived from the declared snapshots, never
          # rewriting them, with a stable facility_id so a project that
          # reaches operating status has somewhere to graduate to. Reporting
          # only: without --promote the gate runs and records what would be
          # promoted, exactly as the census gap builder did before promotion
          # was turned on.
          python facility_registry.py
          # Publishes rows, repository change date and declared upstream
          # vintage for every Layer A snapshot, so the Infrastructure
          # surfaces can state their own provenance instead of showing
          # undated counts. Reporting only: an undeclared vintage is a true
          # statement about the data, not a build failure.
          python facility_manifest.py

      - name: Dataset barriers (one writer per file, no undeclared crossings)
        id: layer_audit
        continue-on-error: true
        run: |
          # Reporting only in CI. A new generated file with no declared layer
          # is a nag, not a build failure; --strict is for the pre-delivery
          # check. See ARCHITECTURE.md for the two rules and the four
          # declared exceptions.
          python layer_audit.py

      - name: Operations summary (audit trails into one client-loadable artifact)
        id: operations_summary
        continue-on-error: true
        run: |
          # Runs after the coverage, detection and promotion steps so the
          # summary reflects this run's trails. Every input is optional: a
          # missing one becomes a null section and the page omits the panel,
          # which is why this can never fail the build.
          python operations_summary.py

      - name: Surface visibility audit (what the client can see vs what exists)
        id: visibility
        continue-on-error: true
        run: |
          # Runs last, after every generator, so the inventory reflects this
          # run rather than the previous one. Reporting only: an output with
          # no disposition is a decision nobody has made yet, not a build
          # failure. --strict is for a pre-delivery check, not for CI.
          python visibility_audit.py

      - name: Commit generated feed + reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add master_opposition_clean.csv \
                  quarantine.json qc_report.md data_quality_report.md change_log.csv \
                  review_conflicts.csv review_stale_pending.csv group_registry.csv \
                  date_recovery_report.csv snapshots/manifest.csv \
                  validation_sample.csv headline_metrics.md CODEBOOK.md \
                  data/project_links.csv data/project_lifecycles.csv \
                  data/project_link_review.csv \
                  data/baseline_universe.csv data/matched_controls.csv \
                  data/control_group_notes.md data/control_comparison.md \
                  data/project_links_manual_draft.csv \
                  data/project_links_manual.csv 2>/dev/null || true
          # Verification artifacts are staged only on a green verification
          # step. verification_holdout.csv is written by the feed build itself,
          # so it is staged with the feed above and refreshed here.
          if [ "${{ steps.verification.outcome }}" = "success" ]; then
            git add data/verification_status_report.md data/verification_holdout.csv \
                    data/untagged_triage.csv data/untagged_triage.md 2>/dev/null || true
          fi
          # County artifacts are staged ONLY on a green county step, so a
          # QC-gate or leak-audit failure can never auto-commit a degraded
          # layer. A skipped or failed step leaves the last good layer in
          # place untouched.
          if [ "${{ steps.county_layer.outcome }}" = "success" ]; then
            git add data/county_aggregate.csv data/county_aggregate_manifest.json \
                    data/county_policy_scores.csv data/county_policy_intervals.csv data/county_policy_intervals.md data/county_policy_metrics.json \
                    data/county_policy_report.md 2>/dev/null || true
          fi
          # Audit artifacts. group_registry_audit runs in the always-on
          # audit block; the coverage audit and worklist are staged only on
          # a green coverage step, so a partial run cannot commit a recall
          # number that no longer matches the committed county layer. These
          # paths were absent from the glob entirely, which is why the audit
          # outputs ran in CI but never appeared in the repo.
          git add data/group_registry_audit.csv \
                  data/group_registry_audit_summary.json 2>/dev/null || true
          if [ "${{ steps.visibility.outcome }}" = "success" ]; then
            git add docs/visibility_matrix.md 2>/dev/null || true
          fi
          if [ "${{ steps.facility_manifest.outcome }}" = "success" ]; then
            git add data/facility_manifest.json data/facility_registry.csv \
                    data/facility_registry_summary.json \
                    data/facility_promotion_report.csv 2>/dev/null || true
          fi
          if [ "${{ steps.operations_summary.outcome }}" = "success" ]; then
            git add data/operations_summary.json 2>/dev/null || true
          fi
          if [ "${{ steps.layer_audit.outcome }}" = "success" ]; then
            git add data/layer_audit.csv data/layer_audit_summary.json 2>/dev/null || true
          fi
          if [ "${{ steps.coverage.outcome }}" = "success" ]; then
            git add data/coverage_gap_report.csv data/coverage_gap_summary.json \
                    data/national_restriction_worklist.csv \
                    data/restriction_ingest_template.csv \
                    data/restriction_ingest_candidates.csv \
                    data/restriction_ingest_candidates.md \
                    data/gap_promotion_report.csv \
                    master_opposition.csv \
                    data/restriction_worklist.md 2>/dev/null || true
          fi
          # Detection-layer artifacts are staged only on a green detection
          # step. The watchlist is merge-preserving inside adjacency_scan.py,
          # so an auto-commit cannot discard a reviewer's note, and the
          # adjacency table is committed so the geojson is never re-fetched.
          if [ "${{ steps.detection.outcome }}" = "success" ]; then
            git add data/stale_pending_worklist.csv \
                    data/stale_pending_summary.json \
                    data/stale_pending_report.md \
                    data/county_adjacency.csv \
                    data/county_adjacency_manifest.json \
                    data/adjacency_scan_queue.csv \
                    data/adjacency_scan_summary.json \
                    data/adjacency_scan_report.md \
                    data/subframe_audit_*.csv data/subframe_audit_*.md \
                    configs/local_meeting_watchlist.csv 2>/dev/null || true
          fi
          # FIPS overlay, its review file, and the geocode cache are staged
          # only on a green resolution step. The cache is append-only, so
          # committing it is what keeps the steady-state API call count at zero.
          if [ "${{ steps.fips_resolution.outcome }}" = "success" ]; then
            git add data/county_fips_overlay.csv data/fips_resolution_review.csv \
                    data/fips_resolution_report.md data/geocode_cache.csv 2>/dev/null || true
          fi
          # Screener artifacts are staged ONLY on a green screener step. The
          # history file is append-only and idempotent within a day, so a
          # re-run on the same date replaces that date's snapshot rather than
          # doubling it.
          if [ "${{ steps.site_screener.outcome }}" = "success" ]; then
            git add data/site_screen.csv data/site_screen_history.csv \
                    data/site_screen_movers.md 2>/dev/null || true
          fi
          git diff --staged --quiet || git commit -m "Auto-build clean feed from master_opposition.csv [skip ci]"
          # Rebase-retry (2026-08-25): same race hardening as fetch-permits.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            if [ "$i" = "3" ]; then echo "Push failed after 3 attempts"; exit 1; fi
            echo "Push attempt $i failed (another workflow moved main); retrying in 10s"
            sleep 10
          done

      - name: Trigger Iowa Notion sync
        if: success() || steps.verification.outcome == 'failure' || steps.project_resolution.outcome == 'failure' || steps.county_layer.outcome == 'failure' || steps.coverage.outcome == 'failure' || steps.detection.outcome == 'failure' || steps.fips_resolution.outcome == 'failure' || steps.site_screener.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          # Cross-repo dispatch needs a PAT with repo scope (the default
          # GITHUB_TOKEN cannot trigger workflows in another repository).
          # Create a fine-grained or classic PAT and store it as
          # IOWA_DISPATCH_TOKEN in this repo's Actions secrets.
          github-token: ${{ secrets.IOWA_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'pricephillips',
              repo: 'iowa-dc-tracker',
              event_type: 'csv-updated'
            });

      - name: Surface verification failure (visible, non-blocking)
        if: steps.verification.outcome == 'failure'
        run: |
          echo "::error::verification_status.py or untagged_triage.py failed. The holdout inside build_clean_feed.py still applied, so no unverified row entered the feed; only the review artifacts are stale."
          exit 1

      - name: Surface project-resolution failure (visible, non-blocking)
        if: steps.project_resolution.outcome == 'failure'
        run: |
          echo "::error::project_resolution.py failed (link build or leak audit). Clean feed and Iowa sync were unaffected."
          exit 1

      - name: Surface county-layer failure (visible, non-blocking)
        if: steps.county_layer.outcome == 'failure'
        run: |
          echo "::error::County layer failed (aggregate QC gate, policy model, or leak audit). County artifacts were NOT committed; the last good layer remains in place. Clean feed and Iowa sync were unaffected."
          exit 1

      - name: Surface coverage-audit failure (visible, non-blocking)
        if: steps.coverage.outcome == 'failure'
        run: |
          echo "::error::coverage_audit.py or restriction_worklist.py failed. Recall and worklist artifacts were NOT committed; the last good versions remain in place. Clean feed, county layer, and Iowa sync were unaffected."
          exit 1

      - name: Surface detection-layer failure (visible, non-blocking)
        if: steps.detection.outcome == 'failure'
        run: |
          echo "::error::A detection-layer module failed (staleness audit, adjacency table, adjacency scan, or a frame audit). No detection artifacts were committed; the last good versions remain in place. The clean feed, county layer, coverage audit, and Iowa sync were unaffected. Note that the adjacency scan exits nonzero when data/county_adjacency.csv is absent and the geojson fetch also failed."
          exit 1

      - name: Surface FIPS-resolution failure (visible, non-blocking)
        if: steps.fips_resolution.outcome == 'failure'
        run: |
          echo "::error::census_geocode.py failed (self-tests or resolution). The overlay was NOT committed; the screener falls back to the name lookup, which leaves the unresolved and retired-code rows without a county score. Clean feed, county layer, and Iowa sync were unaffected."
          exit 1

      - name: Surface site-screener failure (visible, non-blocking)
        if: steps.site_screener.outcome == 'failure'
        run: |
          echo "::error::site_screener.py failed (self-tests, batch scoring, or leak audit). Screener artifacts were NOT committed; the last good screen remains in place. Clean feed, county layer, and Iowa sync were unaffected."
          exit 1
