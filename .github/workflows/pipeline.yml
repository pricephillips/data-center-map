name: Build Clean Feed

# Runs the full data pipeline whenever the raw CSV changes:
#   raw master_opposition.csv  ->  verification holdout  ->  cleaner
#     ->  QC gate  ->  master_opposition_clean.csv
#   -> project resolution (event->project links + lifecycles)
#   -> county layer (county_aggregator -> county_policy_model -> county_policy_intervals)
#   -> FIPS resolution (census_geocode -> county_fips_overlay.csv)
#   -> site screener (opposition environment tiers + movement report)
# then triggers the Iowa Notion sync.
#
# REPLACES notify-iowa-tracker.yml — this workflow now owns both the cleaning
# and the downstream dispatch, so cleaning always happens BEFORE the sync.
#
# Project resolution (Phase 1 of the modeling roadmap) is ADDITIVE and
# NON-BLOCKING for the map/dashboard: if it fails, the clean feed still
# commits and Iowa still syncs, but the job is marked failed so the
# regression is visible. It also runs when data/proposals.csv changes.
#
# Verification holdout (added 2026-07-24): verification_status.py holds rows
# with no mechanism and only a Google News redirect for a citation out of the
# feed build, so they cannot become project entities or block counts. The rows
# stay in master_opposition.csv; untagged_triage.py writes the review worklist
# for recovering them. Its self-tests are BLOCKING because a silent failure
# there would put unverified rows back into every count.
#
# County layer (added 2026-07-23): runs only if project resolution succeeded
# (county_aggregator reads data/project_lifecycles.csv; running it against a
# stale lifecycles file could pass QC while carrying wrong outcomes). Its
# hard QC gate exits nonzero on failure, and the commit step stages the five
# county artifacts ONLY when the county step succeeded, so a degraded layer
# is never auto-committed. Like project resolution, it is non-blocking for
# the clean feed and Iowa sync but surfaces as a job failure.

on:
  push:
    paths:
      # Data inputs.
      - 'master_opposition.csv'
      - 'data/proposals.csv'
      - 'data/project_links_manual.csv'
      - 'data/project_decision_dates.csv'
      - 'data/project_duplicates.csv'
      - 'atlas.csv'
      - 'data/county_census_features.csv'
      - 'data/county_votes.json'
      - 'data/county_fips_lookup.json'
      # Code that produces the artifacts. Without these, pushing a pipeline
      # change did not run the pipeline, so a module could ship and its
      # outputs would never be generated. That is why the screener, the
      # verification review files, and the FIPS overlay had never appeared in
      # the repo despite the code being present.
      - '*.py'
      - 'qc/*.py'
      - 'scripts/*.py'
      - '.github/workflows/pipeline.yml'
  # Safety net: a code path that somehow escapes the filter above, or an
  # upstream data file edited outside the repo, still gets a rebuild daily.
  # 06:40 UTC sits after the 11:15 UTC ingest of the prior day and before the
  # working day in the US.
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:

permissions:
  contents: write          # allows committing the generated clean feed back

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout data-center-map
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas scikit-learn mapie

      - name: Gate — run self-tests (BLOCKING; a failure stops the build)
        run: |
          echo "Cleaner self-tests:"
          python clean_opposition_data.py --selftest
          echo "QC gate self-tests:"
          python qc/qc_pipeline.py --selftest || (cd qc && python qc_pipeline.py --selftest)
          echo "Verification status self-tests:"
          python verification_status.py --selftest
          echo "Untagged triage self-tests:"
          python untagged_triage.py --selftest
          echo "Entity splitter self-tests:"
          python entity_split.py --selftest
          echo "Leak audit self-tests:"
          python leak_audit.py --selftest
          echo "Group registry audit self-tests:"
          python group_registry_audit.py --selftest
          echo "Coverage audit self-tests:"
          python coverage_audit.py --selftest

      - name: Run pipeline (clean -> gate -> clean feed)
        run: python build_clean_feed.py --in master_opposition.csv --out master_opposition_clean.csv

      - name: Entity and vocabulary audits (leak audit is a GATE)
        id: audits
        run: |
          # Repo-wide leak audit. Blocking tier must be zero; the three
          # internal triage columns are exempted inside the module per the
          # 2026-07-30 ruling (internal artifacts may quote raw vocabulary).
          python leak_audit.py
          # Registry defect audit: reporting only, never blocks. Rebuild of
          # the registry itself stays inside project_resolution's chain.
          python group_registry_audit.py || true
          # Coverage audit: recall of the county restriction layer against
          # the external census. Reporting only; the census is a manually
          # curated lower bound and its absence must not fail the build.
          python coverage_audit.py || true

      - name: Verification status + untagged review worklist
        id: verification
        continue-on-error: true
        run: |
          python verification_status.py --report
          python untagged_triage.py

      - name: Project resolution (links + lifecycles; includes leak audit)
        id: project_resolution
        continue-on-error: true
        run: python project_resolution.py && python control_group.py && python control_comparison.py && python triage_accelerator.py

      - name: County layer (aggregate QC gate -> enacted-restriction model)
        id: county_layer
        if: steps.project_resolution.outcome == 'success'
        continue-on-error: true
        run: |
          python county_aggregator.py && python county_policy_model.py
          # Conformal + Venn-Abers intervals on the county model. Additive:
          # rebuilds the selected spec from the metrics JSON and never selects
          # its own. A failure here must not take down the county scores, so
          # it is fenced with its own error surface below.
          python county_policy_intervals.py --selftest
          python county_policy_intervals.py

      - name: FIPS resolution (Census geocoder; overlay for the screener)
        id: fips_resolution
        if: steps.county_layer.outcome == 'success'
        continue-on-error: true
        run: |
          # Runs after the county layer because it validates every resolved
          # FIPS against data/county_aggregate.csv, which is the current
          # county universe. Results are cached in data/geocode_cache.csv, so
          # a steady-state run makes no API calls at all. --limit caps a cold
          # start so one run cannot sit on the Census endpoint.
          python census_geocode.py --selftest
          python census_geocode.py --limit 40

      - name: Site screener (client-facing opposition environment tiers + movement)
        id: site_screener
        if: steps.county_layer.outcome == 'success'
        continue-on-error: true
        run: python site_screener.py --selftest && python site_screener.py --batch

      - name: Commit generated feed + reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add master_opposition_clean.csv \
                  quarantine.json qc_report.md data_quality_report.md change_log.csv \
                  review_conflicts.csv review_stale_pending.csv group_registry.csv \
                  date_recovery_report.csv snapshots/manifest.csv \
                  validation_sample.csv headline_metrics.md CODEBOOK.md \
                  data/project_links.csv data/project_lifecycles.csv \
                  data/project_link_review.csv \
                  data/baseline_universe.csv data/matched_controls.csv \
                  data/control_group_notes.md data/control_comparison.md \
                  data/project_links_manual_draft.csv 2>/dev/null || true
          # Verification artifacts are staged only on a green verification
          # step. verification_holdout.csv is written by the feed build itself,
          # so it is staged with the feed above and refreshed here.
          if [ "${{ steps.verification.outcome }}" = "success" ]; then
            git add data/verification_status_report.md data/verification_holdout.csv \
                    data/untagged_triage.csv data/untagged_triage.md 2>/dev/null || true
          fi
          # County artifacts are staged ONLY on a green county step, so a
          # QC-gate or leak-audit failure can never auto-commit a degraded
          # layer. A skipped or failed step leaves the last good layer in
          # place untouched.
          if [ "${{ steps.county_layer.outcome }}" = "success" ]; then
            git add data/county_aggregate.csv data/county_aggregate_manifest.json \
                    data/county_policy_scores.csv data/county_policy_intervals.csv data/county_policy_intervals.md data/county_policy_metrics.json \
                    data/county_policy_report.md 2>/dev/null || true
          fi
          # FIPS overlay, its review file, and the geocode cache are staged
          # only on a green resolution step. The cache is append-only, so
          # committing it is what keeps the steady-state API call count at zero.
          if [ "${{ steps.fips_resolution.outcome }}" = "success" ]; then
            git add data/county_fips_overlay.csv data/fips_resolution_review.csv \
                    data/fips_resolution_report.md data/geocode_cache.csv 2>/dev/null || true
          fi
          # Screener artifacts are staged ONLY on a green screener step. The
          # history file is append-only and idempotent within a day, so a
          # re-run on the same date replaces that date's snapshot rather than
          # doubling it.
          if [ "${{ steps.site_screener.outcome }}" = "success" ]; then
            git add data/site_screen.csv data/site_screen_history.csv \
                    data/site_screen_movers.md 2>/dev/null || true
          fi
          git diff --staged --quiet || git commit -m "Auto-build clean feed from master_opposition.csv [skip ci]"
          git push

      - name: Trigger Iowa Notion sync
        if: success() || steps.verification.outcome == 'failure' || steps.project_resolution.outcome == 'failure' || steps.county_layer.outcome == 'failure' || steps.fips_resolution.outcome == 'failure' || steps.site_screener.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          # Cross-repo dispatch needs a PAT with repo scope (the default
          # GITHUB_TOKEN cannot trigger workflows in another repository).
          # Create a fine-grained or classic PAT and store it as
          # IOWA_DISPATCH_TOKEN in this repo's Actions secrets.
          github-token: ${{ secrets.IOWA_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'pricephillips',
              repo: 'iowa-dc-tracker',
              event_type: 'csv-updated'
            });

      - name: Surface verification failure (visible, non-blocking)
        if: steps.verification.outcome == 'failure'
        run: |
          echo "::error::verification_status.py or untagged_triage.py failed. The holdout inside build_clean_feed.py still applied, so no unverified row entered the feed; only the review artifacts are stale."
          exit 1

      - name: Surface project-resolution failure (visible, non-blocking)
        if: steps.project_resolution.outcome == 'failure'
        run: |
          echo "::error::project_resolution.py failed (link build or leak audit). Clean feed and Iowa sync were unaffected."
          exit 1

      - name: Surface county-layer failure (visible, non-blocking)
        if: steps.county_layer.outcome == 'failure'
        run: |
          echo "::error::County layer failed (aggregate QC gate, policy model, or leak audit). County artifacts were NOT committed; the last good layer remains in place. Clean feed and Iowa sync were unaffected."
          exit 1

      - name: Surface FIPS-resolution failure (visible, non-blocking)
        if: steps.fips_resolution.outcome == 'failure'
        run: |
          echo "::error::census_geocode.py failed (self-tests or resolution). The overlay was NOT committed; the screener falls back to the name lookup, which leaves the unresolved and retired-code rows without a county score. Clean feed, county layer, and Iowa sync were unaffected."
          exit 1

      - name: Surface site-screener failure (visible, non-blocking)
        if: steps.site_screener.outcome == 'failure'
        run: |
          echo "::error::site_screener.py failed (self-tests, batch scoring, or leak audit). Screener artifacts were NOT committed; the last good screen remains in place. Clean feed, county layer, and Iowa sync were unaffected."
          exit 1
