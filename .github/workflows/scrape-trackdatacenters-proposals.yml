name: Scrape TrackDataCenters proposals

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # proposal_history.py reads every committed snapshot of
          # data/proposals.csv; a shallow clone would see one.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Selftest
        run: |
          python scripts/scrape-trackdatacenters-proposals.py --selftest
          python proposal_history.py --selftest
          python project_id_rekey.py --selftest
          python project_key_map.py --selftest

      - name: Run scraper
        id: scrape
        run: python scripts/scrape-trackdatacenters-proposals.py --out data/proposals.csv

      # Keeps the hand-maintained Layer B files keyed to their projects
      # (Ruling 5, 2026-09-28). Right after the scrape and before the commit,
      # so a renumbering and the rewrite of the id cells it forces land in one
      # commit. Rewrites only id cells whose project moved; holds ambiguous
      # matches, orphans and unknown ids for a person; writes nothing when
      # more than 15% of known projects vanished. A no-op until
      # `python project_key_map.py --init` has been run and committed once.
      - name: Sync the project key map
        id: keymap
        if: steps.scrape.outcome == 'success'
        run: python project_key_map.py

      # if: always() is the point of this step, not a detail. The population
      # guard stops the scraper by design when a column collapses, and that is
      # exactly the run whose field audit someone needs to read. Without this
      # the audit is written to the runner's disk and thrown away with it: the
      # diagnostic went missing precisely when it had something to say, which
      # is what happened on 2026-09-13 and 2026-09-14.
      #
      # Committing after a failure is safe because the guard raises before
      # data/proposals.csv is written. On a guard failure that file is
      # unchanged and only the audit lands; on success both go together.
      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `|| true` matters: run blocks execute under `bash -e`, so a bare
          # `[ -f x ] && git add x` aborts the whole step the first time the
          # file is absent.
          if [ -f data/proposals.csv ]; then git add data/proposals.csv; fi
          if [ -f data/scraper_field_audit.md ]; then git add data/scraper_field_audit.md; fi
          if [ -f data/proposals_detail.json ]; then git add data/proposals_detail.json; fi
          if [ "${{ steps.keymap.outcome }}" = "success" ]; then
            for f in data/project_key_map.csv data/project_key_aliases.csv \
                     data/layer_b_anchors.csv data/project_key_map_report.md \
                     data/proposals_manual_overlay.csv data/project_decision_dates.csv \
                     data/project_links_manual.csv data/project_duplicates.csv \
                     data/negative_audit_codings.csv; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          # Name what actually happened. There are three outcomes here, not
          # two, and the missing third one made every quiet day look like a
          # broken pipeline: on 2026-09-18 the scrape ran green, the guard
          # passed, and the source simply had nothing new, so proposals.csv
          # came out byte-identical and staged nothing. The old test read that
          # as "the scrape did not write proposals.csv" and committed it as
          # such. A green run that reports itself blocked, every day the
          # source is quiet, is how a real blockage gets ignored.
          #
          # Whether the file CHANGED cannot answer whether it was WRITTEN. The
          # scraper step's own outcome can, so that is what decides it.
          if [ "${{ steps.scrape.outcome }}" != "success" ]; then
            MSG="chore: scrape blocked before writing proposals.csv; field audit only"
          elif git diff --cached --name-only | grep -qx 'data/proposals.csv'; then
            MSG="chore: update proposals csv from trackdatacenters"
          else
            MSG="chore: no upstream changes; refreshed scraper field audit"
          fi
          git commit -m "$MSG [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"

          # Id stability check (2026-09-28). The source renumbered its ids on
          # 2026-09-17 and 2026-09-22 and every hand-maintained file keyed on
          # prj_<id> silently followed the number instead of the project. The
          # history miner needs this run's snapshot committed (it reads git),
          # which is why it runs here, after the commit and before the push.
          # project_id_rekey.py runs in REPORT mode: the constitution (VII)
          # keeps automated output from rewriting hand-maintained files, so a
          # stale key opens an issue and a person runs --apply.
          if [ "${{ steps.scrape.outcome }}" = "success" ]; then
            python proposal_history.py || echo "::warning::proposal_history failed"
            python project_id_rekey.py || echo "::warning::project_id_rekey failed"
            git add data/pipeline_intel_events.csv data/pipeline_intel_project_history.csv \
                    data/pipeline_intel_history.json data/pipeline_intel_id_crosswalk.csv \
                    data/pipeline_intel_id_timeline.csv \
                    data/pipeline_intel_rekey_report.csv data/pipeline_intel_rekey_report.md 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "chore: proposal history + id re-key report [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            fi
            if [ -f data/pipeline_intel_rekey_report.csv ] && grep -q ",rekey," data/pipeline_intel_rekey_report.csv; then
              echo "REKEY_NEEDED=1" >> "$GITHUB_ENV"
            fi
          fi
          for _ in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Push failed after 3 attempts"; exit 1

      - name: Open an issue when hand-maintained rows point at the wrong project
        if: env.REKEY_NEEDED == '1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Source ids moved: hand-maintained rows need re-keying';
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            if (open.data.some(i => i.title === title)) return;
            github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: 'The nightly scrape found rows in the overlay, decision dates, manual links, duplicates or negative-audit codings whose source id now belongs to a different project. Review `data/pipeline_intel_rekey_report.md`, then run `python project_id_rekey.py --apply` and commit.\n\nRun: ' + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline failure: ${context.workflow}`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
